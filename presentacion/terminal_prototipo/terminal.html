<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Vallis Runica -- Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ambar: #ffb000;
    --ambar-tenue: #8a5a10;
    --ambar-fuerte: #ffd27a;
    --fondo: #0a0500;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: #000;
    font-family: 'JetBrains Mono', "Courier New", ui-monospace, monospace;
    color: var(--ambar);
    height: 100%;
  }
  .layout {
    display: grid;
    grid-template-columns: 3fr 1.1fr;
    grid-template-rows: 1fr;
    gap: 10px;
    height: 100vh;
    padding: 10px;
  }
  .col-derecha {
    display: grid;
    grid-template-rows: 1.3fr 1fr 0.8fr 0.9fr;
    gap: 10px;
    min-height: 0;
  }
  .terminal {
    position: relative;
    background: var(--fondo);
    border: 2px solid var(--ambar-tenue);
    border-radius: 4px;
    box-shadow: 0 0 12px rgba(255,176,0,0.15) inset, 0 0 8px rgba(255,176,0,0.08);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .titulo {
    flex: 0 0 auto;
    font-size: 12px;
    letter-spacing: 2px;
    padding: 4px 10px;
    background: linear-gradient(180deg, rgba(255,176,0,0.18), rgba(255,176,0,0.02));
    border-bottom: 1px solid var(--ambar-tenue);
    color: var(--ambar);
    text-shadow: 0 0 6px rgba(255,176,0,0.8);
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  .titulo-controles { display: flex; align-items: center; gap: 8px; }
  .cuerpo {
    flex: 1 1 auto;
    overflow: auto;
    padding: 8px 10px;
    font-size: 13px;
    line-height: 1.15;
  }
  .crt-overlay {
    position: fixed; inset: 0; pointer-events: none; z-index: 50;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.18) 0px, rgba(0,0,0,0.18) 1px, transparent 1px, transparent 3px),
      radial-gradient(ellipse at center, rgba(0,0,0,0) 60%, rgba(0,0,0,0.45) 100%);
    mix-blend-mode: multiply;
  }
  #mapa-viewport {
    flex: 1 1 auto; position: relative; overflow: hidden; cursor: grab;
    background: #000;
  }
  #mapa-viewport.arrastrando { cursor: grabbing; }
  #mapa-contenido { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
  .celda-txt {
    position: absolute; display: flex; align-items: center; justify-content: center;
    font-weight: bold; font-family: inherit;
  }
  .btn-mapa {
    font-family: inherit;
    font-size: 11px;
    background: transparent;
    color: var(--ambar);
    border: 1px solid var(--ambar-tenue);
    border-radius: 2px;
    padding: 2px 8px;
    cursor: pointer;
    letter-spacing: 1px;
  }
  .btn-mapa:hover, .btn-mapa.activo { background: rgba(255,176,0,0.18); }
  .zoom-info { font-size: 11px; color: var(--ambar-tenue); }

  /* Leyenda -- desplegable anclado bajo el boton, dentro del propio
     recuadro del mapa (position:absolute sobre #term-mapa) para no
     empujar el layout de columnas ni tapar los paneles laterales. */
  #leyenda-panel {
    position: absolute;
    top: 30px; right: 8px;
    width: 280px;
    max-height: calc(100% - 40px);
    overflow-y: auto;
    background: rgba(5,3,0,0.95);
    border: 1px solid var(--ambar-tenue);
    border-radius: 3px;
    box-shadow: 0 0 16px rgba(0,0,0,0.6);
    padding: 8px 10px;
    font-size: 12px;
    z-index: 500;
    display: none;
  }
  #leyenda-panel.abierta { display: block; }
  #leyenda-panel h4 {
    margin: 10px 0 4px 0; font-size: 11px; letter-spacing: 1.5px;
    color: var(--ambar-fuerte); text-transform: uppercase;
    border-bottom: 1px solid var(--ambar-tenue); padding-bottom: 2px;
  }
  #leyenda-panel h4:first-child { margin-top: 0; }
  .leyenda-fila { display: flex; align-items: center; gap: 8px; padding: 1px 0; }
  .leyenda-glifo {
    display: inline-flex; align-items: center; justify-content: center;
    width: 16px; font-weight: bold; text-shadow: 0 0 4px currentColor;
  }
  .leyenda-nombre { color: #d8c8a0; }

  .kv { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 10px; margin-bottom: 6px;}
  .kv div.k { color: var(--ambar-tenue); }
  .kv div.v { color: var(--ambar-fuerte); text-align: right; }
  .cronica-linea { padding: 2px 0; border-bottom: 1px dashed rgba(255,176,0,0.15); }
  .cronica-linea:last-child { border-bottom: none; }
  .cmd-input {
    background: #000; border: 1px solid var(--ambar-tenue); color: var(--ambar);
    font-family: inherit; font-size: 13px; width: 100%; padding: 4px 6px;
    outline: none;
  }
  .parpadeo { animation: parp 1s steps(1) infinite; }
  @keyframes parp { 50% { opacity: 0; } }
  .placeholder { color: var(--ambar-tenue); font-style: italic; }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--ambar-tenue); }
  ::-webkit-scrollbar-track { background: #000; }
</style>
</head>
<body>
<div class="crt-overlay"></div>
<div class="layout">
  <div class="terminal" id="term-mapa">
    <div class="titulo">
      <span>MAPA://SUPERFICIE &mdash; <span id="titulo-mapa-info"></span></span>
      <div class="titulo-controles">
        <span class="zoom-info" id="zoom-info"></span>
        <button class="btn-mapa" id="btn-centrar" type="button">CENTRAR</button>
        <button class="btn-mapa" id="btn-leyenda" type="button">LEYENDA &#9662;</button>
      </div>
    </div>
    <div id="mapa-viewport">
      <div id="mapa-contenido"></div>
      <div id="leyenda-panel"></div>
    </div>
  </div>
  <div class="col-derecha">
    <div class="terminal">
      <div class="titulo">FICHA://ENTIDAD</div>
      <div class="cuerpo" id="ficha"><div class="placeholder">-- selecciona una entidad en el mapa --</div></div>
    </div>
    <div class="terminal">
      <div class="titulo">NARRADOR://CRONICA <span class="parpadeo">_</span></div>
      <div class="cuerpo" id="narrador"></div>
    </div>
    <div class="terminal">
      <div class="titulo">STATS://MUNDO</div>
      <div class="cuerpo" id="stats"></div>
    </div>
    <div class="terminal">
      <div class="titulo">EVENTOS://LOG (filtro)</div>
      <div class="cuerpo" id="eventos">
        <input class="cmd-input" placeholder="filtrar por especie/causa..." style="margin-bottom:6px;">
        <div class="placeholder">-- catalogo de eventos, pendiente de circulo siguiente --</div>
      </div>
    </div>
  </div>
</div>
<script src="datos.js"></script>
<script>
// PIVOTE A MAPA 100% ASCII (2026-09-16, decision de Diego): se retira el
// Codice Cartografico (presentacion/vista_web.py, ver
// docs/informe_codice_cartografico.md) y este prototipo deja de ser un
// hibrido ASCII+sprite -- CERO imagenes en el mapa a partir de ahora, todo
// se representa con glifo+color de texto. El CATALOGO de mas abajo
// (CATALOGO_GLIFOS) es la UNICA fuente de verdad tanto para lo que se
// dibuja en el mapa como para la leyenda desplegable: anadir una especie o
// categoria nueva es una entrada aqui, nunca una tabla duplicada.
let DATA = window.__DATOS__ || null;
const CELDA = 26; // px base por celda, antes de aplicar zoom

// --- Catalogo canonico: glifo + color + nombre legible, agrupado por
// seccion para la leyenda. "categoria" (solo en flora) permite que varias
// especies compartan el mismo glifo (forma = funcion: arbol/arbusto/
// cobertura, reutilizando la misma distincion que ya usa config/flora.yaml
// via compite_espacio_fisico + huella_m2) diferenciandose solo por color.
const CATALOGO_GLIFOS = {
  terreno: {
    titulo: 'Terreno',
    pradera:  { ch: '.', color: '#8fae4a', nombre: 'Pradera' },
    bosque:   { ch: '"', color: '#3f6b2c', nombre: 'Bosque (suelo)' },
    desierto: { ch: ':', color: '#d2a94a', nombre: 'Desierto' },
    tundra:   { ch: '·', color: '#a9bcc9', nombre: 'Tundra' },
    montana:  { ch: '^', color: '#8a7a5a', nombre: 'Montaña' },
    pico:     { ch: '▲', color: '#cdbb8c', nombre: 'Pico (elevación alta)' },
  },
  agua: {
    titulo: 'Agua',
    lago: { ch: '≈', color: '#3d7fa8', nombre: 'Lago / agua permanente' },
    rio:  { ch: '~', color: '#5fc0e0', nombre: 'Río (corriente)' },
    poza: { ch: '"', color: '#5f8fa8', nombre: 'Poza / charco efímero' },
  },
  flora: {
    titulo: 'Flora',
    manzano:           { ch: '♣', color: '#7a9a3a', nombre: 'Manzano', categoria: 'árbol' },
    roble:             { ch: '♣', color: '#2f5a2a', nombre: 'Roble', categoria: 'árbol' },
    pino:              { ch: '♣', color: '#1f4a4a', nombre: 'Pino', categoria: 'árbol' },
    cactus:            { ch: '*', color: '#4a8a5a', nombre: 'Cactus', categoria: 'arbusto' },
    arbusto_espinoso:  { ch: '*', color: '#8a6a3a', nombre: 'Arbusto espinoso', categoria: 'arbusto' },
    arbusto_desertico: { ch: '*', color: '#a68a4a', nombre: 'Arbusto desértico', categoria: 'arbusto' },
    arbusto_montano:   { ch: '*', color: '#6a8a4a', nombre: 'Arbusto montano', categoria: 'arbusto' },
    arbusto_artico:    { ch: '*', color: '#8aa8a0', nombre: 'Arbusto ártico', categoria: 'arbusto' },
    hierba_silvestre:  { ch: ',', color: '#8fae4a', nombre: 'Hierba silvestre', categoria: 'cobertura' },
    liquen:            { ch: ',', color: '#9aa870', nombre: 'Liquen', categoria: 'cobertura' },
    musgo:             { ch: ',', color: '#4a6a4a', nombre: 'Musgo', categoria: 'cobertura' },
    flor_silvestre:    { ch: ',', color: '#c97ab0', nombre: 'Flor silvestre', categoria: 'cobertura' },
    hierba_desertica:  { ch: ',', color: '#c9b06a', nombre: 'Hierba desértica', categoria: 'cobertura' },
    hierba_artica:     { ch: ',', color: '#c9d8d8', nombre: 'Hierba ártica', categoria: 'cobertura' },
    helecho:           { ch: ',', color: '#3a7a4a', nombre: 'Helecho', categoria: 'cobertura' },
  },
  fauna: {
    titulo: 'Fauna',
    gnomo:         { ch: '@', color: '#f0e6c0', nombre: 'Gnomo' },
    lobo:          { ch: 'w', color: '#e05a3a', nombre: 'Lobo' },
    conejo:        { ch: 'r', color: '#c9b590', nombre: 'Conejo' },
    ardilla:       { ch: 's', color: '#d98a2e', nombre: 'Ardilla' },
    caballo:       { ch: 'H', color: '#c9a06a', nombre: 'Caballo' },
    venado:        { ch: 'd', color: '#a3703f', nombre: 'Venado' },
    cabra_montesa: { ch: 'c', color: '#b8c0c4', nombre: 'Cabra montesa' },
    zorro:         { ch: 'f', color: '#c9622e', nombre: 'Zorro' },
    necromasa:     { ch: '%', color: '#7a7268', nombre: 'Restos (necromasa)' },
  },
  construcciones: {
    titulo: 'Construcciones',
    refugio:     { ch: '⌂', color: '#c98a4a', nombre: 'Refugio' },
    almacen:     { ch: '▣', color: '#a98a5a', nombre: 'Almacén' },
    salon_comun: { ch: '♦', color: '#e0b84a', nombre: 'Salón común' },
    cocina:      { ch: '♨', color: '#e0603a', nombre: 'Cocina' },
    taller:      { ch: '⚒', color: '#9a9aa0', nombre: 'Taller' },
  },
  recursos: {
    titulo: 'Recursos en el suelo',
    piedra_suelta: { ch: '•', color: '#9a9a9a', nombre: 'Piedra suelta' },
    madera:        { ch: '/', color: '#8a6a3a', nombre: 'Madera (rama caída)' },
  },
};

function hashDet(x,y,sal) {
  let h = (x*374761393 + y*668265263 + sal*2654435761) >>> 0;
  h = (h ^ (h>>>13)) >>> 0; h = Math.imul(h, 1274126177) >>> 0; h = (h ^ (h>>>16)) >>> 0;
  return h / 4294967296;
}

// rgba con alfa variable a partir de un color hex -- usado para atenuar
// flora joven (Planta.etapa real, 0=brote..1=madura: un brote se ve mas
// tenue, no un color inventado) y para el desvanecido de agua por
// profundidad real (Celda.profundidad_agua/profundidad_charco).
function hexARgba(hex, alfa) {
  const n = parseInt(hex.slice(1), 16);
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return `rgba(${r},${g},${b},${alfa})`;
}

let construccionesPorCelda = {};
function recalcularDerivados() {
  // Construcciones (DATA.construcciones): una celda podria en teoria tener
  // mas de una (refugio+almacen compartiendo espacio, cupo real del motor)
  // -- guardamos una LISTA por celda, mismo criterio que ya corrigio el bug
  // de plantas_por_celda (2026-08-31).
  construccionesPorCelda = {};
  for (const con of (DATA.construcciones || [])) {
    const clave = con.x + ',' + con.y;
    (construccionesPorCelda[clave] = construccionesPorCelda[clave] || []).push(con);
  }
}

// Orden de huella real (config/materiales.yaml: huella_m2_<tipo>, valores
// reales copiados aqui solo para desempatar que sello dibujar si dos
// construcciones comparten celda -- almacen(40) > salon_comun(35) ==
// cocina(35) > refugio(15) == taller(15)).
const ORDEN_HUELLA_CONSTRUCCION = { almacen: 40, salon_comun: 35, cocina: 35, refugio: 15, taller: 15 };

function infoCriatura(ent) {
  const g = CATALOGO_GLIFOS.fauna[ent.tipo] || { ch: '?', color: '#ffffff', nombre: ent.tipo };
  // Criaturas conscientes (mismo umbral de agencia que usa el motor,
  // dato real via capacidad_mental.consciente) destacan con resplandor --
  // mismo criterio que el Codice retirado reservaba para runas de
  // criaturas conscientes, aqui sin necesitar ningun asset.
  return { ch: g.ch, color: g.color, glow: !!ent.consciente };
}

function contenidoCelda(c) {
  // Prioridad de una sola representacion por celda (construccion > agua >
  // planta > recurso suelto > terreno base) -- mismo orden que ya
  // establecio el prototipo hibrido, aqui siempre resuelto a {ch,color}.
  const construcciones = construccionesPorCelda[c.x + ',' + c.y];
  if (construcciones && construcciones.length > 0) {
    const con = [...construcciones].sort((a, b) =>
      (ORDEN_HUELLA_CONSTRUCCION[b.tipo] || 1) - (ORDEN_HUELLA_CONSTRUCCION[a.tipo] || 1))[0];
    const g = CATALOGO_GLIFOS.construcciones[con.tipo] || { ch: '#', color: '#8a6a3a' };
    return { ch: g.ch, color: g.color };
  }
  if (c.tiene_agua) {
    const g = CATALOGO_GLIFOS.agua[c.tipo_agua] || CATALOGO_GLIFOS.agua.lago;
    // Profundidad real (agua permanente o charco efimero segun el tipo) ->
    // mas oscuro/opaco cuanto mas profundo, dato real del motor, no un
    // degradado inventado.
    const prof = c.tipo_agua === 'poza' ? c.profundidad_charco : c.profundidad_agua;
    const alfa = Math.max(0.55, Math.min(1, 0.55 + (prof || 0) * 0.6));
    return { ch: g.ch, color: hexARgba(g.color, alfa) };
  }
  if (c.plantas && c.plantas.length > 0) {
    // dato real del motor (cupo de espacio compartido, 2026-09-03): si hay
    // mas de una planta, preferimos la especie "competidora" (arbol/
    // arbusto) sobre una cobertura de suelo simple, mismo criterio que ya
    // usaba el prototipo hibrido.
    const competidora = c.plantas.find(p => {
      const g = CATALOGO_GLIFOS.flora[p.especie];
      return g && g.categoria !== 'cobertura';
    }) || c.plantas[0];
    const g = CATALOGO_GLIFOS.flora[competidora.especie];
    if (g) {
      // Etapa de crecimiento real (Planta.etapa 0..1) -> opacidad: un
      // brote se ve tenue, una planta madura llena de color.
      const alfa = 0.5 + Math.min(1, competidora.etapa ?? 1) * 0.5;
      return { ch: g.ch, color: hexARgba(g.color, alfa) };
    }
    // especie sin entrada en el catalogo todavia -> fallback generico
    return { ch: "'", color: '#7a5a2a' };
  }
  const recursos = c.recursos || {};
  if ((recursos.piedra_suelta || 0) > 0) {
    return { ch: CATALOGO_GLIFOS.recursos.piedra_suelta.ch, color: CATALOGO_GLIFOS.recursos.piedra_suelta.color };
  }
  if ((recursos.madera || 0) > 0) {
    return { ch: CATALOGO_GLIFOS.recursos.madera.ch, color: CATALOGO_GLIFOS.recursos.madera.color };
  }
  // Terreno base: montaña distingue pico de ladera por elevacion real
  // (mismo umbral aproximado que el Codice usaba para su relieve).
  if (c.bioma === 'montana' && c.elevacion > 0.72) {
    return { ch: CATALOGO_GLIFOS.terreno.pico.ch, color: CATALOGO_GLIFOS.terreno.pico.color };
  }
  const g = CATALOGO_GLIFOS.terreno[c.bioma] || { ch: '?', color: '#666666' };
  return { ch: g.ch, color: g.color };
}

function celdaAPantalla(wx, wy, tam) {
  return { cx: wx * tam, cy: wy * tam };
}

// Dos capas dentro de #mapa-contenido: la ESTATICA (suelo -- terreno,
// agua, flora, construcciones, recursos) se destruye y se recrea entera en
// cada render; la de CRIATURAS es persistente entre renders (un elemento
// por id, solo se actualiza left/top) para poder animar su desplazamiento
// con una transicion CSS en vez de teletransportarlas -- mismo mecanismo
// que ya tenia el prototipo hibrido, ahora aplicado a texto en vez de
// imagenes.
let capaEstatica = null, capaCriaturas = null;
function asegurarCapas() {
  const cont = document.getElementById('mapa-contenido');
  if (!capaEstatica) {
    capaEstatica = document.createElement('div');
    capaEstatica.style.position = 'absolute';
    capaEstatica.style.top = '0'; capaEstatica.style.left = '0';
    cont.appendChild(capaEstatica);
  }
  if (!capaCriaturas) {
    capaCriaturas = document.createElement('div');
    capaCriaturas.style.position = 'absolute';
    capaCriaturas.style.top = '0'; capaCriaturas.style.left = '0';
    cont.appendChild(capaCriaturas);
  }
  return cont;
}

function crearCeldaTxt(ch, color, cx, cy, glow) {
  const el = document.createElement('div');
  el.className = 'celda-txt';
  el.textContent = ch;
  el.style.width = CELDA + 'px'; el.style.height = CELDA + 'px';
  el.style.fontSize = Math.round(CELDA * 0.72) + 'px';
  el.style.color = color;
  if (glow) el.style.textShadow = `0 0 6px ${color}`;
  el.style.left = cx + 'px'; el.style.top = cy + 'px';
  return el;
}

function renderMapa() {
  const cont = asegurarCapas();
  capaEstatica.innerHTML = '';
  cont.style.width = (DATA.ancho * CELDA) + 'px';
  cont.style.height = (DATA.alto * CELDA) + 'px';
  for (let y = 0; y < DATA.alto; y++) {
    for (let x = 0; x < DATA.ancho; x++) {
      const c = DATA.celdas[y][x];
      const { cx, cy } = celdaAPantalla(x, y, CELDA);
      const info = contenidoCelda(c);
      const el = crearCeldaTxt(info.ch, info.color, cx, cy, false);
      el.style.zIndex = String(1000 + y);
      capaEstatica.appendChild(el);
    }
  }
  document.getElementById('titulo-mapa-info').textContent =
    `TICK ${DATA.tick} · DIA ${DATA.dia} · ${DATA.estacion.toUpperCase()} · ${DATA.clima.toUpperCase()}`;
}

let elementosCriatura = {};
function renderCriaturas() {
  asegurarCapas();
  const vistos = new Set();
  for (const ent of DATA.entidades) {
    const idStr = String(ent.id);
    vistos.add(idStr);
    const info = infoCriatura(ent);
    const { cx, cy } = celdaAPantalla(ent.x, ent.y, CELDA);
    let el = elementosCriatura[idStr];
    if (!el) {
      el = crearCeldaTxt(info.ch, info.color, cx, cy, info.glow);
      el.style.transition = 'left 0.9s linear, top 0.9s linear';
      capaCriaturas.appendChild(el);
      elementosCriatura[idStr] = el;
    } else {
      el.textContent = info.ch;
      el.style.color = info.color;
      el.style.textShadow = info.glow ? `0 0 6px ${info.color}` : '';
      el.style.left = cx + 'px';
      el.style.top = cy + 'px';
    }
    el.style.zIndex = String(1000 + ent.y);
    el.dataset.entId = idStr;
  }
  // Entidades que ya no existen (murieron, o salieron de la zona
  // exportada) -- se retira su elemento, no se deja huerfano en el DOM.
  for (const id of Object.keys(elementosCriatura)) {
    if (!vistos.has(id)) {
      elementosCriatura[id].remove();
      delete elementosCriatura[id];
    }
  }
}

// --- zoom centrado en el cursor + pan por arrastre ---
let zoom = 1, panX = -CELDA*7, panY = -CELDA*3;
const viewport = document.getElementById('mapa-viewport');
const contenido = document.getElementById('mapa-contenido');
function aplicarTransform() {
  contenido.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
  document.getElementById('zoom-info').textContent = `ZOOM ${zoom.toFixed(2)}x`;
}
viewport.addEventListener('wheel', (ev) => {
  ev.preventDefault();
  const rect = viewport.getBoundingClientRect();
  const mx = ev.clientX - rect.left, my = ev.clientY - rect.top;
  const factor = ev.deltaY < 0 ? 1.12 : 1/1.12;
  const nuevoZoom = Math.min(6, Math.max(0.35, zoom * factor));
  // Mantener el mismo punto de MUNDO bajo el cursor tras cambiar el zoom
  // (sin esto, el mapa "deriva" al hacer zoom si ya se habia desplazado).
  const contentX = (mx - panX) / zoom;
  const contentY = (my - panY) / zoom;
  panX = mx - contentX * nuevoZoom;
  panY = my - contentY * nuevoZoom;
  zoom = nuevoZoom;
  aplicarTransform();
}, { passive: false });
let arrastrando = false, ax=0, ay=0;
viewport.addEventListener('mousedown', (ev) => { arrastrando = true; ax=ev.clientX; ay=ev.clientY; viewport.classList.add('arrastrando'); });
window.addEventListener('mouseup', () => { arrastrando = false; viewport.classList.remove('arrastrando'); });
window.addEventListener('mousemove', (ev) => {
  if (!arrastrando) return;
  panX += (ev.clientX - ax); panY += (ev.clientY - ay);
  ax = ev.clientX; ay = ev.clientY;
  aplicarTransform();
});
document.getElementById('btn-centrar').addEventListener('click', () => {
  if (!DATA) return;
  const rect = viewport.getBoundingClientRect();
  zoom = 1;
  panX = rect.width / 2 - (DATA.ancho * CELDA) / 2;
  panY = rect.height / 2 - (DATA.alto * CELDA) / 2;
  aplicarTransform();
});

// --- leyenda desplegable: una sola fuente de verdad (CATALOGO_GLIFOS) ---
function construirLeyenda() {
  const panel = document.getElementById('leyenda-panel');
  let html = '';
  for (const clave of ['terreno', 'agua', 'flora', 'fauna', 'construcciones', 'recursos']) {
    const seccion = CATALOGO_GLIFOS[clave];
    html += `<h4>${seccion.titulo}</h4>`;
    for (const k in seccion) {
      if (k === 'titulo') continue;
      const it = seccion[k];
      html += `<div class="leyenda-fila"><span class="leyenda-glifo" style="color:${it.color}">${it.ch}</span><span class="leyenda-nombre">${it.nombre}</span></div>`;
    }
  }
  panel.innerHTML = html;
}
const btnLeyenda = document.getElementById('btn-leyenda');
const panelLeyenda = document.getElementById('leyenda-panel');
btnLeyenda.addEventListener('click', (ev) => {
  ev.stopPropagation();
  panelLeyenda.classList.toggle('abierta');
  btnLeyenda.classList.toggle('activo', panelLeyenda.classList.contains('abierta'));
});
document.addEventListener('click', (ev) => {
  if (panelLeyenda.classList.contains('abierta') && !panelLeyenda.contains(ev.target) && ev.target !== btnLeyenda) {
    panelLeyenda.classList.remove('abierta');
    btnLeyenda.classList.remove('activo');
  }
});

function mostrarFicha(ent) {
  const cont = document.getElementById('ficha');
  if (!ent) { cont.innerHTML = '<div class="placeholder">-- selecciona una entidad en el mapa --</div>'; return; }
  let html = `<div style="color:#ffe9c2;font-size:14px;margin-bottom:6px;">${ent.nombre || ent.tipo} <span style="color:#8a5a10">[${ent.tipo}]</span></div>`;
  html += '<div class="kv">';
  html += `<div class="k">POS</div><div class="v">${ent.x},${ent.y}</div>`;
  html += `<div class="k">EDAD</div><div class="v">${ent.edad_anios}a</div>`;
  if (ent.sexo) html += `<div class="k">SEXO</div><div class="v">${ent.sexo}</div>`;
  if (ent.accion) html += `<div class="k">ACCION</div><div class="v">${ent.accion}</div>`;
  if (ent.necesidades) for (const [k,v] of Object.entries(ent.necesidades)) html += `<div class="k">${k}</div><div class="v">${(v*100).toFixed(0)}%</div>`;
  html += '</div>';
  cont.innerHTML = html;
}
// Entidad seleccionada -- guardado por id (no por referencia al objeto,
// que en modo vivo se sustituye entero cada segundo) para poder
// refrescar la ficha sola cuando llega una instantanea nueva, sin que
// el usuario tenga que volver a hacer clic.
let entidadSeleccionadaId = null;
contenido.addEventListener('click', (ev) => {
  const id = ev.target?.dataset?.entId;
  if (!id) return;
  entidadSeleccionadaId = id;
  const ent = DATA.entidades.find(e => String(e.id) === id);
  mostrarFicha(ent);
});

function renderStats() {
  const cont = document.getElementById('stats');
  let html = '<div class="kv">';
  for (const [esp, n] of Object.entries(DATA.censo)) html += `<div class="k">${esp.toUpperCase()}</div><div class="v">${n}</div>`;
  html += `<div class="k">SEMILLA</div><div class="v">${DATA.semilla}</div>`;
  html += '</div>';
  cont.innerHTML = html;
}
function renderNarrador() {
  const cont = document.getElementById('narrador');
  if (!DATA.cronica || DATA.cronica.length === 0) { cont.innerHTML = '<div class="placeholder">-- sin eventos recientes --</div>'; return; }
  cont.innerHTML = DATA.cronica.map(l => `<div class="cronica-linea">${l}</div>`).join('');
}

// Modo en vivo: intenta /estado.json (relativo -- funciona tanto si esto
// se sirve en la raiz de ManejadorWeb como en cualquier prefijo). Si falla
// (servido suelto, sin ese endpoint), cae en silencio a la instantanea
// estatica de datos.js -- no hay ninguna bifurcacion explicita de "modo",
// solo un fetch que puede fallar o no.
async function cargarEstadoVivo() {
  try {
    const r = await fetch('estado.json', { cache: 'no-store' });
    if (!r.ok) return false;
    const nuevo = await r.json();
    if (!nuevo || !nuevo.celdas) return false;
    DATA = nuevo;
    return true;
  } catch (e) {
    return false;
  }
}

async function iniciar() {
  await cargarEstadoVivo(); // si funciona, sustituye DATA antes del primer render
  if (!DATA) return; // ni datos.js ni /estado.json disponibles -- nada que dibujar
  construirLeyenda();
  recalcularDerivados();
  renderMapa();
  renderCriaturas();
  aplicarTransform();
  renderStats();
  renderNarrador();
  // Sondeo continuo. segundos_por_tick real del motor es 0.4 (config/
  // visual.yaml) -- 1000ms de por si ya sondea mas lento que cada tick
  // real, evita recalcular derivados en cada uno.
  setInterval(async () => {
    const ok = await cargarEstadoVivo();
    if (!ok) return;
    recalcularDerivados();
    renderMapa();
    renderCriaturas();
    renderStats();
    renderNarrador();
    if (entidadSeleccionadaId != null) {
      const ent = DATA.entidades.find(e => String(e.id) === entidadSeleccionadaId);
      mostrarFicha(ent || null);
    }
  }, 1000);
}
iniciar();
</script>
