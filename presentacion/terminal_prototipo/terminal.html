<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Vallis Runica -- Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* Fuente bitmap real de VGA (2026-09-16, paquete de Diego -- credito y
     licencia CC BY-SA 4.0 en fonts/CREDITS.txt; el paquete completo de 361
     variantes se retiro del repositorio el 2026-09-17 por tener un unico
     fichero en uso real, ver CLAUDE.md). Reproduccion fiel
     de la ROM de fuente de una tarjeta VGA de IBM real -- la referencia
     autentica del aspecto "terminal DOS/roguelike clasico" que pidio
     Diego, verificada glifo a glifo contra el catalogo completo de
     CATALOGO_GLIFOS antes de adoptarla (los 27 caracteres usados, incluidos
     los menos comunes como ⚒/♨/▣, renderizan nitidos). JetBrains Mono
     queda como fallback si el .woff no carga por lo que sea.
     Fuente pixel: sin antialiasing, se sirve a su tamano nativo (16px,
     multiplo entero del 9x16 real) y se escala con transform, no con
     font-size directo, para no perder la nitidez del pixel -- ver
     CELDA/escala mas abajo en el script. */
  @font-face {
    font-family: 'VGA437';
    src: url('fonts/Web437_IBM_VGA_9x16.woff') format('woff');
    font-display: swap;
  }
  :root {
    --ambar: #ffb000;
    --ambar-tenue: #8a5a10;
    --ambar-fuerte: #ffd27a;
    --fondo: #0a0500;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: #000;
    font-family: 'VGA437', 'JetBrains Mono', "Courier New", ui-monospace, monospace;
    color: var(--ambar);
    height: 100%;
  }
  .layout {
    display: grid;
    grid-template-columns: 3fr 1.1fr;
    grid-template-rows: 1fr;
    gap: 10px;
    height: 100vh;
    padding: 10px;
  }
  .col-derecha {
    display: grid;
    grid-template-rows: 1.3fr 1fr 0.8fr 0.9fr;
    gap: 10px;
    min-height: 0;
  }
  .terminal {
    position: relative;
    background: var(--fondo);
    border: 2px solid var(--ambar-tenue);
    border-radius: 4px;
    box-shadow: 0 0 12px rgba(255,176,0,0.15) inset, 0 0 8px rgba(255,176,0,0.08);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .titulo {
    flex: 0 0 auto;
    font-size: 12px;
    letter-spacing: 2px;
    padding: 4px 10px;
    background: linear-gradient(180deg, rgba(255,176,0,0.18), rgba(255,176,0,0.02));
    border-bottom: 1px solid var(--ambar-tenue);
    color: var(--ambar);
    text-shadow: 0 0 6px rgba(255,176,0,0.8);
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  .titulo-controles { display: flex; align-items: center; gap: 8px; }
  .cuerpo {
    flex: 1 1 auto;
    overflow: auto;
    padding: 8px 10px;
    font-size: 13px;
    line-height: 1.15;
  }
  .crt-overlay {
    position: fixed; inset: 0; pointer-events: none; z-index: 50;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.18) 0px, rgba(0,0,0,0.18) 1px, transparent 1px, transparent 3px),
      radial-gradient(ellipse at center, rgba(0,0,0,0) 60%, rgba(0,0,0,0.45) 100%);
    mix-blend-mode: multiply;
  }
  #mapa-viewport {
    flex: 1 1 auto; position: relative; overflow: hidden; cursor: grab;
    background: #000;
  }
  #mapa-viewport.arrastrando { cursor: grabbing; }
  #mapa-contenido { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
  /* VGA437 es una fuente de bitmap de un solo peso -- "bold" sobre ella
     fuerza una negrita sintetica del navegador que emborrona el pixel
     nitido (confirmado visualmente, no una suposicion), asi que estos dos
     elementos (glifos del mapa y de la leyenda) se quedan en peso normal
     -- el resto de la interfaz (titulos, stats) sigue en negrita/CSS
     normal, no se ve afectado. */
  .celda-txt {
    position: absolute; display: flex; align-items: center; justify-content: center;
    font-weight: normal; font-family: inherit;
  }
  /* Sprites de fauna (2026-09-16, ver comentario junto a CATALOGO_GLIFOS.
     fauna) -- ancla inferior-centro, igual que el ancla que ya usaban los
     glifos de texto por su propio centrado flex. pixelated conserva el
     pixel-art nitido al escalar en el navegador. transform NO se fija
     aqui (solo position/width) -- se compone en JS (renderCriaturas,
     translate(-50%,-100%)) porque un estilo inline pisaria por completo
     cualquier transform de esta clase, no se pueden combinar CSS+JS en
     la misma propiedad. Desde 2026-09-19 el propio `src` de la imagen ya
     cambia por direccion real (ver infoCriatura/resolverDireccionSprite)
     -- ya no hace falta espejar por CSS (scaleX), el sprite este/oeste
     ya viene dibujado de fabrica en cada sentido. */
  .criatura-img {
    position: absolute;
    image-rendering: pixelated;
    width: auto;
  }
  /* Sprites de construccion (2026-09-16, ver crearCeldaImgEstatica) --
     ancla inferior-centro dentro de la celda contenedora (.celda-txt,
     position:absolute -> establece el contexto para este hijo), mismo
     criterio visual que .criatura-img pero SIN transicion de movimiento:
     las construcciones no se desplazan. */
  .construccion-img {
    position: absolute;
    left: 50%; bottom: 0;
    transform: translateX(-50%);
    image-rendering: pixelated;
    width: auto;
  }
  /* Sprite compartido (2026-09-17, Diego: "quedaria mejor si se
     pudiesen solapar, por ejemplo el refugio y que el pino crezca por
     detras, le daria sensacion de mas profundidad") -- sustituye al
     mosaico de cuadrantes (grid 2x2/columnas proporcionales) que vivio
     aqui hasta este circulo: en vez de partir la celda en fracciones
     fijas, cada elemento que comparte celda se dibuja con ancla
     inferior-centro real (igual contrato que .criatura-img, sin
     transform fijo -- se compone en JS con el offset vertical de
     profundidad, ver crearImgCompartida) y se superponen con distinto
     z-index. */
  .sprite-compartido {
    position: absolute;
    image-rendering: pixelated;
    width: auto;
  }
  /* Badge de recurso en el suelo (2026-09-16, ver añadirBadges/itemsCelda)
     -- esquina superior-derecha, pequeño y fijo, nunca compite por el
     espacio de ningun elemento real de la celda. */
  .badge-recurso {
    position: absolute; right: 1px;
    font-family: inherit; font-weight: normal;
    font-size: 11px; line-height: 1;
    text-shadow: 0 0 2px #000, 0 0 2px #000;
  }
  .btn-mapa {
    font-family: inherit;
    font-size: 11px;
    background: transparent;
    color: var(--ambar);
    border: 1px solid var(--ambar-tenue);
    border-radius: 2px;
    padding: 2px 8px;
    cursor: pointer;
    letter-spacing: 1px;
  }
  .btn-mapa:hover, .btn-mapa.activo { background: rgba(255,176,0,0.18); }
  .btn-mapa:disabled { opacity: 0.35; cursor: default; }
  .zoom-info { font-size: 11px; color: var(--ambar-tenue); }

  /* Barra de control de partida (2026-09-16) -- misma altura/estetica que
     .titulo, como una segunda fila del mismo panel. */
  .barra-control { border-top: 1px solid var(--ambar-tenue); padding: 4px 10px; }
  .control-estado { font-size: 11px; color: var(--ambar-tenue); }
  .sel-velocidad {
    font-family: inherit; font-size: 11px; background: #000; color: var(--ambar);
    border: 1px solid var(--ambar-tenue); border-radius: 2px; padding: 2px 4px;
  }
  .sel-velocidad:disabled { opacity: 0.35; }

  /* Pantalla de espera -- sustituye visualmente el mapa (nunca a la vez)
     cuando no hay ninguna partida corriendo. Superpuesta dentro del mismo
     #mapa-viewport en vez de un elemento hermano, para no pelear con su
     position:relative/overflow:hidden ya establecidos. */
  #pantalla-espera {
    position: absolute; inset: 0; z-index: 900;
    display: flex; align-items: center; justify-content: center;
    background: #000;
  }
  .pantalla-espera-caja { text-align: center; }
  .pantalla-espera-titulo {
    color: var(--ambar-tenue); letter-spacing: 2px; font-size: 13px;
    margin-bottom: 14px;
  }

  /* Leyenda -- desplegable anclado bajo el boton, dentro del propio
     recuadro del mapa (position:absolute sobre #term-mapa) para no
     empujar el layout de columnas ni tapar los paneles laterales. */
  #leyenda-panel {
    position: absolute;
    top: 30px; right: 8px;
    width: 280px;
    max-height: calc(100% - 40px);
    overflow-y: auto;
    background: rgba(5,3,0,0.95);
    border: 1px solid var(--ambar-tenue);
    border-radius: 3px;
    box-shadow: 0 0 16px rgba(0,0,0,0.6);
    padding: 8px 10px;
    font-size: 12px;
    z-index: 500;
    display: none;
  }
  #leyenda-panel.abierta { display: block; }
  #leyenda-panel h4 {
    margin: 10px 0 4px 0; font-size: 11px; letter-spacing: 1.5px;
    color: var(--ambar-fuerte); text-transform: uppercase;
    border-bottom: 1px solid var(--ambar-tenue); padding-bottom: 2px;
  }
  #leyenda-panel h4:first-child { margin-top: 0; }
  .leyenda-fila { display: flex; align-items: center; gap: 8px; padding: 1px 0; }
  .leyenda-glifo {
    display: inline-flex; align-items: center; justify-content: center;
    width: 16px; font-weight: normal; text-shadow: 0 0 4px currentColor;
  }
  .leyenda-nombre { color: #d8c8a0; }

  .kv { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 10px; margin-bottom: 6px;}
  .kv div.k { color: var(--ambar-tenue); }
  .kv div.v { color: var(--ambar-fuerte); text-align: right; }
  .cronica-linea { padding: 2px 0; border-bottom: 1px dashed rgba(255,176,0,0.15); }
  .cronica-linea:last-child { border-bottom: none; }
  .cmd-input {
    background: #000; border: 1px solid var(--ambar-tenue); color: var(--ambar);
    font-family: inherit; font-size: 13px; width: 100%; padding: 4px 6px;
    outline: none;
  }
  .parpadeo { animation: parp 1s steps(1) infinite; }
  @keyframes parp { 50% { opacity: 0; } }
  .placeholder { color: var(--ambar-tenue); font-style: italic; }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--ambar-tenue); }
  ::-webkit-scrollbar-track { background: #000; }
</style>
</head>
<body>
<div class="crt-overlay"></div>
<div class="layout">
  <div class="terminal" id="term-mapa">
    <div class="titulo">
      <span>MAPA://SUPERFICIE &mdash; <span id="titulo-mapa-info"></span></span>
      <div class="titulo-controles">
        <span class="zoom-info" id="zoom-info"></span>
        <button class="btn-mapa" id="btn-centrar" type="button">CENTRAR</button>
        <button class="btn-mapa" id="btn-leyenda" type="button">LEYENDA &#9662;</button>
      </div>
    </div>
    <!-- Barra de control de partida (2026-09-16, ver docs/superpowers/
         specs/2026-09-16-servidor-control-remoto-design.md) -- oculta por
         completo cuando el servidor no expone GestorPartidas (modo CLI de
         main.py con SIMULACION_MODO_VISUAL=1, o datos.js estatico sin
         servidor detras): ver actualizarControlPartida(null). -->
    <div class="titulo barra-control" id="barra-control" style="display:none">
      <span class="control-estado" id="control-estado"></span>
      <div class="titulo-controles">
        <button class="btn-mapa" id="btn-nueva-partida" type="button">NUEVA PARTIDA</button>
        <button class="btn-mapa" id="btn-pausar" type="button" disabled>PAUSAR</button>
        <select class="sel-velocidad" id="sel-velocidad" disabled>
          <option value="0.5">0.5x</option>
          <option value="1" selected>1x</option>
          <option value="2">2x</option>
          <option value="4">4x</option>
          <option value="8">8x</option>
        </select>
        <button class="btn-mapa" id="btn-finalizar" type="button" disabled>FINALIZAR</button>
      </div>
    </div>
    <div id="mapa-viewport">
      <div id="mapa-contenido"></div>
      <div id="leyenda-panel"></div>
      <div id="pantalla-espera" style="display:none">
        <div class="pantalla-espera-caja">
          <div class="pantalla-espera-titulo">SIN PARTIDA ACTIVA</div>
          <button class="btn-mapa" id="btn-nueva-partida-inicial" type="button">NUEVA PARTIDA</button>
        </div>
      </div>
    </div>
  </div>
  <div class="col-derecha">
    <div class="terminal">
      <div class="titulo">FICHA://ENTIDAD</div>
      <div class="cuerpo" id="ficha"><div class="placeholder">-- selecciona una entidad en el mapa --</div></div>
    </div>
    <div class="terminal">
      <div class="titulo">NARRADOR://CRONICA <span class="parpadeo">_</span></div>
      <div class="cuerpo" id="narrador"></div>
    </div>
    <div class="terminal">
      <div class="titulo">STATS://MUNDO</div>
      <div class="cuerpo" id="stats"></div>
    </div>
    <div class="terminal">
      <div class="titulo">EVENTOS://LOG (filtro)</div>
      <div class="cuerpo" id="eventos">
        <input class="cmd-input" placeholder="filtrar por especie/causa..." style="margin-bottom:6px;">
        <div class="placeholder">-- catalogo de eventos, pendiente de circulo siguiente --</div>
      </div>
    </div>
  </div>
</div>
<script src="datos.js"></script>
<script>
// PIVOTE A MAPA 100% ASCII (2026-09-16, decision de Diego): se retira el
// Codice Cartografico (presentacion/vista_web.py, ver
// docs/informe_codice_cartografico.md). El CATALOGO de mas abajo
// (CATALOGO_GLIFOS) es la UNICA fuente de verdad tanto para lo que se
// dibuja en el mapa como para la leyenda desplegable: anadir una especie o
// categoria nueva es una entrada aqui, nunca una tabla duplicada.
// CORREGIDO el mismo dia (ver CLAUDE.md, "Hibrido ASCII+sprite"): el
// parrafo original decia aqui que este prototipo dejaba de ser un hibrido
// ASCII+sprite y quedaba en "CERO imagenes en el mapa" -- afirmacion que
// el propio codigo desmintio unas horas despues, cuando se añadieron
// sprites reales de fauna y construcciones (mismo dia, ver CATALOGO_GLIFOS.
// fauna/construcciones mas abajo) y despues flora (arbol/arbusto y 5 de
// las 7 especies de cobertura). Diego confirmo el criterio real: base
// ASCII, sprite donde se encuentre arte adecuado, introducido
// gradualmente -- nunca "cero imagenes".
let DATA = window.__DATOS__ || null;
const CELDA = 32; // px base por celda, antes de aplicar zoom (subido de 26:
// a ese tamano el glifo mas grande posible seguia leyendose pequeno en un
// panel de 1400px con 40 celdas de ancho -- ver docs/informe_codice_cartografico.md
// nota al pie del 2026-09-16 sobre la auditoria de legibilidad).

// --- Catalogo canonico: glifo + color + nombre legible, agrupado por
// seccion para la leyenda. "categoria" (solo en flora) permite que varias
// especies compartan el mismo glifo (forma = funcion: arbol/arbusto/
// cobertura, reutilizando la misma distincion que ya usa config/flora.yaml
// via compite_espacio_fisico + huella_m2) diferenciandose solo por color.
//
// REDISEÑADO 2026-09-16 (feedback de Diego: "los iconos son demasiado
// pequeños"): el problema real, confirmado con una auditoria visual
// (renderizar los ~28 glifos a tamano fijo grande antes de tocar nada), no
// era el tamano en pixeles -- era que varios glifos usaban puntuacion
// (comillas, dos puntos, coma) para representar bioma/cobertura, y esos
// caracteres son intrinsecamente diminutos en CUALQUIER fuente por grande
// que se dibujen (una comilla nunca ocupa el cuerpo completo de su celda).
// Los glifos con masa visual real (letras de fauna, formas de flora/
// construccion) ya se leian perfectamente bien a cualquier tamano.
//
// Convencion adoptada (la misma que usan Dwarf Fortress/CDDA en las
// capturas de referencia de Diego, no inventada): el suelo llano ("nada
// que ver aqui") se representa SIEMPRE con el mismo punto '.', y el bioma
// se distingue por COLOR, no por forma -- el color se compara mejor que
// media docena de marcas de puntuacion casi identicas. Solo el relieve
// real (montana/pico) rompe esa regla a proposito: una elevacion real
// SI merece un simbolo con cuerpo (convencion estandar de todo roguelike).
// Cobertura de suelo pasa de ',' a '▪' (cuadrado pequeño solido, con masa
// real) -- sigue leyendose "mas discreta" que un arbusto/arbol por ser una
// forma simple, pero ya no es invisible. poza deja de compartir glifo con
// bosque (colision real de la version anterior, ambos usaban '"').
const CATALOGO_GLIFOS = {
  terreno: {
    titulo: 'Terreno',
    pradera:  { ch: '░', color: '#a3c95a', nombre: 'Pradera' },
    bosque:   { ch: '░', color: '#3f6b2c', nombre: 'Bosque (suelo)' },
    desierto: { ch: '░', color: '#d9b566', nombre: 'Desierto' },
    tundra:   { ch: '░', color: '#b8ccd6', nombre: 'Tundra' },
    montana:  { ch: '^', color: '#9a8264', nombre: 'Montaña' },
    pico:     { ch: '▲', color: '#cdbb8c', nombre: 'Pico (elevación alta)' },
  },
  agua: {
    titulo: 'Agua',
    lago: { ch: '≈', color: '#3d7fa8', nombre: 'Lago / agua permanente' },
    rio:  { ch: '~', color: '#5fc0e0', nombre: 'Río (corriente)' },
    poza: { ch: ':', color: '#6fa8c0', nombre: 'Poza / charco efímero' },
  },
  flora: {
    titulo: 'Flora',
    // (2026-09-16) pino usa '♠' en vez de '♣': silueta puntiaguda real de
    // conifera frente a la copa redondeada de un arbol de hoja ancha --
    // shape real, no una eleccion arbitraria (auditada contra la fuente
    // VGA437 antes de decidir, ambos glifos existen y renderizan nitidos).
    // img (2026-09-16, assets aportados por Diego -- ver
    // docs/historial_capa_visual.md, entrada del mismo dia): CRITERIO
    // CONFIRMADO por Diego, aclarado dos veces tras un primer mapeo que
    // interprete solo. El nombre de fichero no tiene que ser 1:1 con la
    // clave de especie -- el criterio real es el BIOMA real de cada
    // fichero (config/flora.yaml campo `biomas`, mismo dato que ya usa el
    // motor): un unico arbusto puede compartir arte entre especies con
    // clima afin (arbustoMontañaTundra.jpg -> montano Y artico) y un
    // unico fichero generico cubre TODAS las variantes climaticas de una
    // misma forma (hierba.jpg -> las 3 especies de hierba). Solo quedan
    // SIN sprite las 2 especies para las que Diego no aporto ningun icono
    // -- liquen y musgo (categoria cobertura, sin arte disponible).
    manzano:           { ch: '♣', color: '#7a9a3a', nombre: 'Manzano', categoria: 'árbol', img: 'sprites_flora/manzano.png' },
    roble:             { ch: '♣', color: '#2f5a2a', nombre: 'Roble', categoria: 'árbol', img: 'sprites_flora/roble.png' },
    pino:              { ch: '♠', color: '#1f4a4a', nombre: 'Pino', categoria: 'árbol', img: 'sprites_flora/pino.png' },
    cactus:            { ch: '*', color: '#4a8a5a', nombre: 'Cactus', categoria: 'arbusto', img: 'sprites_flora/cactus.png' },
    arbusto_espinoso:  { ch: '*', color: '#8a6a3a', nombre: 'Arbusto espinoso', categoria: 'arbusto', img: 'sprites_flora/arbusto_espinoso.png' },
    arbusto_desertico: { ch: '*', color: '#a68a4a', nombre: 'Arbusto desértico', categoria: 'arbusto', img: 'sprites_flora/arbusto_desertico.png' },
    arbusto_montano:   { ch: '*', color: '#6a8a4a', nombre: 'Arbusto montano', categoria: 'arbusto', img: 'sprites_flora/arbusto_montano_tundra.png' },
    arbusto_artico:    { ch: '*', color: '#8aa8a0', nombre: 'Arbusto ártico', categoria: 'arbusto', img: 'sprites_flora/arbusto_montano_tundra.png' },
    hierba_silvestre:  { ch: '▒', color: '#a3c95a', nombre: 'Hierba silvestre', categoria: 'cobertura', img: 'sprites_flora/hierba_silvestre.png' },
    liquen:            { ch: '▒', color: '#9aa870', nombre: 'Liquen', categoria: 'cobertura' },
    musgo:             { ch: '▒', color: '#4a6a4a', nombre: 'Musgo', categoria: 'cobertura' },
    flor_silvestre:    { ch: '▒', color: '#c97ab0', nombre: 'Flor silvestre', categoria: 'cobertura', img: 'sprites_flora/flor_silvestre.png' },
    hierba_desertica:  { ch: '▒', color: '#c9b06a', nombre: 'Hierba desértica', categoria: 'cobertura', img: 'sprites_flora/hierba_silvestre.png' },
    hierba_artica:     { ch: '▒', color: '#c9d8d8', nombre: 'Hierba ártica', categoria: 'cobertura', img: 'sprites_flora/hierba_silvestre.png' },
    helecho:           { ch: '▒', color: '#3a7a4a', nombre: 'Helecho', categoria: 'cobertura', img: 'sprites_flora/helecho.png' },
  },
  // (2026-09-16) Pictogramas reales en vez de letras -- Diego: "podriamos
  // buscar pictogramas para las criaturas". Emoji nativos del sistema/
  // navegador (CERO descarga, a diferencia de VGA437/Nerd Fonts): ya
  // vienen con la fuente de emoji del propio SO, verificados nitidos y
  // reconocibles a este tamaño antes de adoptarlos. Limitacion real y
  // aceptada: un emoji ignora `color` CSS -- siempre se ve a todo color
  // nativo, no se puede teñir de ambar. No es un choque de estilo (el
  // resto del mapa ya usa muchos colores por categoria, no solo ambar),
  // pero significa que `color` en esta seccion ya no pinta el glifo --
  // se conserva solo como referencia en la leyenda. Sin emoji real de
  // "gnomo": se uso 🧙 (figura humanoide con
  // gorro puntiagudo, la silueta mas cercana disponible, ver
  // docs/informe_codice_cartografico.md-style de honestidad: aproximacion
  // documentada, no un hallazgo perfecto). 🐿️ (ardilla) es una secuencia
