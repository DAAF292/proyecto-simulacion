function hashDet(x,y,sal) {
  let h = (x*374761393 + y*668265263 + sal*2654435761) >>> 0;
  h = (h ^ (h>>>13)) >>> 0; h = Math.imul(h, 1274126177) >>> 0; h = (h ^ (h>>>16)) >>> 0;
  return h / 4294967296;
}

// Jitter horizontal (2026-09-16, Diego: "los assets se sitúan siempre en
// el centro de la celda, parecen lineas rectas") -- un arbol/arbusto/
// construccion se dibujaba SIEMPRE a left:50% exacto de su celda
// (.construccion-img, CSS fijo) y fauna SIEMPRE a cx+CELDA/2 (centro
// exacto) -- en un bosque real ningun arbol crece perfectamente
// centrado en su propia parcela, esa regularidad es lo que se lee como
// "cuadricula"/"lineas rectas". Mismo hashDet ya usado para variar tono/
// textura, sal propia (97) para no correlacionar el desplazamiento con
// ningun otro efecto visual. Solo horizontal, nunca vertical: el ancla
// es "pies en el suelo de la celda" (bottom:0/cy+CELDA) -- mover eso en
// vertical rompería esa lectura, dando la sensacion de flotar o hundirse.
const SAL_JITTER = 97;
const JITTER_FRACCION_CELDA = 0.25; // hasta +-25% de CELDA a cada lado
function jitterPx(seedX, seedY) {
  return (hashDet(seedX, seedY, SAL_JITTER) - 0.5) * 2 * JITTER_FRACCION_CELDA * CELDA;
}
// Fauna usa una semilla distinta -- el ID de la entidad (estable durante
// toda su vida), NO su celda actual (cambia en cada paso). Con semilla de
// celda, el sesgo lateral "saltaria" a un valor distinto cada vez que la
// criatura cruza a una celda nueva, viendose peor que sin jitter -- con
// semilla de individuo, cada animal camina con un sesgo lateral propio y
// constante, como una persona real no camina en linea perfectamente recta.
function jitterPxPorId(id) {
  return (hashDet(Number(id) || 0, 0, SAL_JITTER) - 0.5) * 2 * JITTER_FRACCION_CELDA * CELDA;
}

// rgba con alfa variable a partir de un color hex -- usado para atenuar
// flora joven (Planta.etapa real, 0=brote..1=madura: un brote se ve mas
// tenue, no un color inventado) y para el desvanecido de agua por
// profundidad real (Celda.profundidad_agua/profundidad_charco).
function hexARgba(hex, alfa) {
  const n = parseInt(hex.slice(1), 16);
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return `rgba(${r},${g},${b},${alfa})`;
}

// TEXTURA "TEJIDA" (2026-09-16, tercer feedback de Diego comparando contra
// capturas reales de Dwarf Fortress: "necesitamos que quede lo mas vivo
// posible"). Diagnostico: DF nunca deja una celda de suelo sin tinta --
// imprime el MISMO puñado de glifos base en todas las celdas de un
// material, pero con variacion real de tono celda a celda, lo que se lee
// como superficie "tejida" en vez de un bloque de color CSS plano (lo que
// habiamos hecho en el circulo anterior). tonoCelda varia el tono +-rango
// de forma DETERMINISTA por celda (mismo hash de siempre -- nunca cambia
// de un frame a otro); glifoTextura elige entre 2-3 variantes de glifo
// por el mismo mecanismo. Ambos se usan solo en las capas de "suelo"
// (terreno desnudo, agua, cobertura) -- los landmarks reales (arbol,
// arbusto, fauna, construccion, recurso) se quedan con un color fijo y
// consistente a proposito, para que sigan destacando sobre el ruido de
// textura del suelo en vez de mezclarse con el.
function tonoCelda(hex, x, y, sal, rango, alfa = 1) {
  const t = (hashDet(x, y, sal) - 0.5) * 2 * rango;
  const n = parseInt(hex.slice(1), 16);
  const ajustar = (canal) => Math.max(0, Math.min(255, Math.round(canal * (1 + t))));
  const r = ajustar((n >> 16) & 255), g = ajustar((n >> 8) & 255), b = ajustar(n & 255);
  return `rgba(${r},${g},${b},${alfa})`;
}
function glifoTextura(pool, x, y, sal) {
  return pool[Math.floor(hashDet(x, y, sal) * pool.length) % pool.length];
}
// Pools de glifo base por bioma (montaña queda fuera: conserva su propio
// simbolo '^'/'▲' de relieve, ya establecido).
//
// CORREGIDO 2026-09-16 (Diego: "hay otros iconos quizas mejores?" --
// auditoria real contra la fuente VGA437 antes de decidir, no a ojo):
// '.'/','/'\'' tienen muy poca masa visual incluso con variacion de tono
// -- CP437 trae una familia de "sombreado" graduada por densidad
// (░ claro, ▒ medio, ▓ oscuro) pensada exactamente para esto en
// terminales DOS/roguelikes reales, confirmada nitida en la fuente real
// con una pagina de prueba aislada. ░ para todo el suelo desnudo (mucha
// mas presencia que un punto, sigue leyendose "de fondo" por su propio
// patron moteado interno) y ▒ para cobertura vegetal (un escalon mas
// denso que el suelo desnudo, jerarquia visual real: suelo < cobertura <
// arbusto/arbol solidos).
const TEXTURA_TERRENO = {
  pradera:  ['░'],
  bosque:   ['░'],
  desierto: ['░'],
  tundra:   ['░'],
};
const TEXTURA_COBERTURA = ['▒'];

let construccionesPorCelda = {};
function recalcularDerivados() {
  // Construcciones (DATA.construcciones): una celda podria en teoria tener
  // mas de una (refugio+almacen compartiendo espacio, cupo real del motor)
  // -- guardamos una LISTA por celda, mismo criterio que ya corrigio el bug
  // de plantas_por_celda (2026-08-31).
  construccionesPorCelda = {};
  for (const con of (DATA.construcciones || [])) {
    const clave = con.x + ',' + con.y;
    (construccionesPorCelda[clave] = construccionesPorCelda[clave] || []).push(con);
  }
}

// Orden de huella real (config/materiales.yaml: huella_m2_<tipo>, valores
// reales copiados aqui solo para desempatar que sello dibujar si dos
// construcciones comparten celda -- almacen(40) > salon_comun(35) ==
// cocina(35) > refugio(15) == taller(15)).
const ORDEN_HUELLA_CONSTRUCCION = { almacen: 40, salon_comun: 35, cocina: 35, refugio: 15, taller: 15 };

// Diagonal -> cardinal horizontal mas cercano (2026-09-19), para las 8
// especies que solo tienen 4 direcciones de sprite (norte/sur/este/
// oeste, sin diagonales) -- decision explicita de Diego: mantiene el
// perfil lateral ya conocido del juego en vez de caer a norte/sur.
const FALLBACK_DIAGONAL_HORIZONTAL = {
  noreste: 'este', sureste: 'este', noroeste: 'oeste', suroeste: 'oeste',
};

function resolverDireccionSprite(direccionesDisponibles, orientacion) {
  if (direccionesDisponibles.includes(orientacion)) return orientacion;
  const alternativa = FALLBACK_DIAGONAL_HORIZONTAL[orientacion];
  if (alternativa && direccionesDisponibles.includes(alternativa)) return alternativa;
  return direccionesDisponibles[0];
}

function infoCriatura(ent) {
  const g = CATALOGO_GLIFOS.fauna[ent.tipo] || { ch: '?', color: '#ffffff', nombre: ent.tipo };
  let img = null;
  if (g.imgDir) {
    const orientacion = ent.orientacion || 'este';
    const direccion = resolverDireccionSprite(g.direcciones, orientacion);
    img = `${g.imgDir}/${direccion}.png`;
  }
  return { ch: g.ch, color: g.color, img };
}

// REDISEÑADO 2026-09-16, dos veces seguidas. Primero (feedback: "demasiado
// espaciado, no se detecta que es un mapa"): un glifo suelto por celda deja
// huecos de negro puro entre celdas sin contenido -- se añadió COLOR DE
// FONDO a cada celda (terreno/agua) y se vacio el glifo del suelo desnudo,
// confiando solo en el fondo CSS. Segunda vuelta (feedback comparando
// contra capturas reales de Dwarf Fortress: "necesitamos que quede lo mas
// vivo posible") corrigio el resultado de la primera -- un bloque de color
// CSS plano no es como lee DF su propio suelo: alli CADA celda imprime un
// glifo real (el mismo puñado de caracteres repetido, pero con variacion
// de TONO por celda), lo que se lee como textura "tejida" en vez de un
// mosaico de rectangulos. La funcion que calculaba esto (contenidoCelda,
// {ch,color,fondo} con un solo glifo) se sustituyo despues por itemsCelda
// ({items:[...],fondo}, ver mas abajo) al añadir el mosaico 2x2 -- ch ya
// no queda vacio en ninguna de las dos, ver TEXTURA_TERRENO/
// TEXTURA_COBERTURA/tonoCelda mas arriba para el mecanismo de variante+tono
// determinista por celda.
function fondoBioma(c) {
  if (c.tiene_agua) {
    const g = CATALOGO_GLIFOS.agua[c.tipo_agua] || CATALOGO_GLIFOS.agua.lago;
    return g.color;
  }
  const g = CATALOGO_GLIFOS.terreno[c.bioma];
  return g ? g.color : '#333333';
}

// MOSAICO 2x2 (2026-09-16, Diego: "y si creamos mas celdas... eso nos
// permitiria ser mas fieles a mostrar los recursos de una celda"). Cada
// celda del motor sigue siendo la misma (100 m², config/mundo.yaml:
// metros_por_celda=10, sin tocar nada de nucleo/) -- esto es subdivision
// PURAMENTE VISUAL: en vez de colapsar a un unico glifo el contenido de
// una celda, itemsCelda() junta TODOS los elementos reales y distintos
// que el motor ya expone (construcciones, planta competidora + coberturas,
// recursos en el suelo) en una lista, y renderMapa() los reparte en un
// mosaico de hasta 4 cuadrantes en vez de descartar todo menos el primero.
// El orden de entrada a la lista es determinista (construcciones por
// huella, luego planta, luego recursos) -- nunca cambia de un frame a otro
// para el mismo estado. Agua queda FUERA de este mecanismo a proposito:
// una celda de agua no tiene una "mitad seca" que el motor modele, mezclar
// agua con otro icono en el mismo mosaico inventaria una particion que no
// existe en los datos.
function itemsCelda(c) {
  const fondoBase = fondoBioma(c);

  if (c.tiene_agua) {
    const g = CATALOGO_GLIFOS.agua[c.tipo_agua] || CATALOGO_GLIFOS.agua.lago;
    // Profundidad real (agua permanente o charco efimero segun el tipo) ->
    // mas oscuro/opaco cuanto mas profundo, dato real del motor, no un
    // degradado inventado.
    const prof = c.tipo_agua === 'poza' ? c.profundidad_charco : c.profundidad_agua;
    const alfaFondo = Math.max(0.45, Math.min(0.85, 0.5 + (prof || 0) * 0.35));
    const item = c.tipo_agua === 'poza'
      ? { ch: ':', color: tonoCelda(g.color, c.x, c.y, 61, 0.2) }
      : { ch: g.ch, color: tonoCelda(g.color, c.x, c.y, 63, 0.2) };
    return { items: [item], fondo: hexARgba(g.color, alfaFondo) };
  }

  const items = [];

  const construcciones = construccionesPorCelda[c.x + ',' + c.y] || [];
  for (const con of [...construcciones].sort((a, b) =>
      (ORDEN_HUELLA_CONSTRUCCION[b.tipo] || 1) - (ORDEN_HUELLA_CONSTRUCCION[a.tipo] || 1))) {
    const g = CATALOGO_GLIFOS.construcciones[con.tipo] || { ch: '#', color: '#8a6a3a' };
    items.push({ ch: g.ch, color: g.color, img: g.img || null, tipoConstruccion: con.tipo });
  }

  // Segundo plano combinado (mismo mecanismo que ya existia, ahora dentro
  // de itemsCelda): si un arbol/arbusto comparte celda con cobertura real,
  // la cobertura tiñe el fondo en vez de perderse.
  let fondoColor = fondoBase, fondoAlfa = items.length > 0 ? 0.3 : 0.22;
  if (c.plantas && c.plantas.length > 0) {
    const competidora = c.plantas.find(p => {
      const g = CATALOGO_GLIFOS.flora[p.especie];
      return g && g.categoria !== 'cobertura';
    });
    const coberturas = c.plantas.filter(p => {
      const g = CATALOGO_GLIFOS.flora[p.especie];
      return g && g.categoria === 'cobertura';
    });
    if (competidora) {
      const g = CATALOGO_GLIFOS.flora[competidora.especie];
      // Etapa de crecimiento real (Planta.etapa 0..1) -> TAMAÑO (ver
      // factorCrecimiento en tamanoSpriteFlora), no opacidad. CORREGIDO
      // 2026-09-16 (Diego: "lo de la opacidad cuando es mas joven
      // quitalo, eso no tiene sentido") -- una planta joven es mas
      // PEQUEÑA, no mas transparente; la opacidad decreciente por etapa
      // ya quedo redundante/incorrecta en cuanto el tamaño empezo a
      // reflejar la etapa real (circulo anterior), retirada por completo.
      items.push({ ch: g.ch, color: g.color, img: g.img || null, especieFlora: competidora.especie, etapaCrecimiento: competidora.etapa ?? 1 });
      if (coberturas.length > 0) {
        fondoColor = CATALOGO_GLIFOS.flora[coberturas[0].especie].color;
        fondoAlfa = 0.4;
      }
    } else {
      // Sin competidora: cada especie de cobertura real (normalmente una,
      // pero el motor permite mas de una) entra como su propio item --
      // antes solo se representaba la primera, el resto se descartaba.
      coberturas.forEach((cob, i) => {
        const g = CATALOGO_GLIFOS.flora[cob.especie];
        if (!g) return;
        // Etapa -> TAMAÑO cuando hay sprite (tamanoSpriteCobertura), ya
        // no opacidad (ver comentario junto a competidora mas arriba).
        // Las 4 especies de cobertura SIN sprite (liquen/musgo/hierba_
        // desertica/hierba_artica) se quedan sin ninguna señal visual de
        // etapa -- honesto: no hay un tamaño que variar en un glifo de
        // textura que ya ocupa la celda completa por diseño.
        if (g.img) {
          // Cobertura CON sprite (2026-09-16: hierba/flor_silvestre/
          // helecho) -- especieCobertura distingue este caso de
          // especieFlora (arbol/arbusto) en renderMapa, porque el tamaño
          // se calcula distinto (tamanoSpriteCobertura, fijo, sin
          // huella_m2 real para esta categoria).
          items.push({ ch: g.ch, color: g.color, img: g.img, especieCobertura: cob.especie, etapaCrecimiento: cob.etapa ?? 1 });
        } else {
          const ch = glifoTextura(TEXTURA_COBERTURA, c.x, c.y, 67 + i);
          items.push({ ch, color: tonoCelda(g.color, c.x, c.y, 71 + i, 0.3) });
        }
      });
    }
  }

  // Recursos en el suelo -- BADGES, no items, cuando ya hay flora/
  // construccion real en la celda (2026-09-16, hallazgo de Diego: "por
  // que hay arboles en las celdas pequeñas"). Causa real medida antes de
  // tocar nada: el 94% de las celdas con arbol tambien tienen madera
  // caida (recurso propio del arbol) -- al entrar como item igual que el
  // arbol, items.length pasaba a 2 y renderMapa() forzaba el mosaico de
  // cuadrantes (CELDA*0.42 fijo) para AMBOS, reduciendo el arbol grande a
  // una miniatura en la inmensa mayoria de los casos reales, no en el
  // "caso raro" para el que se diseño el mosaico. Un palo/piedra caida es
  // un detalle secundario -- no deberia competir en igualdad de espacio
  // con el elemento principal de la celda. Si NO hay ningun item todavia
  // (celda de flora/construccion vacia, solo el recurso), se mantiene
  // como item normal a tamaño completo -- es lo unico que hay que ver.
  const recursos = c.recursos || {};
  const badges = [];
  const empujarRecurso = (cantidad, tipo) => {
    if (cantidad <= 0) return;
    const g = CATALOGO_GLIFOS.recursos[tipo];
    if (items.length > 0) badges.push({ ch: g.ch, color: g.color });
    else items.push({ ch: g.ch, color: g.color });
  };
  empujarRecurso(recursos.piedra_suelta || 0, 'piedra_suelta');
  empujarRecurso(recursos.madera || 0, 'madera');

  if (items.length === 0) {
    // Terreno base desnudo: SIEMPRE imprime un glifo (nunca vacio) --
    // variante de textura + tono elegidos por hash determinista de la
    // celda (ver TEXTURA_TERRENO/tonoCelda arriba). Excepcion real:
    // montaña distingue pico de ladera por elevacion real, convencion
    // estandar de todo roguelike.
    if (c.bioma === 'montana' && c.elevacion > 0.72) {
      const g = CATALOGO_GLIFOS.terreno.pico;
      items.push({ ch: g.ch, color: tonoCelda(g.color, c.x, c.y, 41, 0.2) });
    } else if (c.bioma === 'montana') {
      const g = CATALOGO_GLIFOS.terreno.montana;
      items.push({ ch: g.ch, color: tonoCelda(g.color, c.x, c.y, 43, 0.2) });
    } else {
      const pool = TEXTURA_TERRENO[c.bioma] || ['░'];
      const ch = glifoTextura(pool, c.x, c.y, 47);
      items.push({ ch, color: tonoCelda(fondoBase, c.x, c.y, 53, 0.35) });
    }
  }

  return { items: items.slice(0, 4), fondo: hexARgba(fondoColor, fondoAlfa), badges };
}

function celdaAPantalla(wx, wy, tam) {
  return { cx: wx * tam, cy: wy * tam };
}

// Dos capas dentro de #mapa-contenido: la ESTATICA (suelo -- terreno,
// agua, flora, construcciones, recursos) se destruye y se recrea entera en
// cada render; la de CRIATURAS es persistente entre renders (un elemento
// por id, solo se actualiza left/top) para poder animar su desplazamiento
// con una transicion CSS en vez de teletransportarlas -- mismo mecanismo
// que ya tenia el prototipo hibrido, ahora aplicado a texto en vez de
// imagenes.
let capaEstatica = null, capaCriaturas = null;
function asegurarCapas() {
  const cont = document.getElementById('mapa-contenido');
  if (!capaEstatica) {
    capaEstatica = document.createElement('div');
    capaEstatica.style.position = 'absolute';
    capaEstatica.style.top = '0'; capaEstatica.style.left = '0';
    cont.appendChild(capaEstatica);
  }
  if (!capaCriaturas) {
    capaCriaturas = document.createElement('div');
    capaCriaturas.style.position = 'absolute';
    capaCriaturas.style.top = '0'; capaCriaturas.style.left = '0';
    cont.appendChild(capaCriaturas);
  }
  return cont;
}

// Escala generica por raiz N-esima de una razon contra una referencia
// propia -- MISMO metodo de compresion para fauna y construcciones (evita
// que un rango real amplio se dispare de forma absurda en pantalla), pero
// SIN forzar que compartan la misma unidad, el mismo punto de anclaje NI
// el mismo exponente: metros (altura real de un individuo) y kg (masa
// minima de material de un edificio) no son la misma magnitud fisica y
// cruzarlas como si lo fueran fue precisamente el bug de un circulo
// anterior (ver comentario de tamanoSpriteConstruccion mas abajo).
// exponente=0.5 (raiz cuadrada) por defecto -- el que ya usaba fauna.
function escalarPorRaiz(valor, valorReferencia, pxReferencia, minPx, maxPx, exponente = 0.5) {
  const escala = Math.pow(Math.max(0.0001, valor) / valorReferencia, exponente);
  return Math.max(minPx, Math.min(maxPx, pxReferencia * escala));
}

// RECALIBRADO 2026-09-16 (Diego, tercera vuelta sobre este mismo
// mecanismo): "tampoco hagas gigantes las construcciones, igual lo que
// hay que hacer es las criaturas mas pequeñas, porque al final tambien
// estan los arboles y flora" -- la flora (arbol/arbusto/cobertura) sigue
// siendo un unico glifo confinado a su celda (CELDA=32px, nunca
// reescalado), asi que criaturas/construcciones demasiado grandes frente
// a ese ancla rompen la coherencia visual del mapa completo, no solo la
// proporcion entre ellas dos. Referencia de gnomo bajada de CELDA*1.4 a
// CELDA*1.0 (una persona ~del ancho de una celda, no 1.4x) y el tope de
// fauna de CELDA*2.2 a CELDA*1.5 (un caballo ya no supera 1.5 celdas).
const ALTURA_REFERENCIA_M = 0.9; // ~altura media de gnomo (rango 0.9-1.2m)
const BASE_SPRITE_A_REFERENCIA = CELDA * 1.0;
const ALTURA_SPRITE_MIN = CELDA * 0.5;
const ALTURA_SPRITE_MAX = CELDA * 1.5;

// Tamaño de sprite de construccion -- REESCRITO 2026-09-16, tres veces en
// el mismo circulo. 1er intento: huella_m2 (area) cruzada con la
// referencia de metros de fauna -- Diego: "ese gnomo es enorme en
// comparacion a la construccion" (un refugio salia mas pequeño en
// pantalla que una persona). 2o intento: huella_m2 ya cruzada
// correctamente, pero seguia siendo la metrica EQUIVOCADA para decidir
// cual es "el mas grande" -- Diego: "el mas grande deberia ser el salon
// comun", y por huella_m2 NO lo es (almacen=40 > salon_comun=35).
// Investigado contra el propio config antes de tocar nada mas:
// huella_m2_salon_comun se bajo de 45 a 35 el 2026-09-09 por una razon
// puramente aritmetica (que cupiera junto al almacen dentro de
// capacidad_construccion_celda_m2=80), NO porque el edificio sea mas
// pequeño -- el comentario original de salon_comun ya decia
// explicitamente "Algo mas grande que el almacen (masa)", y
// masa_minima_salon_comun (70) SI es mayor que masa_minima_almacen (60).
// La masa de material -- no la huella en el suelo -- es el eje que
// realmente codifica la jerarquia de importancia constructiva que Diego
// ya habia fijado en su propio config. huella_m2 sigue siendo la
// metrica CORRECTA para ORDEN_HUELLA_CONSTRUCCION (desempatar que sello
// dibujar cuando 2 construcciones compiten por la misma celda -- ese
// mecanismo es literalmente sobre area de suelo), asi que se queda
// intacta; el tamaño VISUAL usa una tabla separada.
//
// 3er intento (este): con masa arreglando el orden, el resultado
// (refugio 81px, salon_comun 175px sin zoom) volvia a ser "gigante" --
// Diego lo señalo de nuevo, pidiendo ademas reducir fauna (ver arriba).
// Cambio de exponente de 0.5 (raiz cuadrada) a 1/3 (raiz CUBICA) para
// las construcciones, no un ajuste arbitrario de constantes: masa ~
// volumen ~ lado³ es la relacion fisicamente correcta entre una MASA
// (kg) y un tamaño LINEAL, a diferencia de huella_m2 (area, donde raiz
// cuadrada si es lo correcto) -- de paso, al ser un exponente menor,
// comprime mas el rango real (70/15=4.67x en masa queda en 1.67x en
// pantalla, antes 2.16x con raiz cuadrada), exactamente lo que Diego
// pedia sin inventar un factor de ajuste sin justificar.
const MASA_MINIMA_CONSTRUCCION = { salon_comun: 70, almacen: 60, cocina: 50, taller: 50, refugio: 15 };
const MASA_REFERENCIA_KG = 15; // masa_minima_refugio
// Referencia propia (no cruzada con metros): el edificio mas pequeño real
// (refugio) se ancla apenas por encima del sprite de la criatura mas
// grande posible (caballo, tope ALTURA_SPRITE_MAX) -- un edificio, por
// modesto que sea, nunca deberia caber "dentro" de una persona, pero
// tampoco desbordar varias celdas de flora vecinas.
const SPRITE_CONSTRUCCION_REFERENCIA = ALTURA_SPRITE_MAX * 1.1;
const SPRITE_CONSTRUCCION_MIN = CELDA * 1.0;
const SPRITE_CONSTRUCCION_MAX = CELDA * 3.0;
function tamanoSpriteConstruccion(tipo) {
  const masa = MASA_MINIMA_CONSTRUCCION[tipo] || MASA_REFERENCIA_KG;
  return escalarPorRaiz(masa, MASA_REFERENCIA_KG, SPRITE_CONSTRUCCION_REFERENCIA, SPRITE_CONSTRUCCION_MIN, SPRITE_CONSTRUCCION_MAX, 1 / 3);
}

// Tamaño de sprite de flora (arbol/arbusto, 2026-09-16) -- huella_m2 real
// de config/flora.yaml (misma fuente que ya usa el motor para el cupo de
// espacio compartido por celda, no un numero inventado para el visor).
// exponente=0.5 (raiz cuadrada), no 1/3 como construccion: huella_m2 es
// AREA, no masa/volumen -- mismo razonamiento fisico que ya distingue
// ambos casos en el comentario de escalarPorRaiz mas arriba.
// Rango MIN/MAX PROVISIONAL, sin calibrar contra captura real: pensado
// para quedar por encima de la fauna mas grande (caballo, CELDA*1.5) pero
// por debajo del techo de construccion (CELDA*3.0) -- un arbol maduro
// deberia leerse mas prominente que un animal, nunca que un edificio.
const HUELLA_FLORA_M2 = {
  manzano: 4.0, roble: 5.0, pino: 4.5, cactus: 1.5,
  arbusto_espinoso: 2.0, arbusto_desertico: 1.8, arbusto_montano: 2.2, arbusto_artico: 1.0,
};
const HUELLA_REFERENCIA_FLORA_M2 = 1.0; // arbusto_artico, la especie con sprite mas pequeña
const SPRITE_FLORA_REFERENCIA = CELDA * 1.0;
const SPRITE_FLORA_MIN = CELDA * 0.9;
const SPRITE_FLORA_MAX = CELDA * 2.6;
// ASPECT_FLORA (2026-09-16, hallazgo real de Diego: "los arbustos no son
// demasiado grandes? no se ve ni un arbol") -- verificado con numeros
// antes de tocar nada: tamanoSpriteFlora fijaba SOLO la altura del <img>
// (width:auto en CSS), dejando el ancho en pantalla a merced del aspect
// ratio nativo de cada PNG -- que varia por como se compuso el arte
// original, sin relacion con huella_m2. Resultado real medido: pino
// (huella=4.5, aspect ancho/alto=0.64, muy vertical) salia con SOLO
// 43.5px de ancho en pantalla, mas ESTRECHO que cualquiera de los 3
// arbustos (aspect ~1.18-1.23, huella 1.0-2.2, la mitad o menos) que
// llegaban a 52-58px de ancho por su propio aspect ancho. Fix: escalar
// por AREA visual (ancho*alto) proporcional a huella_m2, no solo por
// altura -- ver tamanoSpriteFlora mas abajo. Valores medidos directo de
// cada PNG (Image.size), no inventados.
const ASPECT_FLORA = {
  manzano: 607 / 700, roble: 702 / 783, pino: 475 / 742, cactus: 261 / 429,
  arbusto_espinoso: 585 / 495, arbusto_desertico: 579 / 470, arbusto_montano: 639 / 519, arbusto_artico: 639 / 519,
};
// FACTOR_TAMANO_ARBUSTO (2026-09-16, Diego: "los arbustos deberian ser
// incluso mas pequeños") -- reduccion adicional SOLO para categoria
// arbusto, no arbol: huella_m2 real ya los diferencia (1.0-2.2 frente a
// 4.0-5.0), pero el resultado seguia leyendose grande. PROVISIONAL, sin
// mas criterio que el propio pedido -- valor de partida, ajustable.
const FACTOR_TAMANO_ARBUSTO = 0.72;

// Crecimiento real por etapa + variacion de madurez (2026-09-16, Diego:
// "¿todos los arbustos son del mismo tamaño? no todos los arboles crecen
// igual de grande"). Verificado antes de tocar nada: SI, eran todos
// identicos -- Planta.etapa (0..1, crecimiento real, ya expuesta por el
// DTO) solo se usaba para opacidad, nunca para tamaño, asi que un brote
// recien plantado se veia del mismo tamaño GRANDE que un arbol centenario,
// solo mas transparente. Dos fuentes de variacion, de naturaleza distinta
// -- no confundirlas:
// 1. FACTOR_ETAPA_MIN: dato REAL del motor (Planta.etapa). Curva lineal
//    de 0.35 (recien brotada) a 1.0 (madura) sobre el tamaño ya calculado
//    por huella_m2 -- PROVISIONAL el propio 0.35 (sin curva de
//    crecimiento real del motor de la que derivarlo, es una eleccion de
//    presentacion razonada, no un dato).
// 2. RANGO_JITTER_ESCALA: el motor NO modela ninguna variacion de tamaño
//    MAXIMO entre dos plantas maduras de la misma especie (a diferencia
//    de fauna, que si sortea DimensionesFisicas.altura_m real por
//    individuo con rango racial) -- sin ese dato, dos robles maduros
//    serian pixel-perfect identicos. Relleno puramente visual, mismo
//    mecanismo ya usado para el jitter de posicion (hashDet, sal propia,
//    determinista por celda para que no "respire" entre refrescos) --
//    declarado como tal, no se inventa un dato de motor que no existe.
const FACTOR_ETAPA_MIN = 0.35;
const SAL_JITTER_ESCALA = 113;
const RANGO_JITTER_ESCALA = 0.15; // +-15% sobre el tamaño ya calculado
function factorCrecimiento(etapa) {
  return FACTOR_ETAPA_MIN + Math.max(0, Math.min(1, etapa)) * (1 - FACTOR_ETAPA_MIN);
}
function factorJitterEscala(seedX, seedY) {
  return 1 + (hashDet(seedX, seedY, SAL_JITTER_ESCALA) - 0.5) * 2 * RANGO_JITTER_ESCALA;
}

function tamanoSpriteFlora(especie, etapa, seedX, seedY) {
  const huella = HUELLA_FLORA_M2[especie] || HUELLA_REFERENCIA_FLORA_M2;
  const ladoEquivalente = escalarPorRaiz(huella, HUELLA_REFERENCIA_FLORA_M2, SPRITE_FLORA_REFERENCIA, SPRITE_FLORA_MIN, SPRITE_FLORA_MAX, 0.5);
  // altura tal que ancho*altura (area real en pantalla) = ladoEquivalente^2,
  // independientemente del aspect ratio nativo del sprite.
  const aspect = ASPECT_FLORA[especie] || 1;
  let altura = ladoEquivalente / Math.sqrt(aspect);
  const g = CATALOGO_GLIFOS.flora[especie];
  if (g && g.categoria === 'arbusto') altura *= FACTOR_TAMANO_ARBUSTO;
  altura *= factorCrecimiento(etapa ?? 1) * factorJitterEscala(seedX, seedY);
  return altura;
}

// Tamaño de sprite de cobertura (hierba/flor_silvestre/helecho, mismo dia)
// -- a diferencia de arbol/arbusto, estas especies NO compiten por
// espacio fisico (compite_espacio_fisico: false en config/flora.yaml,
// sin huella_m2 real) -- no hay ningun dato del motor del que derivar un
// tamaño proporcional sin inventarlo. Tamaño base FIJO, mas pequeño que
// el arbusto mas pequeño (arbusto_artico, CELDA*1.0), consistente con
// que cobertura ya se describe en este mismo catalogo como "mas discreta
// que un arbusto/arbol". Mismo crecimiento por etapa + jitter de escala
// que arbol/arbusto (ver su comentario) aplicado tambien aqui. Rango
// base PROVISIONAL, sin calibrar contra captura real.
const SPRITE_COBERTURA_ALTURA = CELDA * 0.75;
function tamanoSpriteCobertura(etapa, seedX, seedY) {
  return SPRITE_COBERTURA_ALTURA * factorCrecimiento(etapa ?? 1) * factorJitterEscala(seedX, seedY);
}

function crearCeldaTxt(ch, color, cx, cy, fondo) {
  const el = document.createElement('div');
  el.className = 'celda-txt';
  el.textContent = ch;
  el.style.width = CELDA + 'px'; el.style.height = CELDA + 'px';
  el.style.fontSize = Math.round(CELDA * 0.8) + 'px';
  el.style.color = color;
  if (fondo) el.style.backgroundColor = fondo;
  el.style.left = cx + 'px'; el.style.top = cy + 'px';
  return el;
}

// Badges de recurso en el suelo (2026-09-16, ver itemsCelda -- por que
// dejaron de ser items que competian por el mosaico de cuadrantes).
// Esquina superior-derecha, apilados si hay mas de uno (piedra_suelta Y
// madera a la vez, raro pero posible); tamaño pequeño fijo, nunca
// desplaza ni reescala el elemento principal de la celda.
function añadirBadges(el, badges) {
  if (!badges || badges.length === 0) return;
  badges.forEach((b, i) => {
    const badge = document.createElement('div');
    badge.className = 'badge-recurso';
    badge.textContent = b.ch;
    badge.style.color = b.color;
    badge.style.top = (i * Math.round(CELDA * 0.32)) + 'px';
    el.appendChild(badge);
  });
}

// Construcciones con sprite real (2026-09-16, mismo criterio ya aplicado a
// fauna) -- a diferencia de las criaturas (capa persistente, animada), las
// construcciones viven en la capa ESTATICA: se recrean enteras en cada
// renderMapa() igual que cualquier otro elemento del suelo, no necesitan
// transicion de movimiento propia. El contenedor conserva el color de
// fondo de la celda (rastro de terreno bajo el edificio, mismo `fondo` que
// ya calculaba itemsCelda); el <img> se ancla abajo-centro dentro de el,
// igual que .criatura-img, escalado por huella_m2 real
// (tamanoSpriteConstruccion) en vez de un tamaño fijo.
function crearCeldaImgEstatica(src, cx, cy, fondo, tamano) {
  const cont = document.createElement('div');
  cont.className = 'celda-txt';
  cont.style.width = CELDA + 'px'; cont.style.height = CELDA + 'px';
  cont.style.left = cx + 'px'; cont.style.top = cy + 'px';
  if (fondo) cont.style.backgroundColor = fondo;
  const img = document.createElement('img');
  // .construccion-img (ancla inferior-centro, pixelated) se reutiliza tal
  // cual para flora (2026-09-16) -- mismo contrato visual, "raices en el
  // suelo de la celda", no hacia falta una clase CSS propia.
  img.className = 'construccion-img';
  img.src = src;
  img.style.height = tamano + 'px';
  // Jitter horizontal (ver su comentario junto a hashDet/jitterPx) --
  // sobrescribe el left:50% fijo de .construccion-img. Semilla = celda
  // real (cx/cy son x*CELDA/y*CELDA exactos, ver celdaAPantalla), estable
  // entre refrescos: el mismo arbol no "salta" de sitio en cada sondeo.
  img.style.left = `calc(50% + ${jitterPx(cx / CELDA, cy / CELDA)}px)`;
  cont.appendChild(img);
  return cont;
}

// Peso real de un item, para decidir el ORDEN de profundidad cuando 2+
// comparten celda (ver crearElementosCompartidos) -- 2026-09-16/17,
// historial real en dos circulos: primero se uso para repartir la celda
// en columnas proporcionales (grid), descartado el 17 (ver mas abajo) a
// favor de superposicion real. Reutiliza huella_m2 donde existe
// (construccion/arbol/arbusto, mismo dato que ya decide el tamaño a
// celda completa) -- cobertura y cualquier otro item sin huella_m2 real
// recibe el peso nominal minimo (HUELLA_REFERENCIA_FLORA_M2), no un
// numero inventado aparte.
function pesoItem(item) {
  if (item.tipoConstruccion) return ORDEN_HUELLA_CONSTRUCCION[item.tipoConstruccion] || HUELLA_REFERENCIA_FLORA_M2;
  if (item.especieFlora) return HUELLA_FLORA_M2[item.especieFlora] || HUELLA_REFERENCIA_FLORA_M2;
  return HUELLA_REFERENCIA_FLORA_M2;
}

// capa/tamaño reales de un item generico (construccion/flora/cobertura)
// -- extraidos de renderMapa() para reutilizarlos tanto en el caso de un
// solo item como en el de varios compartiendo celda.
function capaItem(item) {
  return item.tipoConstruccion ? 'construccion' : 'flora';
}
function tamanoItem(item, x, y) {
  if (item.tipoConstruccion) return tamanoSpriteConstruccion(item.tipoConstruccion);
  if (item.especieFlora) return tamanoSpriteFlora(item.especieFlora, item.etapaCrecimiento, x, y);
  if (item.especieCobertura) return tamanoSpriteCobertura(item.etapaCrecimiento, x, y);
  return null; // glifo simple sin sprite (p.ej. cobertura sin arte)
}

// Sprite de un item que comparte celda con otro(s) -- mismo contrato de
// ancla (inferior-centro, ver .sprite-compartido) que crearCeldaImgEstatica,
// pero con jitter horizontal DISTINTO por indice (para no apilar dos
// sprites exactamente en la misma X) y un offset vertical opcional que
// simula profundidad (ver crearElementosCompartidos).
function crearImgCompartida(src, cx, cy, tamano, indiceJitter, offsetVerticalPx) {
  const img = document.createElement('img');
  img.className = 'sprite-compartido';
  img.src = src;
  img.style.height = tamano + 'px';
  const jx = jitterPx(cx / CELDA, cy / CELDA + indiceJitter * 37);
  img.style.left = (cx + CELDA / 2 + jx) + 'px';
  img.style.top = (cy + CELDA - offsetVerticalPx) + 'px';
  img.style.transform = 'translate(-50%, -100%)';
  return img;
}

function crearFondoCelda(cx, cy, fondo) {
  const div = document.createElement('div');
  div.className = 'celda-txt';
  div.style.width = CELDA + 'px'; div.style.height = CELDA + 'px';
  div.style.left = cx + 'px'; div.style.top = cy + 'px';
  if (fondo) div.style.backgroundColor = fondo;
  return div;
}

// SUPERPOSICION CON PROFUNDIDAD (2026-09-17, Diego: "quedaria mejor si
// se pudiesen solapar, por ejemplo el refugio y que el pino crezca por
// detras, le daria sensacion de mas profundidad al mapa") -- sustituye
// por completo al mosaico de columnas/grid del circulo anterior (ver
// docs/historial_capa_visual.md para el porque de aquel diseño y de
// esta correccion). Antes, CUALQUIER par de items compartiendo celda se
// repartia el espacio (proporcional a huella_m2, pero siempre partiendo
// la celda) -- ahora el elemento de MAYOR peso real (pesoItem) se dibuja
// a su tamaño NORMAL, exactamente igual que si estuviera solo en la
// celda; los demas (menor peso) se dibujan DETRAS (z-index menor), algo
// mas pequeños y desplazados hacia arriba dentro de la propia celda
// (mas "lejos" de la camara) -- el pino creciendo detras del refugio del
// ejemplo de Diego, no partido en un cuadrante igual de chico que el
// refugio. Devuelve una LISTA de elementos (uno por item + uno de fondo
// compartido), no un unico contenedor -- renderMapa() los añade todos.
function crearElementosCompartidos(items, cx, cy, fondo, x, y) {
  const elementos = [crearFondoCelda(cx, cy, fondo)];
  const ordenados = [...items].sort((a, b) => pesoItem(a) - pesoItem(b));
  ordenados.forEach((item, i) => {
    const esPrincipal = i === ordenados.length - 1;
    const tam = tamanoItem(item, x, y);
    let el;
    if (tam != null) {
      // Secundarios: ~18% mas pequeños y desplazados hacia arriba (mas
      // desplazamiento cuantos mas secundarios haya, para separarlos
      // entre si en el caso raro de 3-4 items) -- el principal usa
      // exactamente el mismo tamaño/offset que si estuviera solo.
      const factor = esPrincipal ? 1 : 0.82;
      const offsetVertical = esPrincipal ? 0 : CELDA * (0.22 + 0.08 * i);
      el = crearImgCompartida(item.img, cx, cy, tam * factor, esPrincipal ? 0 : (i + 1) * 37, offsetVertical);
    } else {
      // Glifo simple sin sprite (cobertura sin arte, p.ej.) compartiendo
      // celda -- sin offset de profundidad, caso raro sin refinar mas.
      el = crearCeldaTxt(item.ch, item.color, cx, cy);
    }
    el.style.zIndex = String(zIndexPorFila(y, capaItem(item)) + (esPrincipal ? 0 : -1));
    elementos.push(el);
  });
  return elementos;
}

// Profundidad UNIFICADA por fila (2026-09-16, Diego: "los assets deberian
// superponerse, incluso los animales, si pasan por detras que queden
// ocultos, no flotando encima"). Hasta ahora cada tipo tenia su propio
// rango de z-index con un offset fijo enorme (terreno 0+y, flora 400+y,
// construccion 500+y, fauna SIEMPRE 1000+y) -- eso garantizaba que fauna
// nunca quedara oculta por NADA, sin importar su fila real, exactamente
// lo que Diego pide corregir. PRIORIDAD_CAPA*ZI_FILA + prioridad: el
// factor (10) es mayor que el rango de prioridades (0-6) para que la fila
// (posicion real "de profundidad") decida siempre primero -- la
// prioridad solo desempata cuando dos elementos comparten la MISMA fila
// exacta (una criatura de pie sobre su propia celda de flora, p.ej.).
const ZI_FILA = 10;
const PRIORIDAD_CAPA = { terreno: 0, flora: 2, construccion: 4, fauna: 6 };
function zIndexPorFila(y, capa) {
  return y * ZI_FILA + PRIORIDAD_CAPA[capa];
}

function renderMapa() {
  const cont = asegurarCapas();
  capaEstatica.innerHTML = '';
  cont.style.width = (DATA.ancho * CELDA) + 'px';
  cont.style.height = (DATA.alto * CELDA) + 'px';
  for (let y = 0; y < DATA.alto; y++) {
    for (let x = 0; x < DATA.ancho; x++) {
      const c = DATA.celdas[y][x];
      const { cx, cy } = celdaAPantalla(x, y, CELDA);
      const info = itemsCelda(c);
      // z-index = zIndexPorFila(y, capa) -- ver su comentario mas arriba.
      // Historial real de este mecanismo, dos circulos:
      // (1) CORREGIDO 2026-09-16 (Diego, tras ver el almacen: "las
      // criaturas o construcciones deben quedar por encima de todo, que
      // no se solape ningun color o simbolo"). Bug real confirmado con un
      // screenshot: un sprite de construccion es mas ANCHO que una celda
      // (el almacen, p.ej., desborda ~12px a cada lado a esta escala) y
      // se pinta centrado sobre su propia celda -- con el mismo z-index
      // que el resto del suelo (=y), la celda VECINA de la derecha se
      // inserta despues en el DOM en el mismo nivel de apilamiento y por
      // tanto tapa el borde desbordado del tejado. Fix de entonces:
      // construccion/flora a un nivel fijo muy por encima de TODO el
      // suelo (400+y/500+y), fauna siempre por encima de eso (1000+y).
      // (2) REVERTIDO ese offset fijo el mismo dia, circulo siguiente
      // (Diego: "los assets deberian superponerse, incluso los animales,
      // si pasan por detras que queden ocultos, no flotando encima") --
      // el offset fijo de (1) resolvia el desborde pero como efecto
      // secundario garantizaba que fauna (1000+y) NUNCA quedara oculta
      // por NADA sin importar su fila real, justo lo contrario de lo que
      // Diego pide ahora. zIndexPorFila ya resuelve ambos a la vez: el
      // desborde de (1) sigue evitado porque, DENTRO de la misma fila,
      // construccion/flora siguen teniendo mayor prioridad que terreno
      // (ver PRIORIDAD_CAPA), y ahora fauna compite por profundidad real
      // contra flora/construccion via su propia fila (ent.y en
      // renderCriaturas), no un offset que la haga invencible. Limite
      // conocido, sin resolver, mismo que ya existia: dos elementos
      // ADYACENTES en la misma fila exacta podrian seguir solapandose
      // entre si por el mismo mecanismo de desempate por orden de
      // insercion -- no observado en juego libre.
      if (info.items.length > 1) {
        // 2+ items reales compartiendo celda -- superpuestos con
        // profundidad (ver crearElementosCompartidos), no repartidos en
        // un mosaico. Devuelve [fondo, ...sprites], el fondo ya en el
        // indice 0 es donde cuelgan los badges (unico elemento comun a
        // toda la celda compartida).
        const elementos = crearElementosCompartidos(info.items, cx, cy, info.fondo, x, y);
        elementos[0].style.zIndex = String(zIndexPorFila(y, 'terreno'));
        añadirBadges(elementos[0], info.badges);
        elementos.forEach(el => capaEstatica.appendChild(el));
        continue;
      }
      const unico = info.items[0] || {};
      const esConstruccionUnica = !!unico.tipoConstruccion;
      const esFloraUnica = !esConstruccionUnica && !!unico.especieFlora;
      const esCoberturaUnica = !esConstruccionUnica && !esFloraUnica && !!unico.especieCobertura;
      let el;
      if (esConstruccionUnica) {
        el = crearCeldaImgEstatica(unico.img, cx, cy, info.fondo, tamanoSpriteConstruccion(unico.tipoConstruccion));
      } else if (esFloraUnica) {
        el = crearCeldaImgEstatica(unico.img, cx, cy, info.fondo, tamanoSpriteFlora(unico.especieFlora, unico.etapaCrecimiento, x, y));
      } else if (esCoberturaUnica) {
        el = crearCeldaImgEstatica(unico.img, cx, cy, info.fondo, tamanoSpriteCobertura(unico.etapaCrecimiento, x, y));
      } else {
        el = crearCeldaTxt(unico.ch || '', unico.color || '#000', cx, cy, info.fondo);
      }
      const capaSuelo = esConstruccionUnica ? 'construccion' : (esFloraUnica || esCoberturaUnica) ? 'flora' : 'terreno';
      el.style.zIndex = String(zIndexPorFila(y, capaSuelo));
      añadirBadges(el, info.badges);
      capaEstatica.appendChild(el);
    }
  }
  document.getElementById('titulo-mapa-info').textContent =
    `TICK ${DATA.tick} · DIA ${DATA.dia} · ${DATA.estacion.toUpperCase()} · ${DATA.clima.toUpperCase()}`;
}

// CORREGIDO 2026-09-16 (Diego: "caballos mas pequeños que zorros, cabras
// del tamaño de conejos, haz que tenga sentido eso"). El bug real: una
// altura de sprite FIJA para todas las especies solo reflejaba cuanto
// margen vacio dejaba el recorte de cada PNG generado, no el tamaño real
// del animal. Corregido igual que ya se documento para el sistema
// retirado (escalaPorAltura del prototipo hibrido pre-ASCII): escala por
// DimensionesFisicas.altura real del INDIVIDUO (dimensiones.altura_m, ya
// expuesta en el DTO) -- dato real del motor, no una tabla inventada.
// Raiz cuadrada en vez de lineal: el rango real de config/poblacion.yaml
// va de 0.15m (ardilla) a 1.8m (caballo), mas de 10x -- un caballo 10
// veces mas alto que una ardilla en pantalla seria absurdo a esta escala
// de celda, pero el ORDEN relativo (mayor altura real = mayor sprite) se
// conserva siempre, a diferencia del bug anterior donde no se conservaba
// en absoluto. Ancho en 'auto': el navegador preserva la proporcion real
// de cada PNG (todas distintas -- un conejo sentado es alto y estrecho,
// un zorro de perfil es ancho y bajo).
// ALTURA_REFERENCIA_M / BASE_SPRITE_A_REFERENCIA / ALTURA_SPRITE_MIN/MAX /
// escalarPorRaiz ya definidos mas arriba (ver su comentario -- el mismo
// METODO de compresion se reutiliza para tamanoSpriteConstruccion, pero
// cada una con su propia unidad y referencia, nunca cruzadas entre si).
function alturaSpriteCriatura(ent) {
  const alturaM = (ent.dimensiones && ent.dimensiones.altura_m) || ALTURA_REFERENCIA_M;
  return escalarPorRaiz(alturaM, ALTURA_REFERENCIA_M, BASE_SPRITE_A_REFERENCIA, ALTURA_SPRITE_MIN, ALTURA_SPRITE_MAX);
}

function crearCeldaImg(src, cx, cy, altura, jitter) {
  const el = document.createElement('img');
  el.className = 'criatura-img';
  el.src = src;
  el.style.height = altura + 'px';
  el.style.left = (cx + CELDA / 2 + jitter) + 'px';
  el.style.top = (cy + CELDA) + 'px';
  return el;
}

// DURACION_PASO_CRIATURA (2026-09-16, Diego: "que quede natural como se
// desplaza entre celdas, que no parezca que salta") -- verificado antes
// de tocar nada: el sondeo de estado.json ocurria cada 1000ms mientras
// segundos_por_tick real del motor es 0.4 (config/visual.yaml, ya citado
// en el comentario de iniciar() mas abajo) -- entre dos sondeos el motor
// podia avanzar ~2-3 ticks reales, y una criatura desplazarse igual
// numero de celdas de una sola vez. La transicion CSS (entonces 0.9s
// linear) SIEMPRE anima en linea recta desde el punto A al punto B que
// ve el visor -- si el desplazamiento real fueron 2-3 celdas en un
// camino no necesariamente recto, cualquier duracion/curva se percibe
// como deslizamiento rapido o salto, no como caminar. Fix real: sondear
// al mismo ritmo que el tick real (400ms, ver el setInterval de
// iniciar()) para que cada actualizacion mueva como mucho 1 celda, y
// una duracion de paso (350ms) menor a ese intervalo para que la
// transicion siempre termine antes del siguiente sondeo -- sin esto, un
// sondeo que llegara ligeramente antes interrumpiria una transicion a
// medias, dando tirones. 'ease-in-out' en vez de 'linear':
// aceleracion/desaceleracion suave en cada paso, un paso a velocidad
// constante de inicio a fin tambien se lee mecanico/como salto.
const DURACION_PASO_CRIATURA = 0.35;

let elementosCriatura = {};
function renderCriaturas() {
  asegurarCapas();
  const vistos = new Set();
  for (const ent of DATA.entidades) {
    const idStr = String(ent.id);
    vistos.add(idStr);
    const info = infoCriatura(ent);
    const { cx, cy } = celdaAPantalla(ent.x, ent.y, CELDA);
    let el = elementosCriatura[idStr];
    const esImg = !!info.img;
    // Si el tipo de elemento cambia (no deberia pasar en juego normal,
    // el catalogo es estatico, pero es una red de seguridad barata) se
    // recrea en vez de intentar mutar un <img> en un <div> de texto.
    if (el && !!el.dataset.esImg !== esImg) { el.remove(); el = null; }
    // Jitter (ver comentario junto a jitterPxPorId) -- semilla el ID de
    // la entidad, no su celda actual, para que el sesgo lateral sea
    // constante mientras camina en vez de recalcularse en cada paso.
    const jitter = esImg ? jitterPxPorId(ent.id) : 0;
    if (!el) {
      el = esImg ? crearCeldaImg(info.img, cx, cy, alturaSpriteCriatura(ent), jitter) : crearCeldaTxt(info.ch, info.color, cx, cy);
      el.dataset.esImg = esImg ? '1' : '';
      el.style.transition = `left ${DURACION_PASO_CRIATURA}s ease-in-out, top ${DURACION_PASO_CRIATURA}s ease-in-out`;
      capaCriaturas.appendChild(el);
      elementosCriatura[idStr] = el;
    } else if (esImg) {
      if (!el.src.endsWith(info.img)) el.src = info.img;
      el.style.height = alturaSpriteCriatura(ent) + 'px';
      el.style.left = (cx + CELDA / 2 + jitter) + 'px';
      el.style.top = (cy + CELDA) + 'px';
    } else {
      el.textContent = info.ch;
      el.style.color = info.color;
      el.style.left = cx + 'px';
      el.style.top = cy + 'px';
    }
    if (esImg) el.style.transform = 'translate(-50%, -100%)';
    el.style.zIndex = String(zIndexPorFila(ent.y, 'fauna'));
    el.dataset.entId = idStr;
  }
  // Entidades que ya no existen (murieron, o salieron de la zona
  // exportada) -- se retira su elemento, no se deja huerfano en el DOM.
  for (const id of Object.keys(elementosCriatura)) {
    if (!vistos.has(id)) {
      elementosCriatura[id].remove();
      delete elementosCriatura[id];
    }
  }
}

// --- zoom centrado en el cursor + pan por arrastre ---
let zoom = 1, panX = -CELDA*7, panY = -CELDA*3;
const viewport = document.getElementById('mapa-viewport');
const contenido = document.getElementById('mapa-contenido');
function aplicarTransform() {
  contenido.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
  document.getElementById('zoom-info').textContent = `ZOOM ${zoom.toFixed(2)}x`;
}
viewport.addEventListener('wheel', (ev) => {
  ev.preventDefault();
  const rect = viewport.getBoundingClientRect();
  const mx = ev.clientX - rect.left, my = ev.clientY - rect.top;
  const factor = ev.deltaY < 0 ? 1.12 : 1/1.12;
  const nuevoZoom = Math.min(6, Math.max(0.35, zoom * factor));
  // Mantener el mismo punto de MUNDO bajo el cursor tras cambiar el zoom
  // (sin esto, el mapa "deriva" al hacer zoom si ya se habia desplazado).
  const contentX = (mx - panX) / zoom;
  const contentY = (my - panY) / zoom;
  panX = mx - contentX * nuevoZoom;
  panY = my - contentY * nuevoZoom;
  zoom = nuevoZoom;
  aplicarTransform();
}, { passive: false });
let arrastrando = false, ax=0, ay=0;
viewport.addEventListener('mousedown', (ev) => { arrastrando = true; ax=ev.clientX; ay=ev.clientY; viewport.classList.add('arrastrando'); });
window.addEventListener('mouseup', () => { arrastrando = false; viewport.classList.remove('arrastrando'); });
window.addEventListener('mousemove', (ev) => {
  if (!arrastrando) return;
  panX += (ev.clientX - ax); panY += (ev.clientY - ay);
  ax = ev.clientX; ay = ev.clientY;
  aplicarTransform();
});
document.getElementById('btn-centrar').addEventListener('click', () => {
  if (!DATA) return;
  const rect = viewport.getBoundingClientRect();
  zoom = 1;
  panX = rect.width / 2 - (DATA.ancho * CELDA) / 2;
  panY = rect.height / 2 - (DATA.alto * CELDA) / 2;
  aplicarTransform();
});

// --- leyenda desplegable: una sola fuente de verdad (CATALOGO_GLIFOS) ---
function construirLeyenda() {
  const panel = document.getElementById('leyenda-panel');
  let html = '';
  for (const clave of ['terreno', 'agua', 'flora', 'fauna', 'construcciones', 'recursos']) {
    const seccion = CATALOGO_GLIFOS[clave];
    html += `<h4>${seccion.titulo}</h4>`;
    for (const k in seccion) {
      if (k === 'titulo') continue;
      const it = seccion[k];
      html += `<div class="leyenda-fila"><span class="leyenda-glifo" style="color:${it.color}">${it.ch}</span><span class="leyenda-nombre">${it.nombre}</span></div>`;
    }
  }
  panel.innerHTML = html;
}
const btnLeyenda = document.getElementById('btn-leyenda');
const panelLeyenda = document.getElementById('leyenda-panel');
btnLeyenda.addEventListener('click', (ev) => {
  ev.stopPropagation();
  panelLeyenda.classList.toggle('abierta');
  btnLeyenda.classList.toggle('activo', panelLeyenda.classList.contains('abierta'));
});
document.addEventListener('click', (ev) => {
  if (panelLeyenda.classList.contains('abierta') && !panelLeyenda.contains(ev.target) && ev.target !== btnLeyenda) {
    panelLeyenda.classList.remove('abierta');
    btnLeyenda.classList.remove('activo');
  }
});

function mostrarFicha(ent) {
  const cont = document.getElementById('ficha');
  if (!ent) { cont.innerHTML = '<div class="placeholder">-- selecciona una entidad en el mapa --</div>'; return; }
  let html = `<div style="color:#ffe9c2;font-size:14px;margin-bottom:6px;">${ent.nombre || ent.tipo} <span style="color:#8a5a10">[${ent.tipo}]</span></div>`;
  html += '<div class="kv">';
  html += `<div class="k">POS</div><div class="v">${ent.x},${ent.y}</div>`;
  html += `<div class="k">EDAD</div><div class="v">${ent.edad_anios}a</div>`;
  if (ent.sexo) html += `<div class="k">SEXO</div><div class="v">${ent.sexo}</div>`;
  if (ent.accion) html += `<div class="k">ACCION</div><div class="v">${ent.accion}</div>`;
  if (ent.necesidades) for (const [k,v] of Object.entries(ent.necesidades)) html += `<div class="k">${k}</div><div class="v">${(v*100).toFixed(0)}%</div>`;
  html += '</div>';
  cont.innerHTML = html;
}
// Entidad seleccionada -- guardado por id (no por referencia al objeto,
// que en modo vivo se sustituye entero cada segundo) para poder
// refrescar la ficha sola cuando llega una instantanea nueva, sin que
// el usuario tenga que volver a hacer clic.
let entidadSeleccionadaId = null;
contenido.addEventListener('click', (ev) => {
  const id = ev.target?.dataset?.entId;
  if (!id) return;
  entidadSeleccionadaId = id;
  const ent = DATA.entidades.find(e => String(e.id) === id);
  mostrarFicha(ent);
});

function renderStats() {
  const cont = document.getElementById('stats');
  let html = '<div class="kv">';
  for (const [esp, n] of Object.entries(DATA.censo)) html += `<div class="k">${esp.toUpperCase()}</div><div class="v">${n}</div>`;
  html += `<div class="k">SEMILLA</div><div class="v">${DATA.semilla}</div>`;
  html += '</div>';
  cont.innerHTML = html;
}
function renderNarrador() {
  const cont = document.getElementById('narrador');
  if (!DATA.cronica || DATA.cronica.length === 0) { cont.innerHTML = '<div class="placeholder">-- sin eventos recientes --</div>'; return; }
  cont.innerHTML = DATA.cronica.map(l => `<div class="cronica-linea">${l}</div>`).join('');
}

// Modo en vivo: intenta /estado.json (relativo -- funciona tanto si esto
// se sirve en la raiz de ManejadorWeb como en cualquier prefijo). Si falla
// (servido suelto, sin ese endpoint), cae en silencio a la instantanea
// estatica de datos.js -- no hay ninguna bifurcacion explicita de "modo",
// solo un fetch que puede fallar o no.
//
// CAMBIADO 2026-09-16 (servidor de control remoto, ver spec): antes
// devolvia `false` si el payload no traia `celdas` -- exactamente la
// forma que tiene el payload de "sin partida activa"
// ({partida:{activa:false,...}}, sin celdas). Ahora se devuelve el JSON
// entero tal cual (o null si fallo la peticion) y es manejarNuevoEstado()
// quien decide que hacer segun traiga o no `celdas`.
async function cargarEstadoVivo() {
  try {
    const r = await fetch('estado.json', { cache: 'no-store' });
    if (!r.ok) return null;
    return await r.json();
  } catch (e) {
    return null;
  }
}

// Ultimo {activa,pausada,semilla,velocidad} conocido -- null cuando el
// servidor no expone control de partida en absoluto (modo CLI de main.py
// con SIMULACION_MODO_VISUAL=1, o datos.js estatico sin servidor detras).
// Se mantiene SEPARADO de DATA a proposito: DATA solo se sustituye cuando
// el payload trae `celdas` (hay algo real que dibujar), pero el estado de
// la partida (p.ej. "se acaba de finalizar") sigue siendo real aunque ese
// payload concreto no traiga mapa.
let estadoPartidaActual = null;

function actualizarControlPartida(partida) {
  const barra = document.getElementById('barra-control');
  const pantallaEspera = document.getElementById('pantalla-espera');
  if (!partida) {
    // Sin GestorPartidas detras -- nada que controlar, se oculta la
    // barra entera en vez de dejar botones que siempre fallarian (501).
    barra.style.display = 'none';
    pantallaEspera.style.display = 'none';
    return;
  }
  barra.style.display = 'flex';
  const activa = !!partida.activa;
  pantallaEspera.style.display = activa ? 'none' : 'flex';
  const btnPausar = document.getElementById('btn-pausar');
  btnPausar.textContent = partida.pausada ? 'REANUDAR' : 'PAUSAR';
  btnPausar.disabled = !activa;
  document.getElementById('btn-finalizar').disabled = !activa;
  const selVel = document.getElementById('sel-velocidad');
  selVel.disabled = !activa;
  // No pisar el valor mientras el usuario tiene el selector abierto/
  // enfocado -- evita que el propio polling le devuelva el valor viejo
  // a mitad de un cambio.
  if (activa && document.activeElement !== selVel) selVel.value = String(partida.velocidad || 1);
  document.getElementById('control-estado').textContent = activa
    ? `SEMILLA ${partida.semilla}${partida.pausada ? ' -- PAUSADA' : ''}`
    : '';
}

let primerRenderHecho = false;
function manejarNuevoEstado(nuevo) {
  estadoPartidaActual = nuevo.partida || null;
  actualizarControlPartida(estadoPartidaActual);
  if (!nuevo.celdas) return; // sin partida activa: nada real que dibujar
  DATA = nuevo;
  recalcularDerivados();
  renderMapa();
  renderCriaturas();
  renderStats();
  renderNarrador();
  if (!primerRenderHecho) {
    aplicarTransform();
    primerRenderHecho = true;
  }
  if (entidadSeleccionadaId != null) {
    const ent = DATA.entidades.find(e => String(e.id) === entidadSeleccionadaId);
    mostrarFicha(ent || null);
  }
}

async function llamarControlPartida(ruta, cuerpo) {
  try {
    const r = await fetch(ruta, {
      method: 'POST',
      headers: cuerpo ? { 'Content-Type': 'application/json' } : undefined,
      body: cuerpo ? JSON.stringify(cuerpo) : undefined,
    });
    return await r.json().catch(() => ({ ok: r.ok }));
  } catch (e) {
    return { ok: false, error: String(e) };
  }
}

async function refrescarInmediato() {
  const nuevo = await cargarEstadoVivo();
  if (nuevo) manejarNuevoEstado(nuevo);
}

async function accionNuevaPartida() {
  if (estadoPartidaActual && estadoPartidaActual.activa) {
    if (!confirm('Ya hay una partida en curso -- se perdera. ¿Continuar?')) return;
  }
  const botones = [document.getElementById('btn-nueva-partida'), document.getElementById('btn-nueva-partida-inicial')];
  botones.forEach(b => b.disabled = true);
  await llamarControlPartida('/partida/nueva', {});
  botones.forEach(b => b.disabled = false);
  await refrescarInmediato();
}
document.getElementById('btn-nueva-partida').addEventListener('click', accionNuevaPartida);
document.getElementById('btn-nueva-partida-inicial').addEventListener('click', accionNuevaPartida);

document.getElementById('btn-pausar').addEventListener('click', async (ev) => {
  const boton = ev.currentTarget;
  const pausada = boton.textContent.trim() === 'REANUDAR';
  boton.disabled = true;
  await llamarControlPartida(pausada ? '/partida/reanudar' : '/partida/pausar');
  boton.disabled = false;
  await refrescarInmediato();
});

document.getElementById('sel-velocidad').addEventListener('change', async (ev) => {
  await llamarControlPartida('/partida/velocidad', { factor: parseFloat(ev.target.value) });
  await refrescarInmediato();
});

document.getElementById('btn-finalizar').addEventListener('click', async () => {
  if (!confirm('¿Finalizar la partida actual?')) return;
  const boton = document.getElementById('btn-finalizar');
  boton.disabled = true;
  await llamarControlPartida('/partida/finalizar');
  boton.disabled = false;
  await refrescarInmediato();
});

async function iniciar() {
  construirLeyenda();
  const primero = await cargarEstadoVivo();
  if (primero) {
    // Servidor vivo respondio -- puede traer celdas (partida activa,
    // modo CLI de siempre) o solo {partida:{activa:false}} (servidor de
    // control recien arrancado, sin partida todavia).
    manejarNuevoEstado(primero);
  } else if (DATA) {
    // Sin servidor vivo (fetch fallo) pero datos.js cargo una
    // instantanea estatica -- se dibuja tal cual, sin barra de control
    // (ese payload nunca trae `partida`).
    actualizarControlPartida(null);
    recalcularDerivados();
    renderMapa();
    renderCriaturas();
    aplicarTransform();
    primerRenderHecho = true;
    renderStats();
    renderNarrador();
  } else {
    // Ni datos.js ni /estado.json respondieron -- nada que dibujar
    // todavia, pero se deja la pantalla de espera visible por si el
    // servidor de control aparece en el proximo sondeo.
    actualizarControlPartida({ activa: false });
  }
  // Sondeo continuo. CORREGIDO 2026-09-16 (Diego: "que quede natural
  // como se desplaza entre celdas, que no parezca que salta") -- bajado
  // de 1000ms a 400ms, igualando segundos_por_tick real del motor
  // (config/visual.yaml). El comentario original de este intervalo decia
  // "1000ms ya sondea mas lento que cada tick real" como si fuera una
  // ventaja (menos trabajo de recalcularDerivados) -- pero era
  // precisamente la causa de que una criatura pudiera desplazarse 2-3
  // celdas de golpe entre dos sondeos, viendose como salto/deslizamiento
  // en vez de caminar (ver DURACION_PASO_CRIATURA mas arriba para el
  // detalle completo). A 400ms cada sondeo mueve como mucho 1 celda.
  setInterval(async () => {
    const nuevo = await cargarEstadoVivo();
    if (!nuevo) return;
    manejarNuevoEstado(nuevo);
  }, 400);
}
iniciar();
</script>
