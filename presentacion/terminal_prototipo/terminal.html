<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Vallis Runica -- Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* Fuente bitmap real de VGA (2026-09-16, paquete de Diego -- ver
     oldschool_pc_font_pack_v2.2_web/LICENSE.TXT, CC BY-SA 4.0, atribucion
     pendiente en el mismo lugar que las de PyxelSpace). Reproduccion fiel
     de la ROM de fuente de una tarjeta VGA de IBM real -- la referencia
     autentica del aspecto "terminal DOS/roguelike clasico" que pidio
     Diego, verificada glifo a glifo contra el catalogo completo de
     CATALOGO_GLIFOS antes de adoptarla (los 27 caracteres usados, incluidos
     los menos comunes como ⚒/♨/▣, renderizan nitidos). JetBrains Mono
     queda como fallback si el .woff no carga por lo que sea.
     Fuente pixel: sin antialiasing, se sirve a su tamano nativo (16px,
     multiplo entero del 9x16 real) y se escala con transform, no con
     font-size directo, para no perder la nitidez del pixel -- ver
     CELDA/escala mas abajo en el script. */
  @font-face {
    font-family: 'VGA437';
    src: url('fonts/Web437_IBM_VGA_9x16.woff') format('woff');
    font-display: swap;
  }
  :root {
    --ambar: #ffb000;
    --ambar-tenue: #8a5a10;
    --ambar-fuerte: #ffd27a;
    --fondo: #0a0500;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: #000;
    font-family: 'VGA437', 'JetBrains Mono', "Courier New", ui-monospace, monospace;
    color: var(--ambar);
    height: 100%;
  }
  .layout {
    display: grid;
    grid-template-columns: 3fr 1.1fr;
    grid-template-rows: 1fr;
    gap: 10px;
    height: 100vh;
    padding: 10px;
  }
  .col-derecha {
    display: grid;
    grid-template-rows: 1.3fr 1fr 0.8fr 0.9fr;
    gap: 10px;
    min-height: 0;
  }
  .terminal {
    position: relative;
    background: var(--fondo);
    border: 2px solid var(--ambar-tenue);
    border-radius: 4px;
    box-shadow: 0 0 12px rgba(255,176,0,0.15) inset, 0 0 8px rgba(255,176,0,0.08);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .titulo {
    flex: 0 0 auto;
    font-size: 12px;
    letter-spacing: 2px;
    padding: 4px 10px;
    background: linear-gradient(180deg, rgba(255,176,0,0.18), rgba(255,176,0,0.02));
    border-bottom: 1px solid var(--ambar-tenue);
    color: var(--ambar);
    text-shadow: 0 0 6px rgba(255,176,0,0.8);
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  .titulo-controles { display: flex; align-items: center; gap: 8px; }
  .cuerpo {
    flex: 1 1 auto;
    overflow: auto;
    padding: 8px 10px;
    font-size: 13px;
    line-height: 1.15;
  }
  .crt-overlay {
    position: fixed; inset: 0; pointer-events: none; z-index: 50;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.18) 0px, rgba(0,0,0,0.18) 1px, transparent 1px, transparent 3px),
      radial-gradient(ellipse at center, rgba(0,0,0,0) 60%, rgba(0,0,0,0.45) 100%);
    mix-blend-mode: multiply;
  }
  #mapa-viewport {
    flex: 1 1 auto; position: relative; overflow: hidden; cursor: grab;
    background: #000;
  }
  #mapa-viewport.arrastrando { cursor: grabbing; }
  #mapa-contenido { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
  /* VGA437 es una fuente de bitmap de un solo peso -- "bold" sobre ella
     fuerza una negrita sintetica del navegador que emborrona el pixel
     nitido (confirmado visualmente, no una suposicion), asi que estos dos
     elementos (glifos del mapa y de la leyenda) se quedan en peso normal
     -- el resto de la interfaz (titulos, stats) sigue en negrita/CSS
     normal, no se ve afectado. */
  .celda-txt {
    position: absolute; display: flex; align-items: center; justify-content: center;
    font-weight: normal; font-family: inherit;
  }
  /* Sprites de fauna (2026-09-16, ver comentario junto a CATALOGO_GLIFOS.
     fauna) -- ancla inferior-centro (translate -50%,-100%) para que los
     "pies" queden en el borde inferior de la celda, igual que el ancla
     que ya usaban los glifos de texto por su propio centrado flex.
     pixelated conserva el pixel-art nitido al escalar en el navegador. */
  .criatura-img {
    position: absolute;
    transform: translate(-50%, -100%);
    image-rendering: pixelated;
    width: auto;
  }
  /* Sprites de construccion (2026-09-16, ver crearCeldaImgEstatica) --
     ancla inferior-centro dentro de la celda contenedora (.celda-txt,
     position:absolute -> establece el contexto para este hijo), mismo
     criterio visual que .criatura-img pero SIN transicion de movimiento:
     las construcciones no se desplazan. */
  .construccion-img {
    position: absolute;
    left: 50%; bottom: 0;
    transform: translateX(-50%);
    image-rendering: pixelated;
    width: auto;
  }
  /* Dentro de un cuadrante del mosaico 2x2 (celda compartida con otro
     elemento real) el propio flex del cuadrante ya centra -- se anula el
     posicionamiento absoluto para no salirse de su cuarto de celda. */
  .construccion-img-cuadrante {
    position: static;
    transform: none;
  }
  /* Mosaico 2x2 (subdivision puramente visual, ver itemsCelda en el
     script) -- misma celda de 100m2 del motor, hasta 4 elementos reales
     distintos repartidos en cuadrantes en vez de colapsados a uno solo. */
  .celda-cuadrantes {
    position: absolute; display: grid;
    grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
  }
  .cuadrante {
    display: flex; align-items: center; justify-content: center;
    font-family: inherit; font-weight: normal; overflow: hidden;
  }
  .btn-mapa {
    font-family: inherit;
    font-size: 11px;
    background: transparent;
    color: var(--ambar);
    border: 1px solid var(--ambar-tenue);
    border-radius: 2px;
    padding: 2px 8px;
    cursor: pointer;
    letter-spacing: 1px;
  }
  .btn-mapa:hover, .btn-mapa.activo { background: rgba(255,176,0,0.18); }
  .zoom-info { font-size: 11px; color: var(--ambar-tenue); }

  /* Leyenda -- desplegable anclado bajo el boton, dentro del propio
     recuadro del mapa (position:absolute sobre #term-mapa) para no
     empujar el layout de columnas ni tapar los paneles laterales. */
  #leyenda-panel {
    position: absolute;
    top: 30px; right: 8px;
    width: 280px;
    max-height: calc(100% - 40px);
    overflow-y: auto;
    background: rgba(5,3,0,0.95);
    border: 1px solid var(--ambar-tenue);
    border-radius: 3px;
    box-shadow: 0 0 16px rgba(0,0,0,0.6);
    padding: 8px 10px;
    font-size: 12px;
    z-index: 500;
    display: none;
  }
  #leyenda-panel.abierta { display: block; }
  #leyenda-panel h4 {
    margin: 10px 0 4px 0; font-size: 11px; letter-spacing: 1.5px;
    color: var(--ambar-fuerte); text-transform: uppercase;
    border-bottom: 1px solid var(--ambar-tenue); padding-bottom: 2px;
  }
  #leyenda-panel h4:first-child { margin-top: 0; }
  .leyenda-fila { display: flex; align-items: center; gap: 8px; padding: 1px 0; }
  .leyenda-glifo {
    display: inline-flex; align-items: center; justify-content: center;
    width: 16px; font-weight: normal; text-shadow: 0 0 4px currentColor;
  }
  .leyenda-nombre { color: #d8c8a0; }

  .kv { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 10px; margin-bottom: 6px;}
  .kv div.k { color: var(--ambar-tenue); }
  .kv div.v { color: var(--ambar-fuerte); text-align: right; }
  .cronica-linea { padding: 2px 0; border-bottom: 1px dashed rgba(255,176,0,0.15); }
  .cronica-linea:last-child { border-bottom: none; }
  .cmd-input {
    background: #000; border: 1px solid var(--ambar-tenue); color: var(--ambar);
    font-family: inherit; font-size: 13px; width: 100%; padding: 4px 6px;
    outline: none;
  }
  .parpadeo { animation: parp 1s steps(1) infinite; }
  @keyframes parp { 50% { opacity: 0; } }
  .placeholder { color: var(--ambar-tenue); font-style: italic; }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--ambar-tenue); }
  ::-webkit-scrollbar-track { background: #000; }
</style>
</head>
<body>
<div class="crt-overlay"></div>
<div class="layout">
  <div class="terminal" id="term-mapa">
    <div class="titulo">
      <span>MAPA://SUPERFICIE &mdash; <span id="titulo-mapa-info"></span></span>
      <div class="titulo-controles">
        <span class="zoom-info" id="zoom-info"></span>
        <button class="btn-mapa" id="btn-centrar" type="button">CENTRAR</button>
        <button class="btn-mapa" id="btn-leyenda" type="button">LEYENDA &#9662;</button>
      </div>
    </div>
    <div id="mapa-viewport">
      <div id="mapa-contenido"></div>
      <div id="leyenda-panel"></div>
    </div>
  </div>
  <div class="col-derecha">
    <div class="terminal">
      <div class="titulo">FICHA://ENTIDAD</div>
      <div class="cuerpo" id="ficha"><div class="placeholder">-- selecciona una entidad en el mapa --</div></div>
    </div>
    <div class="terminal">
      <div class="titulo">NARRADOR://CRONICA <span class="parpadeo">_</span></div>
      <div class="cuerpo" id="narrador"></div>
    </div>
    <div class="terminal">
      <div class="titulo">STATS://MUNDO</div>
      <div class="cuerpo" id="stats"></div>
    </div>
    <div class="terminal">
      <div class="titulo">EVENTOS://LOG (filtro)</div>
      <div class="cuerpo" id="eventos">
        <input class="cmd-input" placeholder="filtrar por especie/causa..." style="margin-bottom:6px;">
        <div class="placeholder">-- catalogo de eventos, pendiente de circulo siguiente --</div>
      </div>
    </div>
  </div>
</div>
<script src="datos.js"></script>
<script>
// PIVOTE A MAPA 100% ASCII (2026-09-16, decision de Diego): se retira el
// Codice Cartografico (presentacion/vista_web.py, ver
// docs/informe_codice_cartografico.md). El CATALOGO de mas abajo
// (CATALOGO_GLIFOS) es la UNICA fuente de verdad tanto para lo que se
// dibuja en el mapa como para la leyenda desplegable: anadir una especie o
// categoria nueva es una entrada aqui, nunca una tabla duplicada.
// CORREGIDO el mismo dia (ver CLAUDE.md, "Hibrido ASCII+sprite"): el
// parrafo original decia aqui que este prototipo dejaba de ser un hibrido
// ASCII+sprite y quedaba en "CERO imagenes en el mapa" -- afirmacion que
// el propio codigo desmintio unas horas despues, cuando se añadieron
// sprites reales de fauna y construcciones (mismo dia, ver CATALOGO_GLIFOS.
// fauna/construcciones mas abajo) y despues flora (arbol/arbusto). Diego
// confirmo el criterio real: base ASCII, sprite donde se encuentre arte
// adecuado, introducido gradualmente -- nunca "cero imagenes".
let DATA = window.__DATOS__ || null;
const CELDA = 32; // px base por celda, antes de aplicar zoom (subido de 26:
// a ese tamano el glifo mas grande posible seguia leyendose pequeno en un
// panel de 1400px con 40 celdas de ancho -- ver docs/informe_codice_cartografico.md
// nota al pie del 2026-09-16 sobre la auditoria de legibilidad).

// --- Catalogo canonico: glifo + color + nombre legible, agrupado por
// seccion para la leyenda. "categoria" (solo en flora) permite que varias
// especies compartan el mismo glifo (forma = funcion: arbol/arbusto/
// cobertura, reutilizando la misma distincion que ya usa config/flora.yaml
// via compite_espacio_fisico + huella_m2) diferenciandose solo por color.
//
// REDISEÑADO 2026-09-16 (feedback de Diego: "los iconos son demasiado
// pequeños"): el problema real, confirmado con una auditoria visual
// (renderizar los ~28 glifos a tamano fijo grande antes de tocar nada), no
// era el tamano en pixeles -- era que varios glifos usaban puntuacion
// (comillas, dos puntos, coma) para representar bioma/cobertura, y esos
// caracteres son intrinsecamente diminutos en CUALQUIER fuente por grande
// que se dibujen (una comilla nunca ocupa el cuerpo completo de su celda).
// Los glifos con masa visual real (letras de fauna, formas de flora/
// construccion) ya se leian perfectamente bien a cualquier tamano.
//
// Convencion adoptada (la misma que usan Dwarf Fortress/CDDA en las
// capturas de referencia de Diego, no inventada): el suelo llano ("nada
// que ver aqui") se representa SIEMPRE con el mismo punto '.', y el bioma
// se distingue por COLOR, no por forma -- el color se compara mejor que
// media docena de marcas de puntuacion casi identicas. Solo el relieve
// real (montana/pico) rompe esa regla a proposito: una elevacion real
// SI merece un simbolo con cuerpo (convencion estandar de todo roguelike).
// Cobertura de suelo pasa de ',' a '▪' (cuadrado pequeño solido, con masa
// real) -- sigue leyendose "mas discreta" que un arbusto/arbol por ser una
// forma simple, pero ya no es invisible. poza deja de compartir glifo con
// bosque (colision real de la version anterior, ambos usaban '"').
const CATALOGO_GLIFOS = {
  terreno: {
    titulo: 'Terreno',
    pradera:  { ch: '░', color: '#a3c95a', nombre: 'Pradera' },
    bosque:   { ch: '░', color: '#3f6b2c', nombre: 'Bosque (suelo)' },
    desierto: { ch: '░', color: '#d9b566', nombre: 'Desierto' },
    tundra:   { ch: '░', color: '#b8ccd6', nombre: 'Tundra' },
    montana:  { ch: '^', color: '#9a8264', nombre: 'Montaña' },
    pico:     { ch: '▲', color: '#cdbb8c', nombre: 'Pico (elevación alta)' },
  },
  agua: {
    titulo: 'Agua',
    lago: { ch: '≈', color: '#3d7fa8', nombre: 'Lago / agua permanente' },
    rio:  { ch: '~', color: '#5fc0e0', nombre: 'Río (corriente)' },
    poza: { ch: ':', color: '#6fa8c0', nombre: 'Poza / charco efímero' },
  },
  flora: {
    titulo: 'Flora',
    // (2026-09-16) pino usa '♠' en vez de '♣': silueta puntiaguda real de
    // conifera frente a la copa redondeada de un arbol de hoja ancha --
    // shape real, no una eleccion arbitraria (auditada contra la fuente
    // VGA437 antes de decidir, ambos glifos existen y renderizan nitidos).
    // img (2026-09-16, assets aportados por Diego -- ver
    // docs/historial_capa_visual.md, entrada del mismo dia): SOLO arbol y
    // arbusto (la unica "planta competidora" por celda, ver competidora en
    // itemsCelda) tienen sprite real por ahora. cobertura sigue en glifo de
    // textura tejida (TEXTURA_COBERTURA/tonoCelda) a proposito -- esa
    // categoria se dibuja mezclando varias especies solapadas en la misma
    // celda para leerse como una alfombra continua, y un sprite unico por
    // especie no tiene todavia un mecanismo de mezcla equivalente. Quedan 3
    // PNG ya procesados y sin usar en sprites_flora/ (hierba_silvestre,
    // flor_silvestre, helecho) a la espera de esa decision de diseño.
    // Mapeo icono->especie es una interpretacion razonada de nombres de
    // fichero genericos (arbustoMontañaTundra.jpg cubre montano Y artico
    // con el mismo arte, arbustoSeco.jpg->desertico,
    // arbustoPraderaBosque.jpg->espinoso) -- PROVISIONAL, sin confirmar.
    manzano:           { ch: '♣', color: '#7a9a3a', nombre: 'Manzano', categoria: 'árbol', img: 'sprites_flora/manzano.png' },
    roble:             { ch: '♣', color: '#2f5a2a', nombre: 'Roble', categoria: 'árbol', img: 'sprites_flora/roble.png' },
    pino:              { ch: '♠', color: '#1f4a4a', nombre: 'Pino', categoria: 'árbol', img: 'sprites_flora/pino.png' },
    cactus:            { ch: '*', color: '#4a8a5a', nombre: 'Cactus', categoria: 'arbusto', img: 'sprites_flora/cactus.png' },
    arbusto_espinoso:  { ch: '*', color: '#8a6a3a', nombre: 'Arbusto espinoso', categoria: 'arbusto', img: 'sprites_flora/arbusto_espinoso.png' },
    arbusto_desertico: { ch: '*', color: '#a68a4a', nombre: 'Arbusto desértico', categoria: 'arbusto', img: 'sprites_flora/arbusto_desertico.png' },
    arbusto_montano:   { ch: '*', color: '#6a8a4a', nombre: 'Arbusto montano', categoria: 'arbusto', img: 'sprites_flora/arbusto_montano_tundra.png' },
    arbusto_artico:    { ch: '*', color: '#8aa8a0', nombre: 'Arbusto ártico', categoria: 'arbusto', img: 'sprites_flora/arbusto_montano_tundra.png' },
    hierba_silvestre:  { ch: '▒', color: '#a3c95a', nombre: 'Hierba silvestre', categoria: 'cobertura' },
    liquen:            { ch: '▒', color: '#9aa870', nombre: 'Liquen', categoria: 'cobertura' },
    musgo:             { ch: '▒', color: '#4a6a4a', nombre: 'Musgo', categoria: 'cobertura' },
    flor_silvestre:    { ch: '▒', color: '#c97ab0', nombre: 'Flor silvestre', categoria: 'cobertura' },
    hierba_desertica:  { ch: '▒', color: '#c9b06a', nombre: 'Hierba desértica', categoria: 'cobertura' },
    hierba_artica:     { ch: '▒', color: '#c9d8d8', nombre: 'Hierba ártica', categoria: 'cobertura' },
    helecho:           { ch: '▒', color: '#3a7a4a', nombre: 'Helecho', categoria: 'cobertura' },
  },
  // (2026-09-16) Pictogramas reales en vez de letras -- Diego: "podriamos
  // buscar pictogramas para las criaturas". Emoji nativos del sistema/
  // navegador (CERO descarga, a diferencia de VGA437/Nerd Fonts): ya
  // vienen con la fuente de emoji del propio SO, verificados nitidos y
  // reconocibles a este tamaño antes de adoptarlos. Limitacion real y
  // aceptada: un emoji ignora `color` CSS -- siempre se ve a todo color
  // nativo, no se puede teñir de ambar. No es un choque de estilo (el
  // resto del mapa ya usa muchos colores por categoria, no solo ambar),
  // pero significa que `color` en esta seccion ya no pinta el glifo --
  // se conserva solo como referencia en la leyenda. Sin emoji real de
  // "gnomo": se uso 🧙 (figura humanoide con
  // gorro puntiagudo, la silueta mas cercana disponible, ver
  // docs/informe_codice_cartografico.md-style de honestidad: aproximacion
  // documentada, no un hallazgo perfecto). 🐿️ (ardilla) es una secuencia
  // de 2 codepoints (animal + selector de variacion) -- verificado que
  // renderiza como un solo glifo, no dos, en Chromium/fuente del sistema.
  // SEGUNDO PIVOTE DE FAUNA (2026-09-16, mismo dia): Diego pidio pictogramas
  // propios en vez de emoji nativos -- generados por IA, estilo pixel art
  // de cuerpo completo (no solo cabeza), colores naturales de cada especie
  // (nunca una paleta gris fija -- ver correccion real de Diego cuando
  // generalice por error el gris del lobo de referencia a todo el set).
  // Los .jpg originales de Diego traian un cuadriculado de "transparencia"
  // HORNEADO como pixeles opacos reales (JPG no soporta canal alfa) --
  // recortado por software con relleno por inundacion desde los bordes
  // (ver /tmp/quitar_fondo.py de la sesion, no versionado -- un recorte de
  // color global habria comido pelaje real: el gris claro del lobo, p.ej.,
  // es casi identico a uno de los dos tonos del cuadriculado). `img`
  // apunta al PNG ya procesado (fondo real transparente, recortado al
  // contenido); `ch`/`color` quedan como referencia de la leyenda y como
  // unico camino para necromasa, que se queda con el emoji 💀 (no se pidio
  // sprite propio para restos). Excepcion real y deliberada a "mapa 100%
  // glifos" -- CP437 no tiene pictogramas de animales (auditado) y los
  // emoji nativos no convencieron del todo a Diego.
  fauna: {
    titulo: 'Fauna',
    gnomo:         { ch: '🧙', color: '#f0e6c0', nombre: 'Gnomo', img: 'sprites_criaturas/gnomo.png' },
    lobo:          { ch: '🐺', color: '#e05a3a', nombre: 'Lobo', img: 'sprites_criaturas/lobo.png' },
    conejo:        { ch: '🐰', color: '#c9b590', nombre: 'Conejo', img: 'sprites_criaturas/conejo.png' },
    ardilla:       { ch: '🐿️', color: '#d98a2e', nombre: 'Ardilla', img: 'sprites_criaturas/ardilla.png' },
    caballo:       { ch: '🐴', color: '#c9a06a', nombre: 'Caballo', img: 'sprites_criaturas/caballo.png' },
    venado:        { ch: '🦌', color: '#a3703f', nombre: 'Venado', img: 'sprites_criaturas/venado.png' },
    cabra_montesa: { ch: '🐐', color: '#b8c0c4', nombre: 'Cabra montesa', img: 'sprites_criaturas/cabra.png' },
    zorro:         { ch: '🦊', color: '#c9622e', nombre: 'Zorro', img: 'sprites_criaturas/zorro.png' },
    necromasa:     { ch: '💀', color: '#7a7268', nombre: 'Restos (necromasa)' },
  },
  // `img` (2026-09-16, Diego subio 5 construcciones a `master` -- "quitales
  // el fondo y usalos"): mismo criterio que fauna, ch/color quedan como
  // referencia de leyenda. El fichero se llama `salon.png` (nombre corto
  // que Diego uso al generarlo) pero la clave real del motor es
  // `salon_comun` -- mapeo explicito aqui, no un rename de fichero.
  construcciones: {
    titulo: 'Construcciones',
    refugio:     { ch: '⌂', color: '#c98a4a', nombre: 'Refugio', img: 'sprites_construcciones/refugio.png' },
    almacen:     { ch: '▣', color: '#a98a5a', nombre: 'Almacén', img: 'sprites_construcciones/almacen.png' },
    salon_comun: { ch: '♦', color: '#e0b84a', nombre: 'Salón común', img: 'sprites_construcciones/salon.png' },
    cocina:      { ch: '♨', color: '#e0603a', nombre: 'Cocina', img: 'sprites_construcciones/cocina.png' },
    taller:      { ch: '⚒', color: '#9a9aa0', nombre: 'Taller', img: 'sprites_construcciones/taller.png' },
  },
  recursos: {
    titulo: 'Recursos en el suelo',
    piedra_suelta: { ch: '•', color: '#9a9a9a', nombre: 'Piedra suelta' },
    madera:        { ch: '/', color: '#8a6a3a', nombre: 'Madera (rama caída)' },
  },
};

function hashDet(x,y,sal) {
  let h = (x*374761393 + y*668265263 + sal*2654435761) >>> 0;
  h = (h ^ (h>>>13)) >>> 0; h = Math.imul(h, 1274126177) >>> 0; h = (h ^ (h>>>16)) >>> 0;
  return h / 4294967296;
}

// rgba con alfa variable a partir de un color hex -- usado para atenuar
// flora joven (Planta.etapa real, 0=brote..1=madura: un brote se ve mas
// tenue, no un color inventado) y para el desvanecido de agua por
// profundidad real (Celda.profundidad_agua/profundidad_charco).
function hexARgba(hex, alfa) {
  const n = parseInt(hex.slice(1), 16);
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return `rgba(${r},${g},${b},${alfa})`;
}

// TEXTURA "TEJIDA" (2026-09-16, tercer feedback de Diego comparando contra
// capturas reales de Dwarf Fortress: "necesitamos que quede lo mas vivo
// posible"). Diagnostico: DF nunca deja una celda de suelo sin tinta --
// imprime el MISMO puñado de glifos base en todas las celdas de un
// material, pero con variacion real de tono celda a celda, lo que se lee
// como superficie "tejida" en vez de un bloque de color CSS plano (lo que
// habiamos hecho en el circulo anterior). tonoCelda varia el tono +-rango
// de forma DETERMINISTA por celda (mismo hash de siempre -- nunca cambia
// de un frame a otro); glifoTextura elige entre 2-3 variantes de glifo
// por el mismo mecanismo. Ambos se usan solo en las capas de "suelo"
// (terreno desnudo, agua, cobertura) -- los landmarks reales (arbol,
// arbusto, fauna, construccion, recurso) se quedan con un color fijo y
// consistente a proposito, para que sigan destacando sobre el ruido de
// textura del suelo en vez de mezclarse con el.
function tonoCelda(hex, x, y, sal, rango, alfa = 1) {
  const t = (hashDet(x, y, sal) - 0.5) * 2 * rango;
  const n = parseInt(hex.slice(1), 16);
  const ajustar = (canal) => Math.max(0, Math.min(255, Math.round(canal * (1 + t))));
  const r = ajustar((n >> 16) & 255), g = ajustar((n >> 8) & 255), b = ajustar(n & 255);
  return `rgba(${r},${g},${b},${alfa})`;
}
function glifoTextura(pool, x, y, sal) {
  return pool[Math.floor(hashDet(x, y, sal) * pool.length) % pool.length];
}
// Pools de glifo base por bioma (montaña queda fuera: conserva su propio
// simbolo '^'/'▲' de relieve, ya establecido).
//
// CORREGIDO 2026-09-16 (Diego: "hay otros iconos quizas mejores?" --
// auditoria real contra la fuente VGA437 antes de decidir, no a ojo):
// '.'/','/'\'' tienen muy poca masa visual incluso con variacion de tono
// -- CP437 trae una familia de "sombreado" graduada por densidad
// (░ claro, ▒ medio, ▓ oscuro) pensada exactamente para esto en
// terminales DOS/roguelikes reales, confirmada nitida en la fuente real
// con una pagina de prueba aislada. ░ para todo el suelo desnudo (mucha
// mas presencia que un punto, sigue leyendose "de fondo" por su propio
// patron moteado interno) y ▒ para cobertura vegetal (un escalon mas
// denso que el suelo desnudo, jerarquia visual real: suelo < cobertura <
// arbusto/arbol solidos).
const TEXTURA_TERRENO = {
  pradera:  ['░'],
  bosque:   ['░'],
  desierto: ['░'],
  tundra:   ['░'],
};
const TEXTURA_COBERTURA = ['▒'];

let construccionesPorCelda = {};
function recalcularDerivados() {
  // Construcciones (DATA.construcciones): una celda podria en teoria tener
  // mas de una (refugio+almacen compartiendo espacio, cupo real del motor)
  // -- guardamos una LISTA por celda, mismo criterio que ya corrigio el bug
  // de plantas_por_celda (2026-08-31).
  construccionesPorCelda = {};
  for (const con of (DATA.construcciones || [])) {
    const clave = con.x + ',' + con.y;
    (construccionesPorCelda[clave] = construccionesPorCelda[clave] || []).push(con);
  }
}

// Orden de huella real (config/materiales.yaml: huella_m2_<tipo>, valores
// reales copiados aqui solo para desempatar que sello dibujar si dos
// construcciones comparten celda -- almacen(40) > salon_comun(35) ==
// cocina(35) > refugio(15) == taller(15)).
const ORDEN_HUELLA_CONSTRUCCION = { almacen: 40, salon_comun: 35, cocina: 35, refugio: 15, taller: 15 };

function infoCriatura(ent) {
  const g = CATALOGO_GLIFOS.fauna[ent.tipo] || { ch: '?', color: '#ffffff', nombre: ent.tipo };
  return { ch: g.ch, color: g.color, img: g.img || null };
}

// REDISEÑADO 2026-09-16, dos veces seguidas. Primero (feedback: "demasiado
// espaciado, no se detecta que es un mapa"): un glifo suelto por celda deja
// huecos de negro puro entre celdas sin contenido -- se añadió COLOR DE
// FONDO a cada celda (terreno/agua) y se vacio el glifo del suelo desnudo,
// confiando solo en el fondo CSS. Segunda vuelta (feedback comparando
// contra capturas reales de Dwarf Fortress: "necesitamos que quede lo mas
// vivo posible") corrigio el resultado de la primera -- un bloque de color
// CSS plano no es como lee DF su propio suelo: alli CADA celda imprime un
// glifo real (el mismo puñado de caracteres repetido, pero con variacion
// de TONO por celda), lo que se lee como textura "tejida" en vez de un
// mosaico de rectangulos. La funcion que calculaba esto (contenidoCelda,
// {ch,color,fondo} con un solo glifo) se sustituyo despues por itemsCelda
// ({items:[...],fondo}, ver mas abajo) al añadir el mosaico 2x2 -- ch ya
// no queda vacio en ninguna de las dos, ver TEXTURA_TERRENO/
// TEXTURA_COBERTURA/tonoCelda mas arriba para el mecanismo de variante+tono
// determinista por celda.
function fondoBioma(c) {
  if (c.tiene_agua) {
    const g = CATALOGO_GLIFOS.agua[c.tipo_agua] || CATALOGO_GLIFOS.agua.lago;
    return g.color;
  }
  const g = CATALOGO_GLIFOS.terreno[c.bioma];
  return g ? g.color : '#333333';
}

// MOSAICO 2x2 (2026-09-16, Diego: "y si creamos mas celdas... eso nos
// permitiria ser mas fieles a mostrar los recursos de una celda"). Cada
// celda del motor sigue siendo la misma (100 m², config/mundo.yaml:
// metros_por_celda=10, sin tocar nada de nucleo/) -- esto es subdivision
// PURAMENTE VISUAL: en vez de colapsar a un unico glifo el contenido de
// una celda, itemsCelda() junta TODOS los elementos reales y distintos
// que el motor ya expone (construcciones, planta competidora + coberturas,
// recursos en el suelo) en una lista, y renderMapa() los reparte en un
// mosaico de hasta 4 cuadrantes en vez de descartar todo menos el primero.
// El orden de entrada a la lista es determinista (construcciones por
// huella, luego planta, luego recursos) -- nunca cambia de un frame a otro
// para el mismo estado. Agua queda FUERA de este mecanismo a proposito:
// una celda de agua no tiene una "mitad seca" que el motor modele, mezclar
// agua con otro icono en el mismo mosaico inventaria una particion que no
// existe en los datos.
function itemsCelda(c) {
  const fondoBase = fondoBioma(c);

  if (c.tiene_agua) {
    const g = CATALOGO_GLIFOS.agua[c.tipo_agua] || CATALOGO_GLIFOS.agua.lago;
    // Profundidad real (agua permanente o charco efimero segun el tipo) ->
    // mas oscuro/opaco cuanto mas profundo, dato real del motor, no un
    // degradado inventado.
    const prof = c.tipo_agua === 'poza' ? c.profundidad_charco : c.profundidad_agua;
    const alfaFondo = Math.max(0.45, Math.min(0.85, 0.5 + (prof || 0) * 0.35));
    const item = c.tipo_agua === 'poza'
      ? { ch: ':', color: tonoCelda(g.color, c.x, c.y, 61, 0.2) }
      : { ch: g.ch, color: tonoCelda(g.color, c.x, c.y, 63, 0.2) };
    return { items: [item], fondo: hexARgba(g.color, alfaFondo) };
  }

  const items = [];

  const construcciones = construccionesPorCelda[c.x + ',' + c.y] || [];
  for (const con of [...construcciones].sort((a, b) =>
      (ORDEN_HUELLA_CONSTRUCCION[b.tipo] || 1) - (ORDEN_HUELLA_CONSTRUCCION[a.tipo] || 1))) {
    const g = CATALOGO_GLIFOS.construcciones[con.tipo] || { ch: '#', color: '#8a6a3a' };
    items.push({ ch: g.ch, color: g.color, img: g.img || null, tipoConstruccion: con.tipo });
  }

  // Segundo plano combinado (mismo mecanismo que ya existia, ahora dentro
  // de itemsCelda): si un arbol/arbusto comparte celda con cobertura real,
  // la cobertura tiñe el fondo en vez de perderse.
  let fondoColor = fondoBase, fondoAlfa = items.length > 0 ? 0.3 : 0.22;
  if (c.plantas && c.plantas.length > 0) {
    const competidora = c.plantas.find(p => {
      const g = CATALOGO_GLIFOS.flora[p.especie];
      return g && g.categoria !== 'cobertura';
    });
    const coberturas = c.plantas.filter(p => {
      const g = CATALOGO_GLIFOS.flora[p.especie];
      return g && g.categoria === 'cobertura';
    });
    if (competidora) {
      const g = CATALOGO_GLIFOS.flora[competidora.especie];
      // Etapa de crecimiento real (Planta.etapa 0..1) -> opacidad: un
      // brote se ve tenue, una planta madura llena de color. Mismo alfa
      // reutilizado como opacity del <img> cuando la especie tiene sprite
      // (ver crearCeldaImgEstatica) -- no hay arte diferenciado por etapa,
      // pero la opacidad ya transmite la misma idea sin inventar variantes.
      const alfa = 0.5 + Math.min(1, competidora.etapa ?? 1) * 0.5;
      items.push({ ch: g.ch, color: hexARgba(g.color, alfa), img: g.img || null, especieFlora: competidora.especie, alfaSprite: alfa });
      if (coberturas.length > 0) {
        fondoColor = CATALOGO_GLIFOS.flora[coberturas[0].especie].color;
        fondoAlfa = 0.4;
      }
    } else {
      // Sin competidora: cada especie de cobertura real (normalmente una,
      // pero el motor permite mas de una) entra como su propio item --
      // antes solo se representaba la primera, el resto se descartaba.
      coberturas.forEach((cob, i) => {
        const g = CATALOGO_GLIFOS.flora[cob.especie];
        if (!g) return;
        const alfa = 0.55 + Math.min(1, cob.etapa ?? 1) * 0.45;
        const ch = glifoTextura(TEXTURA_COBERTURA, c.x, c.y, 67 + i);
        items.push({ ch, color: tonoCelda(g.color, c.x, c.y, 71 + i, 0.3, alfa) });
      });
    }
  }

  const recursos = c.recursos || {};
  if ((recursos.piedra_suelta || 0) > 0) {
    const g = CATALOGO_GLIFOS.recursos.piedra_suelta;
    items.push({ ch: g.ch, color: g.color });
  }
  if ((recursos.madera || 0) > 0) {
    const g = CATALOGO_GLIFOS.recursos.madera;
    items.push({ ch: g.ch, color: g.color });
  }

  if (items.length === 0) {
    // Terreno base desnudo: SIEMPRE imprime un glifo (nunca vacio) --
    // variante de textura + tono elegidos por hash determinista de la
    // celda (ver TEXTURA_TERRENO/tonoCelda arriba). Excepcion real:
    // montaña distingue pico de ladera por elevacion real, convencion
    // estandar de todo roguelike.
    if (c.bioma === 'montana' && c.elevacion > 0.72) {
      const g = CATALOGO_GLIFOS.terreno.pico;
      items.push({ ch: g.ch, color: tonoCelda(g.color, c.x, c.y, 41, 0.2) });
    } else if (c.bioma === 'montana') {
      const g = CATALOGO_GLIFOS.terreno.montana;
      items.push({ ch: g.ch, color: tonoCelda(g.color, c.x, c.y, 43, 0.2) });
    } else {
      const pool = TEXTURA_TERRENO[c.bioma] || ['░'];
      const ch = glifoTextura(pool, c.x, c.y, 47);
      items.push({ ch, color: tonoCelda(fondoBase, c.x, c.y, 53, 0.35) });
    }
  }

  return { items: items.slice(0, 4), fondo: hexARgba(fondoColor, fondoAlfa) };
}

function celdaAPantalla(wx, wy, tam) {
  return { cx: wx * tam, cy: wy * tam };
}

// Dos capas dentro de #mapa-contenido: la ESTATICA (suelo -- terreno,
// agua, flora, construcciones, recursos) se destruye y se recrea entera en
// cada render; la de CRIATURAS es persistente entre renders (un elemento
// por id, solo se actualiza left/top) para poder animar su desplazamiento
// con una transicion CSS en vez de teletransportarlas -- mismo mecanismo
// que ya tenia el prototipo hibrido, ahora aplicado a texto en vez de
// imagenes.
let capaEstatica = null, capaCriaturas = null;
function asegurarCapas() {
  const cont = document.getElementById('mapa-contenido');
  if (!capaEstatica) {
    capaEstatica = document.createElement('div');
    capaEstatica.style.position = 'absolute';
    capaEstatica.style.top = '0'; capaEstatica.style.left = '0';
    cont.appendChild(capaEstatica);
  }
  if (!capaCriaturas) {
    capaCriaturas = document.createElement('div');
    capaCriaturas.style.position = 'absolute';
    capaCriaturas.style.top = '0'; capaCriaturas.style.left = '0';
    cont.appendChild(capaCriaturas);
  }
  return cont;
}

// Escala generica por raiz N-esima de una razon contra una referencia
// propia -- MISMO metodo de compresion para fauna y construcciones (evita
// que un rango real amplio se dispare de forma absurda en pantalla), pero
// SIN forzar que compartan la misma unidad, el mismo punto de anclaje NI
// el mismo exponente: metros (altura real de un individuo) y kg (masa
// minima de material de un edificio) no son la misma magnitud fisica y
// cruzarlas como si lo fueran fue precisamente el bug de un circulo
// anterior (ver comentario de tamanoSpriteConstruccion mas abajo).
// exponente=0.5 (raiz cuadrada) por defecto -- el que ya usaba fauna.
function escalarPorRaiz(valor, valorReferencia, pxReferencia, minPx, maxPx, exponente = 0.5) {
  const escala = Math.pow(Math.max(0.0001, valor) / valorReferencia, exponente);
  return Math.max(minPx, Math.min(maxPx, pxReferencia * escala));
}

// RECALIBRADO 2026-09-16 (Diego, tercera vuelta sobre este mismo
// mecanismo): "tampoco hagas gigantes las construcciones, igual lo que
// hay que hacer es las criaturas mas pequeñas, porque al final tambien
// estan los arboles y flora" -- la flora (arbol/arbusto/cobertura) sigue
// siendo un unico glifo confinado a su celda (CELDA=32px, nunca
// reescalado), asi que criaturas/construcciones demasiado grandes frente
// a ese ancla rompen la coherencia visual del mapa completo, no solo la
// proporcion entre ellas dos. Referencia de gnomo bajada de CELDA*1.4 a
// CELDA*1.0 (una persona ~del ancho de una celda, no 1.4x) y el tope de
// fauna de CELDA*2.2 a CELDA*1.5 (un caballo ya no supera 1.5 celdas).
const ALTURA_REFERENCIA_M = 0.9; // ~altura media de gnomo (rango 0.9-1.2m)
const BASE_SPRITE_A_REFERENCIA = CELDA * 1.0;
const ALTURA_SPRITE_MIN = CELDA * 0.5;
const ALTURA_SPRITE_MAX = CELDA * 1.5;

// Tamaño de sprite de construccion -- REESCRITO 2026-09-16, tres veces en
// el mismo circulo. 1er intento: huella_m2 (area) cruzada con la
// referencia de metros de fauna -- Diego: "ese gnomo es enorme en
// comparacion a la construccion" (un refugio salia mas pequeño en
// pantalla que una persona). 2o intento: huella_m2 ya cruzada
// correctamente, pero seguia siendo la metrica EQUIVOCADA para decidir
// cual es "el mas grande" -- Diego: "el mas grande deberia ser el salon
// comun", y por huella_m2 NO lo es (almacen=40 > salon_comun=35).
// Investigado contra el propio config antes de tocar nada mas:
// huella_m2_salon_comun se bajo de 45 a 35 el 2026-09-09 por una razon
// puramente aritmetica (que cupiera junto al almacen dentro de
// capacidad_construccion_celda_m2=80), NO porque el edificio sea mas
// pequeño -- el comentario original de salon_comun ya decia
// explicitamente "Algo mas grande que el almacen (masa)", y
// masa_minima_salon_comun (70) SI es mayor que masa_minima_almacen (60).
// La masa de material -- no la huella en el suelo -- es el eje que
// realmente codifica la jerarquia de importancia constructiva que Diego
// ya habia fijado en su propio config. huella_m2 sigue siendo la
// metrica CORRECTA para ORDEN_HUELLA_CONSTRUCCION (desempatar que sello
// dibujar cuando 2 construcciones compiten por la misma celda -- ese
// mecanismo es literalmente sobre area de suelo), asi que se queda
// intacta; el tamaño VISUAL usa una tabla separada.
//
// 3er intento (este): con masa arreglando el orden, el resultado
// (refugio 81px, salon_comun 175px sin zoom) volvia a ser "gigante" --
// Diego lo señalo de nuevo, pidiendo ademas reducir fauna (ver arriba).
// Cambio de exponente de 0.5 (raiz cuadrada) a 1/3 (raiz CUBICA) para
// las construcciones, no un ajuste arbitrario de constantes: masa ~
// volumen ~ lado³ es la relacion fisicamente correcta entre una MASA
// (kg) y un tamaño LINEAL, a diferencia de huella_m2 (area, donde raiz
// cuadrada si es lo correcto) -- de paso, al ser un exponente menor,
// comprime mas el rango real (70/15=4.67x en masa queda en 1.67x en
// pantalla, antes 2.16x con raiz cuadrada), exactamente lo que Diego
// pedia sin inventar un factor de ajuste sin justificar.
const MASA_MINIMA_CONSTRUCCION = { salon_comun: 70, almacen: 60, cocina: 50, taller: 50, refugio: 15 };
const MASA_REFERENCIA_KG = 15; // masa_minima_refugio
// Referencia propia (no cruzada con metros): el edificio mas pequeño real
// (refugio) se ancla apenas por encima del sprite de la criatura mas
// grande posible (caballo, tope ALTURA_SPRITE_MAX) -- un edificio, por
// modesto que sea, nunca deberia caber "dentro" de una persona, pero
// tampoco desbordar varias celdas de flora vecinas.
const SPRITE_CONSTRUCCION_REFERENCIA = ALTURA_SPRITE_MAX * 1.1;
const SPRITE_CONSTRUCCION_MIN = CELDA * 1.0;
const SPRITE_CONSTRUCCION_MAX = CELDA * 3.0;
function tamanoSpriteConstruccion(tipo) {
  const masa = MASA_MINIMA_CONSTRUCCION[tipo] || MASA_REFERENCIA_KG;
  return escalarPorRaiz(masa, MASA_REFERENCIA_KG, SPRITE_CONSTRUCCION_REFERENCIA, SPRITE_CONSTRUCCION_MIN, SPRITE_CONSTRUCCION_MAX, 1 / 3);
}

// Tamaño de sprite de flora (arbol/arbusto, 2026-09-16) -- huella_m2 real
// de config/flora.yaml (misma fuente que ya usa el motor para el cupo de
// espacio compartido por celda, no un numero inventado para el visor).
// exponente=0.5 (raiz cuadrada), no 1/3 como construccion: huella_m2 es
// AREA, no masa/volumen -- mismo razonamiento fisico que ya distingue
// ambos casos en el comentario de escalarPorRaiz mas arriba.
// Rango MIN/MAX PROVISIONAL, sin calibrar contra captura real: pensado
// para quedar por encima de la fauna mas grande (caballo, CELDA*1.5) pero
// por debajo del techo de construccion (CELDA*3.0) -- un arbol maduro
// deberia leerse mas prominente que un animal, nunca que un edificio.
const HUELLA_FLORA_M2 = {
  manzano: 4.0, roble: 5.0, pino: 4.5, cactus: 1.5,
  arbusto_espinoso: 2.0, arbusto_desertico: 1.8, arbusto_montano: 2.2, arbusto_artico: 1.0,
};
const HUELLA_REFERENCIA_FLORA_M2 = 1.0; // arbusto_artico, la especie con sprite mas pequeña
const SPRITE_FLORA_REFERENCIA = CELDA * 1.0;
const SPRITE_FLORA_MIN = CELDA * 0.9;
const SPRITE_FLORA_MAX = CELDA * 2.6;
function tamanoSpriteFlora(especie) {
  const huella = HUELLA_FLORA_M2[especie] || HUELLA_REFERENCIA_FLORA_M2;
  return escalarPorRaiz(huella, HUELLA_REFERENCIA_FLORA_M2, SPRITE_FLORA_REFERENCIA, SPRITE_FLORA_MIN, SPRITE_FLORA_MAX, 0.5);
}

function crearCeldaTxt(ch, color, cx, cy, fondo) {
  const el = document.createElement('div');
  el.className = 'celda-txt';
  el.textContent = ch;
  el.style.width = CELDA + 'px'; el.style.height = CELDA + 'px';
  el.style.fontSize = Math.round(CELDA * 0.8) + 'px';
  el.style.color = color;
  if (fondo) el.style.backgroundColor = fondo;
  el.style.left = cx + 'px'; el.style.top = cy + 'px';
  return el;
}

// Construcciones con sprite real (2026-09-16, mismo criterio ya aplicado a
// fauna) -- a diferencia de las criaturas (capa persistente, animada), las
// construcciones viven en la capa ESTATICA: se recrean enteras en cada
// renderMapa() igual que cualquier otro elemento del suelo, no necesitan
// transicion de movimiento propia. El contenedor conserva el color de
// fondo de la celda (rastro de terreno bajo el edificio, mismo `fondo` que
// ya calculaba itemsCelda); el <img> se ancla abajo-centro dentro de el,
// igual que .criatura-img, escalado por huella_m2 real
// (tamanoSpriteConstruccion) en vez de un tamaño fijo.
function crearCeldaImgEstatica(src, cx, cy, fondo, tamano, opacidad) {
  const cont = document.createElement('div');
  cont.className = 'celda-txt';
  cont.style.width = CELDA + 'px'; cont.style.height = CELDA + 'px';
  cont.style.left = cx + 'px'; cont.style.top = cy + 'px';
  if (fondo) cont.style.backgroundColor = fondo;
  const img = document.createElement('img');
  // .construccion-img (ancla inferior-centro, pixelated) se reutiliza tal
  // cual para flora (2026-09-16) -- mismo contrato visual, "raices en el
  // suelo de la celda", no hacia falta una clase CSS propia.
  img.className = 'construccion-img';
  img.src = src;
  img.style.height = tamano + 'px';
  if (opacidad != null) img.style.opacity = String(opacidad);
  cont.appendChild(img);
  return cont;
}

// Mosaico 2x2 -- solo se usa cuando itemsCelda() devuelve 2 o mas items
// reales (ver su comentario mas arriba); con 0 o 1 item, crearCeldaTxt
// sigue dibujando un glifo a tamaño completo, la representacion mas
// legible para el caso mas comun (suelo desnudo, un unico landmark).
function crearCeldaCuadrantes(items, cx, cy, fondo) {
  const cont = document.createElement('div');
  cont.className = 'celda-cuadrantes';
  cont.style.width = CELDA + 'px'; cont.style.height = CELDA + 'px';
  cont.style.left = cx + 'px'; cont.style.top = cy + 'px';
  if (fondo) cont.style.backgroundColor = fondo;
  const fontSize = Math.round(CELDA * 0.42);
  for (let i = 0; i < 4; i++) {
    const cuad = document.createElement('div');
    cuad.className = 'cuadrante';
    const item = items[i];
    if (item && item.img) {
      // Construccion O flora (arbol/arbusto, 2026-09-16) compartiendo
      // celda con otro elemento real (recurso, planta) -- caso raro pero
      // posible dentro del presupuesto de huella_m2 del motor. Generico a
      // proposito (solo mira item.img, no el tipo): el sprite se reduce al
      // tamaño del propio cuadrante en vez de al de celda completa
      // (tamanoSpriteConstruccion/tamanoSpriteFlora asumen celda completa),
      // para no desbordar sobre los demas.
      const img = document.createElement('img');
      img.className = 'construccion-img construccion-img-cuadrante';
      img.src = item.img;
      img.style.height = Math.round(CELDA * 0.42) + 'px';
      if (item.alfaSprite != null) img.style.opacity = String(item.alfaSprite);
      cuad.appendChild(img);
    } else if (item) {
      cuad.textContent = item.ch;
      cuad.style.color = item.color;
      cuad.style.fontSize = fontSize + 'px';
    }
    cont.appendChild(cuad);
  }
  return cont;
}

function renderMapa() {
  const cont = asegurarCapas();
  capaEstatica.innerHTML = '';
  cont.style.width = (DATA.ancho * CELDA) + 'px';
  cont.style.height = (DATA.alto * CELDA) + 'px';
  for (let y = 0; y < DATA.alto; y++) {
    for (let x = 0; x < DATA.ancho; x++) {
      const c = DATA.celdas[y][x];
      const { cx, cy } = celdaAPantalla(x, y, CELDA);
      const info = itemsCelda(c);
      // z-index bajo (0..alto) para el fondo/suelo -- por debajo de CUALQUIER
      // glifo de la capa de criaturas (que sigue arrancando en 1000+y), asi
      // una criatura de pie sobre una celda de fondo tintado nunca queda
      // tapada por ella.
      //
      // CORREGIDO 2026-09-16 (Diego, tras ver el almacen: "las criaturas o
      // construcciones deben quedar por encima de todo, que no se solape
      // ningun color o simbolo"). Bug real confirmado con un screenshot
      // antes de tocar nada: un sprite de construccion es mas ANCHO que
      // una celda (el almacen, p.ej., desborda ~12px a cada lado a esta
      // escala) y se pinta centrado sobre su propia celda -- con el mismo
      // z-index que el resto del suelo (=y), la celda VECINA de la derecha
      // se inserta despues en el DOM en el mismo nivel de apilamiento y
      // por tanto tapa el borde desbordado del tejado (confirmado con una
      // captura: corte recto justo en el limite de celda). Los glifos de
      // texto normales nunca desbordan su propia celda, asi que a ellos
      // nunca les afectaba -- solo a los sprites de imagen, que son mas
      // grandes que la celda a proposito (ver tamanoSpriteConstruccion).
      // Fix: las construcciones van a su PROPIO nivel (500+y) -- por
      // encima de TODO el suelo/flora/recursos (max real ~grid_alto,
      // muy por debajo de 500) pero por debajo de las criaturas (1000+y),
      // que deben seguir tapando un edificio si una camina delante.
      // Limite conocido y no resuelto aqui (fuera de alcance de este
      // circulo, mismo mecanismo de desempate por orden de insercion que
      // ya existia): dos construcciones o dos criaturas ADYACENTES en la
      // misma fila podrian seguir solapandose entre si por el mismo
      // motivo -- no observado en juego libre, no se resuelve sin abrir
      // un mecanismo de profundidad real por eje Y+X que no se pidio.
      // esFloraUnica (2026-09-16, mismo criterio que construccion): un
      // arbol/arbusto con sprite (ver especieFlora en itemsCelda) usa su
      // propio nivel de z-index (400+y) -- por debajo de construccion
      // (500+y, que puede compartir presupuesto de huella_m2 con flora y
      // deberia tapar un arbol si coinciden) pero por encima del suelo
      // (0+y), por la misma razon de desborde de sprite entre celdas
      // vecinas ya documentada arriba para construccion.
      const unico = info.items[0] || {};
      const esConstruccionUnica = !!unico.tipoConstruccion;
      const esFloraUnica = !esConstruccionUnica && !!unico.img;
      let el;
      if (info.items.length > 1) {
        el = crearCeldaCuadrantes(info.items, cx, cy, info.fondo);
      } else if (esConstruccionUnica) {
        el = crearCeldaImgEstatica(unico.img, cx, cy, info.fondo, tamanoSpriteConstruccion(unico.tipoConstruccion));
      } else if (esFloraUnica) {
        el = crearCeldaImgEstatica(unico.img, cx, cy, info.fondo, tamanoSpriteFlora(unico.especieFlora), unico.alfaSprite);
      } else {
        el = crearCeldaTxt(unico.ch || '', unico.color || '#000', cx, cy, info.fondo);
      }
      el.style.zIndex = String((esConstruccionUnica ? 500 : esFloraUnica ? 400 : 0) + y);
      capaEstatica.appendChild(el);
    }
  }
  document.getElementById('titulo-mapa-info').textContent =
    `TICK ${DATA.tick} · DIA ${DATA.dia} · ${DATA.estacion.toUpperCase()} · ${DATA.clima.toUpperCase()}`;
}

// CORREGIDO 2026-09-16 (Diego: "caballos mas pequeños que zorros, cabras
// del tamaño de conejos, haz que tenga sentido eso"). El bug real: una
// altura de sprite FIJA para todas las especies solo reflejaba cuanto
// margen vacio dejaba el recorte de cada PNG generado, no el tamaño real
// del animal. Corregido igual que ya se documento para el sistema
// retirado (escalaPorAltura del prototipo hibrido pre-ASCII): escala por
// DimensionesFisicas.altura real del INDIVIDUO (dimensiones.altura_m, ya
// expuesta en el DTO) -- dato real del motor, no una tabla inventada.
// Raiz cuadrada en vez de lineal: el rango real de config/poblacion.yaml
// va de 0.15m (ardilla) a 1.8m (caballo), mas de 10x -- un caballo 10
// veces mas alto que una ardilla en pantalla seria absurdo a esta escala
// de celda, pero el ORDEN relativo (mayor altura real = mayor sprite) se
// conserva siempre, a diferencia del bug anterior donde no se conservaba
// en absoluto. Ancho en 'auto': el navegador preserva la proporcion real
// de cada PNG (todas distintas -- un conejo sentado es alto y estrecho,
// un zorro de perfil es ancho y bajo).
// ALTURA_REFERENCIA_M / BASE_SPRITE_A_REFERENCIA / ALTURA_SPRITE_MIN/MAX /
// escalarPorRaiz ya definidos mas arriba (ver su comentario -- el mismo
// METODO de compresion se reutiliza para tamanoSpriteConstruccion, pero
// cada una con su propia unidad y referencia, nunca cruzadas entre si).
function alturaSpriteCriatura(ent) {
  const alturaM = (ent.dimensiones && ent.dimensiones.altura_m) || ALTURA_REFERENCIA_M;
  return escalarPorRaiz(alturaM, ALTURA_REFERENCIA_M, BASE_SPRITE_A_REFERENCIA, ALTURA_SPRITE_MIN, ALTURA_SPRITE_MAX);
}

function crearCeldaImg(src, cx, cy, altura) {
  const el = document.createElement('img');
  el.className = 'criatura-img';
  el.src = src;
  el.style.height = altura + 'px';
  el.style.left = (cx + CELDA / 2) + 'px';
  el.style.top = (cy + CELDA) + 'px';
  return el;
}

let elementosCriatura = {};
function renderCriaturas() {
  asegurarCapas();
  const vistos = new Set();
  for (const ent of DATA.entidades) {
    const idStr = String(ent.id);
    vistos.add(idStr);
    const info = infoCriatura(ent);
    const { cx, cy } = celdaAPantalla(ent.x, ent.y, CELDA);
    let el = elementosCriatura[idStr];
    const esImg = !!info.img;
    // Si el tipo de elemento cambia (no deberia pasar en juego normal,
    // el catalogo es estatico, pero es una red de seguridad barata) se
    // recrea en vez de intentar mutar un <img> en un <div> de texto.
    if (el && !!el.dataset.esImg !== esImg) { el.remove(); el = null; }
    if (!el) {
      el = esImg ? crearCeldaImg(info.img, cx, cy, alturaSpriteCriatura(ent)) : crearCeldaTxt(info.ch, info.color, cx, cy);
      el.dataset.esImg = esImg ? '1' : '';
      el.style.transition = esImg ? 'left 0.9s linear, top 0.9s linear' : 'left 0.9s linear, top 0.9s linear';
      capaCriaturas.appendChild(el);
      elementosCriatura[idStr] = el;
    } else if (esImg) {
      if (!el.src.endsWith(info.img)) el.src = info.img;
      el.style.height = alturaSpriteCriatura(ent) + 'px';
      el.style.left = (cx + CELDA / 2) + 'px';
      el.style.top = (cy + CELDA) + 'px';
    } else {
      el.textContent = info.ch;
      el.style.color = info.color;
      el.style.left = cx + 'px';
      el.style.top = cy + 'px';
    }
    el.style.zIndex = String(1000 + ent.y);
    el.dataset.entId = idStr;
  }
  // Entidades que ya no existen (murieron, o salieron de la zona
  // exportada) -- se retira su elemento, no se deja huerfano en el DOM.
  for (const id of Object.keys(elementosCriatura)) {
    if (!vistos.has(id)) {
      elementosCriatura[id].remove();
      delete elementosCriatura[id];
    }
  }
}

// --- zoom centrado en el cursor + pan por arrastre ---
let zoom = 1, panX = -CELDA*7, panY = -CELDA*3;
const viewport = document.getElementById('mapa-viewport');
const contenido = document.getElementById('mapa-contenido');
function aplicarTransform() {
  contenido.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
  document.getElementById('zoom-info').textContent = `ZOOM ${zoom.toFixed(2)}x`;
}
viewport.addEventListener('wheel', (ev) => {
  ev.preventDefault();
  const rect = viewport.getBoundingClientRect();
  const mx = ev.clientX - rect.left, my = ev.clientY - rect.top;
  const factor = ev.deltaY < 0 ? 1.12 : 1/1.12;
  const nuevoZoom = Math.min(6, Math.max(0.35, zoom * factor));
  // Mantener el mismo punto de MUNDO bajo el cursor tras cambiar el zoom
  // (sin esto, el mapa "deriva" al hacer zoom si ya se habia desplazado).
  const contentX = (mx - panX) / zoom;
  const contentY = (my - panY) / zoom;
  panX = mx - contentX * nuevoZoom;
  panY = my - contentY * nuevoZoom;
  zoom = nuevoZoom;
  aplicarTransform();
}, { passive: false });
let arrastrando = false, ax=0, ay=0;
viewport.addEventListener('mousedown', (ev) => { arrastrando = true; ax=ev.clientX; ay=ev.clientY; viewport.classList.add('arrastrando'); });
window.addEventListener('mouseup', () => { arrastrando = false; viewport.classList.remove('arrastrando'); });
window.addEventListener('mousemove', (ev) => {
  if (!arrastrando) return;
  panX += (ev.clientX - ax); panY += (ev.clientY - ay);
  ax = ev.clientX; ay = ev.clientY;
  aplicarTransform();
});
document.getElementById('btn-centrar').addEventListener('click', () => {
  if (!DATA) return;
  const rect = viewport.getBoundingClientRect();
  zoom = 1;
  panX = rect.width / 2 - (DATA.ancho * CELDA) / 2;
  panY = rect.height / 2 - (DATA.alto * CELDA) / 2;
  aplicarTransform();
});

// --- leyenda desplegable: una sola fuente de verdad (CATALOGO_GLIFOS) ---
function construirLeyenda() {
  const panel = document.getElementById('leyenda-panel');
  let html = '';
  for (const clave of ['terreno', 'agua', 'flora', 'fauna', 'construcciones', 'recursos']) {
    const seccion = CATALOGO_GLIFOS[clave];
    html += `<h4>${seccion.titulo}</h4>`;
    for (const k in seccion) {
      if (k === 'titulo') continue;
      const it = seccion[k];
      html += `<div class="leyenda-fila"><span class="leyenda-glifo" style="color:${it.color}">${it.ch}</span><span class="leyenda-nombre">${it.nombre}</span></div>`;
    }
  }
  panel.innerHTML = html;
}
const btnLeyenda = document.getElementById('btn-leyenda');
const panelLeyenda = document.getElementById('leyenda-panel');
btnLeyenda.addEventListener('click', (ev) => {
  ev.stopPropagation();
  panelLeyenda.classList.toggle('abierta');
  btnLeyenda.classList.toggle('activo', panelLeyenda.classList.contains('abierta'));
});
document.addEventListener('click', (ev) => {
  if (panelLeyenda.classList.contains('abierta') && !panelLeyenda.contains(ev.target) && ev.target !== btnLeyenda) {
    panelLeyenda.classList.remove('abierta');
    btnLeyenda.classList.remove('activo');
  }
});

function mostrarFicha(ent) {
  const cont = document.getElementById('ficha');
  if (!ent) { cont.innerHTML = '<div class="placeholder">-- selecciona una entidad en el mapa --</div>'; return; }
  let html = `<div style="color:#ffe9c2;font-size:14px;margin-bottom:6px;">${ent.nombre || ent.tipo} <span style="color:#8a5a10">[${ent.tipo}]</span></div>`;
  html += '<div class="kv">';
  html += `<div class="k">POS</div><div class="v">${ent.x},${ent.y}</div>`;
  html += `<div class="k">EDAD</div><div class="v">${ent.edad_anios}a</div>`;
  if (ent.sexo) html += `<div class="k">SEXO</div><div class="v">${ent.sexo}</div>`;
  if (ent.accion) html += `<div class="k">ACCION</div><div class="v">${ent.accion}</div>`;
  if (ent.necesidades) for (const [k,v] of Object.entries(ent.necesidades)) html += `<div class="k">${k}</div><div class="v">${(v*100).toFixed(0)}%</div>`;
  html += '</div>';
  cont.innerHTML = html;
}
// Entidad seleccionada -- guardado por id (no por referencia al objeto,
// que en modo vivo se sustituye entero cada segundo) para poder
// refrescar la ficha sola cuando llega una instantanea nueva, sin que
// el usuario tenga que volver a hacer clic.
let entidadSeleccionadaId = null;
contenido.addEventListener('click', (ev) => {
  const id = ev.target?.dataset?.entId;
  if (!id) return;
  entidadSeleccionadaId = id;
  const ent = DATA.entidades.find(e => String(e.id) === id);
  mostrarFicha(ent);
});

function renderStats() {
  const cont = document.getElementById('stats');
  let html = '<div class="kv">';
  for (const [esp, n] of Object.entries(DATA.censo)) html += `<div class="k">${esp.toUpperCase()}</div><div class="v">${n}</div>`;
  html += `<div class="k">SEMILLA</div><div class="v">${DATA.semilla}</div>`;
  html += '</div>';
  cont.innerHTML = html;
}
function renderNarrador() {
  const cont = document.getElementById('narrador');
  if (!DATA.cronica || DATA.cronica.length === 0) { cont.innerHTML = '<div class="placeholder">-- sin eventos recientes --</div>'; return; }
  cont.innerHTML = DATA.cronica.map(l => `<div class="cronica-linea">${l}</div>`).join('');
}

// Modo en vivo: intenta /estado.json (relativo -- funciona tanto si esto
// se sirve en la raiz de ManejadorWeb como en cualquier prefijo). Si falla
// (servido suelto, sin ese endpoint), cae en silencio a la instantanea
// estatica de datos.js -- no hay ninguna bifurcacion explicita de "modo",
// solo un fetch que puede fallar o no.
async function cargarEstadoVivo() {
  try {
    const r = await fetch('estado.json', { cache: 'no-store' });
    if (!r.ok) return false;
    const nuevo = await r.json();
    if (!nuevo || !nuevo.celdas) return false;
    DATA = nuevo;
    return true;
  } catch (e) {
    return false;
  }
}

async function iniciar() {
  await cargarEstadoVivo(); // si funciona, sustituye DATA antes del primer render
  if (!DATA) return; // ni datos.js ni /estado.json disponibles -- nada que dibujar
  construirLeyenda();
  recalcularDerivados();
  renderMapa();
  renderCriaturas();
  aplicarTransform();
  renderStats();
  renderNarrador();
  // Sondeo continuo. segundos_por_tick real del motor es 0.4 (config/
  // visual.yaml) -- 1000ms de por si ya sondea mas lento que cada tick
  // real, evita recalcular derivados en cada uno.
  setInterval(async () => {
    const ok = await cargarEstadoVivo();
    if (!ok) return;
    recalcularDerivados();
    renderMapa();
    renderCriaturas();
    renderStats();
    renderNarrador();
    if (entidadSeleccionadaId != null) {
      const ent = DATA.entidades.find(e => String(e.id) === entidadSeleccionadaId);
      mostrarFicha(ent || null);
    }
  }, 1000);
}
iniciar();
</script>
