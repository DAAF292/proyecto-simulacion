<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Vallis Runica -- Terminal</title>
<style>
  :root {
    --ambar: #ffb000;
    --ambar-tenue: #8a5a10;
    --ambar-fuerte: #ffd27a;
    --fondo: #0a0500;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: #000;
    font-family: "Courier New", ui-monospace, monospace;
    color: var(--ambar);
    height: 100%;
  }
  .layout {
    display: grid;
    grid-template-columns: 3fr 1.1fr;
    grid-template-rows: 1fr;
    gap: 10px;
    height: 100vh;
    padding: 10px;
  }
  .col-derecha {
    display: grid;
    grid-template-rows: 1.3fr 1fr 0.8fr 0.9fr;
    gap: 10px;
    min-height: 0;
  }
  .terminal {
    position: relative;
    background: var(--fondo);
    border: 2px solid var(--ambar-tenue);
    border-radius: 4px;
    box-shadow: 0 0 12px rgba(255,176,0,0.15) inset, 0 0 8px rgba(255,176,0,0.08);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .titulo {
    flex: 0 0 auto;
    font-size: 12px;
    letter-spacing: 2px;
    padding: 4px 10px;
    background: linear-gradient(180deg, rgba(255,176,0,0.18), rgba(255,176,0,0.02));
    border-bottom: 1px solid var(--ambar-tenue);
    color: var(--ambar);
    text-shadow: 0 0 6px rgba(255,176,0,0.8);
    display: flex; justify-content: space-between; align-items: center;
  }
  .cuerpo {
    flex: 1 1 auto;
    overflow: auto;
    padding: 8px 10px;
    font-size: 13px;
    line-height: 1.15;
  }
  .crt-overlay {
    position: fixed; inset: 0; pointer-events: none; z-index: 50;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.18) 0px, rgba(0,0,0,0.18) 1px, transparent 1px, transparent 3px),
      radial-gradient(ellipse at center, rgba(0,0,0,0) 60%, rgba(0,0,0,0.45) 100%);
    mix-blend-mode: multiply;
  }
  #mapa-viewport {
    flex: 1 1 auto; position: relative; overflow: hidden; cursor: grab;
    background: #000;
  }
  #mapa-viewport.arrastrando { cursor: grabbing; }
  #mapa-contenido { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
  .celda-txt {
    position: absolute; display: flex; align-items: center; justify-content: center;
    font-weight: bold;
  }
  .celda-img {
    /* REDISEÑO 2026-09-13 (Diego: "el estilo que hemos conseguido no se
       parece en absoluto a Ranger"): estos sprites ya NO son
       ilustraciones grandes que se desbordan sobre celdas vecinas (ver
       git log para esa version) -- son tiles pequeños de mosaico que
       encajan dentro de su propia celda, generados por
       presentacion/arnes/generar_sprites_mosaico.py. Sin drop-shadow de
       contorno: un mosaico plano no necesita silueta remarcada, la
       separacion visual entre objetos viene de que cada uno vive en su
       propia celda sin solapar al vecino. */
    position: absolute; image-rendering: pixelated;
  }
  .criatura-img {
    /* Igual que antes: transform (no left/top) para que la GPU componga
       la animacion de movimiento sin recalcular layout -- ver historial
       de esta clase en git log si se retoma esta seccion. */
    position: absolute; image-rendering: pixelated;
    transition: transform 0.9s linear;
  }
  .celda-img-tile {
    /* Suelo/agua: rellena la celda EXACTA, sin margen -- es el fondo
       continuo del mosaico, no un objeto individual. */
    position: absolute; image-rendering: pixelated;
  }
  .zoom-info { font-size: 11px; color: var(--ambar-tenue); }

  .kv { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 10px; margin-bottom: 6px;}
  .kv div.k { color: var(--ambar-tenue); }
  .kv div.v { color: var(--ambar-fuerte); text-align: right; }
  .cronica-linea { padding: 2px 0; border-bottom: 1px dashed rgba(255,176,0,0.15); }
  .cronica-linea:last-child { border-bottom: none; }
  .cmd-input {
    background: #000; border: 1px solid var(--ambar-tenue); color: var(--ambar);
    font-family: inherit; font-size: 13px; width: 100%; padding: 4px 6px;
    outline: none;
  }
  .parpadeo { animation: parp 1s steps(1) infinite; }
  @keyframes parp { 50% { opacity: 0; } }
  .placeholder { color: var(--ambar-tenue); font-style: italic; }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--ambar-tenue); }
  ::-webkit-scrollbar-track { background: #000; }
</style>
</head>
<body>
<div class="crt-overlay"></div>
<div class="layout">
  <div class="terminal" id="term-mapa">
    <div class="titulo">
      <span>MAPA://SUPERFICIE &mdash; <span id="titulo-mapa-info"></span></span>
      <span class="zoom-info" id="zoom-info"></span>
    </div>
    <div id="mapa-viewport">
      <div id="mapa-contenido"></div>
    </div>
  </div>
  <div class="col-derecha">
    <div class="terminal">
      <div class="titulo">FICHA://ENTIDAD</div>
      <div class="cuerpo" id="ficha"><div class="placeholder">-- selecciona una entidad en el mapa --</div></div>
    </div>
    <div class="terminal">
      <div class="titulo">NARRADOR://CRONICA <span class="parpadeo">_</span></div>
      <div class="cuerpo" id="narrador"></div>
    </div>
    <div class="terminal">
      <div class="titulo">STATS://MUNDO</div>
      <div class="cuerpo" id="stats"></div>
    </div>
    <div class="terminal">
      <div class="titulo">EVENTOS://LOG (filtro)</div>
      <div class="cuerpo" id="eventos">
        <input class="cmd-input" placeholder="filtrar por especie/causa..." style="margin-bottom:6px;">
        <div class="placeholder">-- catalogo de eventos, pendiente de circulo siguiente --</div>
      </div>
    </div>
  </div>
</div>
<script src="datos.js"></script>
<script>
// REDISEÑO DE ESTILO (2026-09-13, Diego: "el estilo que hemos conseguido
// no se parece en absoluto a Ranger, que era el juego que estabamos
// usando de referencia" + dos capturas de Ranger). El problema no era
// escala/solapamiento (lo que se venia corrigiendo hasta ese momento) --
// era una incompatibilidad de FILOSOFIA de arte: sprites ilustrados a
// mano y detallados (inspiracion/) nunca van a leerse como el mosaico
// de tiles pequeños y planos de Ranger, por mucho que se ajuste tamaño.
// Diego eligio "nuevo set de assets simples": sprites 32x32 generados
// proceduralmente (presentacion/arnes/generar_sprites_mosaico.py),
// pensados para encajar dentro de su propia celda sin desbordar sobre
// la vecina -- ver sprites_mosaico/. El pool de inspiracion/ (sprites/)
// se conserva en disco por si se retoma ese estilo, pero ya no se
// referencia desde aqui.
let DATA = window.__DATOS__ || null;
const CELDA = 32; // px base por celda (== tamaño nativo del tile, sin escalado)

// Fallback ascii -- solo si faltase un sprite real (red de seguridad).
const SIMBOLO_BIOMA = {
  pradera: { color: '#4a7c38' }, bosque: { color: '#2e4a2a' },
  desierto: { color: '#d6b27a' }, tundra: { color: '#c4cec4' },
  montana: { color: '#7c7468' },
};
const SIMBOLO_ENTIDAD = {
  gnomo: { s: '@', color: '#ffe9c2' }, lobo: { s: 'w', color: '#ff5533' },
  conejo: { s: 'r', color: '#d9c9a0' }, ardilla: { s: 's', color: '#e8952e' },
  caballo: { s: 'H', color: '#c9a06a' }, venado: { s: 'd', color: '#a3703f' },
  cabra_montesa: { s: 'c', color: '#b59a6a' }, necromasa: { s: '%', color: '#5a4a3a' },
};

const M = 'sprites/mosaico/'; // bajo sprites/ a proposito: es la unica ruta que _servir_sprite_terminal (vista_web.py) sirve cuando esto corre enchufado al motor en vivo
// Suelo -- tile FULL-BLEED por bioma (rellena la celda entera, sin alfa).
const SPRITES_SUELO = {
  pradera: [M+'suelo_pradera_1.png', M+'suelo_pradera_2.png', M+'suelo_pradera_3.png'],
  bosque: [M+'suelo_bosque_1.png', M+'suelo_bosque_2.png', M+'suelo_bosque_3.png'],
  desierto: [M+'suelo_desierto_1.png', M+'suelo_desierto_2.png', M+'suelo_desierto_3.png'],
  tundra: [M+'suelo_tundra_1.png', M+'suelo_tundra_2.png', M+'suelo_tundra_3.png'],
  montana: [M+'suelo_montana_1.png', M+'suelo_montana_2.png', M+'suelo_montana_3.png'],
};
// Agua -- mismo tile tileable para lago y poza; poza se distingue por
// opacidad reducida (lee como agua superficial/efimera, no un lago
// permanente) en vez de por una silueta de charco aparte.
const SPRITES_AGUA = {
  lago: [M+'agua_1.png', M+'agua_2.png'],
  rio: [M+'agua_1.png', M+'agua_2.png'],
  poza: [M+'agua_1.png', M+'agua_2.png'],
};
// Flora -- sprites CON alfa, ya centrados y con margen dentro de su
// tile de 32x32 (nunca tocan el borde) -- por eso ya no hace falta
// ninguna escala por altura real ni aspecto por fichero: todos son
// cuadrados y ya vienen al tamaño relativo correcto entre si.
const SPRITES_FLORA = {
  manzano: [M+'manzano_1.png', M+'manzano_2.png'],
  roble: [M+'roble_1.png', M+'roble_2.png'],
  pino: [M+'pino_1.png', M+'pino_2.png'],
  helecho: [M+'helecho_1.png'],
  arbusto_montano: [M+'arbusto_montano_1.png'],
  arbusto_artico: [M+'arbusto_artico_1.png'],
  arbusto_desertico: [M+'arbusto_desertico_1.png'],
  arbusto_espinoso: [M+'arbusto_espinoso_1.png', M+'arbusto_espinoso_2.png'],
  cactus: [M+'cactus_1.png'],
  hierba_silvestre: [M+'hierba_silvestre_1.png', M+'hierba_silvestre_2.png'],
  flor_silvestre: [M+'flor_silvestre_1.png', M+'flor_silvestre_2.png'],
  hierba_desertica: [M+'hierba_desertica_1.png'],
  hierba_artica: [M+'hierba_artica_1.png'],
  liquen: [M+'liquen_1.png'],
  musgo: [M+'musgo_1.png'],
};
// Especies que compiten por espacio fisico real (config/flora.yaml,
// compite_espacio_fisico: true) -- preferidas al representar una celda
// con mas de una planta (cupo de espacio compartido).
const ESPECIES_COMPETIDORAS_SET = new Set([
  'manzano','roble','cactus','arbusto_espinoso','arbusto_desertico',
  'pino','arbusto_montano','arbusto_artico',
]);
const SPRITES_CRIATURA = {
  gnomo: [M+'gnomo_1.png'], lobo: [M+'lobo_1.png'], conejo: [M+'conejo_1.png'],
  ardilla: [M+'ardilla_1.png'], caballo: [M+'caballo_1.png'], venado: [M+'venado_1.png'],
  cabra_montesa: [M+'cabra_montesa_1.png'],
};
const SPRITES_CONSTRUCCION = { refugio: [M+'refugio_1.png'], almacen: [M+'almacen_1.png'] };
const SPRITES_OBJETOS = { roca: [M+'roca_1.png'], rama: [M+'rama_1.png'] };

// Factores de tamaño en pantalla -- relativos a CELDA, todos <1 para
// que quede un margen visible entre celdas vecinas (lectura de mosaico
// tipo Ranger, no un empalme perfecto sin junta). Uniformes entre
// especies/plantas -- la diferencia de "peso visual" entre un pino y un
// arbusto ya viene dada por la propia silueta del sprite (32x32), no
// por escalarlo mas grande en pantalla.
const FACTOR_FLORA = 0.92;
const FACTOR_CRIATURA = 0.8;
const FACTOR_CONSTRUCCION = 0.98;
const FACTOR_OBJETO = 0.55;

function hashDet(x,y,sal) {
  let h = (x*374761393 + y*668265263 + sal*2654435761) >>> 0;
  h = (h ^ (h>>>13)) >>> 0; h = Math.imul(h, 1274126177) >>> 0; h = (h ^ (h>>>16)) >>> 0;
  return h / 4294967296;
}

let construccionesPorCelda = {};

function componentesConexasAgua(tipoAgua) {
  // Flood-fill 4-vecinos sobre DATA.celdas -- mismo algoritmo que
  // nucleo/materiales.py:componentes_conexas del motor real, aqui en JS
  // porque el DTO no agrupa celdas de agua, solo las marca individualmente.
  // Se sigue usando solo para que un mismo cuerpo de agua muestre una
  // unica variante de textura (nunca parcheado celda a celda).
  const visitado = new Set();
  const comps = [];
  for (let y = 0; y < DATA.alto; y++) {
    for (let x = 0; x < DATA.ancho; x++) {
      const clave = x + ',' + y;
      const celda = DATA.celdas[y][x];
      if (visitado.has(clave) || !celda.tiene_agua || celda.tipo_agua !== tipoAgua) continue;
      const pila = [[x, y]];
      visitado.add(clave);
      const celdas = [];
      while (pila.length) {
        const [cx, cy] = pila.pop();
        celdas.push([cx, cy]);
        for (const [nx, ny] of [[cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]]) {
          if (nx < 0 || ny < 0 || nx >= DATA.ancho || ny >= DATA.alto) continue;
          const nk = nx + ',' + ny;
          if (visitado.has(nk)) continue;
          const nCelda = DATA.celdas[ny][nx];
          if (!nCelda.tiene_agua || nCelda.tipo_agua !== tipoAgua) continue;
          visitado.add(nk);
          pila.push([nx, ny]);
        }
      }
      comps.push(celdas);
    }
  }
  return comps;
}

let variantePorCeldaAgua = {}; // clave 'x,y' -> src, una por cuerpo conexo

// Todo lo de arriba dependia de un DATA fijo, calculado una sola vez al
// cargar el script -- con el modo en vivo (ver cargarEstadoVivo/iniciar
// mas abajo) DATA cambia cada segundo, asi que esto tiene que poder
// recalcularse tantas veces como haga falta.
function recalcularDerivados() {
  construccionesPorCelda = {};
  for (const con of (DATA.construcciones || [])) {
    const clave = con.x + ',' + con.y;
    (construccionesPorCelda[clave] = construccionesPorCelda[clave] || []).push(con);
  }
  variantePorCeldaAgua = {};
  for (const tipo of ['lago', 'rio', 'poza']) {
    for (const comp of componentesConexasAgua(tipo)) {
      const [ox, oy] = comp[0];
      const pool = SPRITES_AGUA[tipo];
      const src = pool[Math.floor(hashDet(ox, oy, 29) * pool.length)];
      for (const [cx, cy] of comp) variantePorCeldaAgua[cx + ',' + cy] = src;
    }
  }
}

// Ground layer: siempre exactamente un tile por celda (agua o suelo del
// bioma), full-bleed, sin margen ni jitter -- es el fondo continuo del
// mosaico.
function sueloCelda(c) {
  if (c.tiene_agua) {
    const pool = SPRITES_AGUA[c.tipo_agua] || SPRITES_AGUA.lago;
    const src = variantePorCeldaAgua[c.x + ',' + c.y] || pool[0];
    const opacidad = c.tipo_agua === 'poza' ? 0.75 : 1;
    return { src, opacidad };
  }
  const pool = SPRITES_SUELO[c.bioma];
  if (pool) {
    const idx = Math.floor(hashDet(c.x, c.y, 11) * pool.length);
    return { src: pool[idx], opacidad: 1 };
  }
  return null; // bioma desconocido -- deja ver el fondo negro (defensivo)
}

// Overlay: lo que se dibuja ENCIMA del tile de suelo, centrado y mas
// pequeño que la celda (construccion > planta > objeto ambiental,
// mismo orden de prioridad que antes -- una celda con agua nunca llega
// aqui, el agua sustituye el suelo por completo).
function overlayCelda(c) {
  const construcciones = construccionesPorCelda[c.x + ',' + c.y];
  if (construcciones && construcciones.length > 0) {
    const con = construcciones[0];
    const pool = SPRITES_CONSTRUCCION[con.tipo];
    if (pool) {
      const idx = Math.floor(hashDet(c.x, c.y, 83) * pool.length);
      return { tipo: 'sprite', src: pool[idx], factor: FACTOR_CONSTRUCCION };
    }
    return { tipo: 'txt', ch: '#', color: '#8a6a3a' }; // salon_comun/cocina, sin sprite todavia
  }
  if (c.tiene_agua) return null; // el agua ya es el propio suelo, sin overlay
  if (c.plantas && c.plantas.length > 0) {
    const competidora = c.plantas.find(p => ESPECIES_COMPETIDORAS_SET.has(p.especie)) || c.plantas[0];
    const especie = competidora.especie;
    const pool = SPRITES_FLORA[especie];
    if (pool) {
      const idx = Math.floor(hashDet(c.x, c.y, 17) * pool.length);
      if (c.plantas.length > 1) {
        const idx2 = Math.floor(hashDet(c.x, c.y, 41) * pool.length);
        return { tipo: 'sprite-doble', srcs: [pool[idx], pool[idx2]], factor: FACTOR_FLORA * 0.65 };
      }
      return { tipo: 'sprite', src: pool[idx], factor: FACTOR_FLORA };
    }
    return { tipo: 'txt', ch: "'", color: '#7a5a2a' };
  }
  const recursos = c.recursos || {};
  if ((recursos.piedra_suelta || 0) > 0) {
    const pool = SPRITES_OBJETOS.roca;
    return { tipo: 'sprite', src: pool[Math.floor(hashDet(c.x, c.y, 97) * pool.length)], factor: FACTOR_OBJETO };
  }
  if ((recursos.madera || 0) > 0) {
    const pool = SPRITES_OBJETOS.rama;
    return { tipo: 'sprite', src: pool[Math.floor(hashDet(c.x, c.y, 101) * pool.length)], factor: FACTOR_OBJETO };
  }
  return null;
}

function infoCriatura(ent) {
  const pool = SPRITES_CRIATURA[ent.tipo];
  if (pool) {
    const idx = Math.floor(hashDet(ent.id, 0, 73) * pool.length);
    return { tipo: 'sprite', src: pool[idx] };
  }
  const s = SIMBOLO_ENTIDAD[ent.tipo] || { s: '?', color: '#fff' };
  return { tipo: 'txt', ch: s.s, color: s.color, glow: true };
}

// --- cenital recto: cada celda en su cuadricula normal, sin desplazamiento
// diagonal por fila ni Y-sort agresivo -- el mosaico ya no necesita ninguno
// de los dos (nada se desborda sobre la celda vecina).
function celdaAPantalla(wx, wy, tam) {
  return { cx: wx * tam, cy: wy * tam };
}

// Dos capas dentro de #mapa-contenido: la ESTATICA (suelo + overlay) se
// destruye y se recrea entera en cada render; la de CRIATURAS es
// persistente entre renders para poder animar su movimiento con una
// transicion CSS en vez de teletransportarlas.
let capaEstatica = null, capaCriaturas = null;
function asegurarCapas() {
  const cont = document.getElementById('mapa-contenido');
  if (!capaEstatica) {
    capaEstatica = document.createElement('div');
    capaEstatica.style.position = 'absolute';
    capaEstatica.style.top = '0'; capaEstatica.style.left = '0';
    cont.appendChild(capaEstatica);
  }
  if (!capaCriaturas) {
    capaCriaturas = document.createElement('div');
    capaCriaturas.style.position = 'absolute';
    capaCriaturas.style.top = '0'; capaCriaturas.style.left = '0';
    cont.appendChild(capaCriaturas);
  }
  return cont;
}

function colocarOverlay(baseLeft, baseTop, src, factor, offsetX) {
  const el = document.createElement('img');
  el.className = 'celda-img';
  el.src = src;
  const lado = CELDA * factor;
  el.style.width = lado + 'px';
  el.style.height = lado + 'px';
  el.style.left = (baseLeft + (CELDA - lado) / 2 + (offsetX || 0)) + 'px';
  el.style.top = (baseTop + (CELDA - lado) / 2) + 'px';
  capaEstatica.appendChild(el);
}

function renderMapa() {
  const cont = asegurarCapas();
  capaEstatica.innerHTML = '';
  cont.style.width = (DATA.ancho * CELDA) + 'px';
  cont.style.height = (DATA.alto * CELDA) + 'px';
  for (let y = 0; y < DATA.alto; y++) {
    for (let x = 0; x < DATA.ancho; x++) {
      const c = DATA.celdas[y][x];
      const { cx: baseLeft, cy: baseTop } = celdaAPantalla(x, y, CELDA);

      const suelo = sueloCelda(c);
      if (suelo) {
        const el = document.createElement('img');
        el.className = 'celda-img-tile';
        el.src = suelo.src;
        el.style.opacity = String(suelo.opacidad);
        el.style.width = CELDA + 'px';
        el.style.height = CELDA + 'px';
        el.style.left = baseLeft + 'px';
        el.style.top = baseTop + 'px';
        capaEstatica.appendChild(el);
      }

      const info = overlayCelda(c);
      if (!info) continue;
      if (info.tipo === 'sprite') {
        colocarOverlay(baseLeft, baseTop, info.src, info.factor, 0);
      } else if (info.tipo === 'sprite-doble') {
        colocarOverlay(baseLeft, baseTop, info.srcs[0], info.factor, -CELDA * 0.22);
        colocarOverlay(baseLeft, baseTop, info.srcs[1], info.factor, CELDA * 0.22);
      } else {
        const el = document.createElement('div');
        el.className = 'celda-txt';
        el.textContent = info.ch;
        el.style.width = CELDA + 'px';
        el.style.height = CELDA + 'px';
        el.style.fontSize = Math.round(CELDA * 0.6) + 'px';
        el.style.color = info.color;
        el.style.left = baseLeft + 'px';
        el.style.top = baseTop + 'px';
        capaEstatica.appendChild(el);
      }
    }
  }
  document.getElementById('titulo-mapa-info').textContent =
    `TICK ${DATA.tick} · DIA ${DATA.dia} · ${DATA.estacion.toUpperCase()} · ${DATA.clima.toUpperCase()}`;
}

// Criaturas: capa PERSISTENTE, un <img> por id de entidad reutilizado
// entre renders -- solo se cambian transform/src, nunca se recrea el
// elemento mientras la entidad siga viva, asi que la transicion CSS
// anima el desplazamiento real en vez de teletransportar. La direccion
// se infiere comparando la x anterior conocida de ESE id con la x
// nueva; sin movimiento horizontal se conserva la ultima orientacion.
let elementosCriatura = {};
function renderCriaturas() {
  asegurarCapas();
  const vistos = new Set();
  for (const ent of DATA.entidades) {
    const idStr = String(ent.id);
    vistos.add(idStr);
    const info = infoCriatura(ent);
    const { cx, cy } = celdaAPantalla(ent.x, ent.y, CELDA);
    const previo = elementosCriatura[idStr];
    let mirarIzquierda = previo ? previo.mirarIzquierda : false;
    if (previo && ent.x !== previo.x) mirarIzquierda = ent.x < previo.x;

    if (info.tipo === 'sprite') {
      let el = previo && previo.esImg ? previo.el : null;
      if (!el) {
        if (previo) previo.el.remove();
        el = document.createElement('img');
        el.className = 'criatura-img';
        // left/top FIJOS en 0 -- la posicion real la decide el transform
        // (compuesto por la GPU, sin forzar reflow en cada fotograma).
        el.style.left = '0px';
        el.style.top = '0px';
        capaCriaturas.appendChild(el);
      }
      if (el.src.indexOf(info.src) === -1) el.src = info.src;
      const lado = CELDA * FACTOR_CRIATURA;
      el.style.width = lado + 'px';
      el.style.height = lado + 'px';
      const posX = cx + (CELDA - lado) / 2;
      const posY = cy + (CELDA - lado) / 2;
      el.style.zIndex = String(1000 + ent.y);
      el.style.transform = `translate(${posX}px, ${posY}px) scaleX(${mirarIzquierda ? -1 : 1})`;
      el.dataset.entId = idStr;
      elementosCriatura[idStr] = { el, x: ent.x, y: ent.y, mirarIzquierda, esImg: true };
    } else {
      // fallback ascii (necromasa, u otra especie sin sprite todavia) --
      // sin animar posicion, no tiene sentido "deslizar" un cadaver.
      let el = previo && !previo.esImg ? previo.el : null;
      if (!el) {
        if (previo) previo.el.remove();
        el = document.createElement('div');
        el.className = 'celda-txt';
        capaCriaturas.appendChild(el);
      }
      el.textContent = info.ch;
      el.style.width = CELDA + 'px'; el.style.height = CELDA + 'px';
      el.style.fontSize = Math.round(CELDA * 0.6) + 'px';
      el.style.color = info.color;
      if (info.glow) el.style.textShadow = `0 0 6px ${info.color}`;
      el.style.left = cx + 'px'; el.style.top = cy + 'px';
      el.style.zIndex = String(1000 + ent.y);
      el.dataset.entId = idStr;
      elementosCriatura[idStr] = { el, x: ent.x, y: ent.y, mirarIzquierda, esImg: false };
    }
  }
  // Entidades que ya no existen (murieron, o salieron de la zona
  // exportada) -- se retira su elemento, no se deja huerfano en el DOM.
  for (const id of Object.keys(elementosCriatura)) {
    if (!vistos.has(id)) {
      elementosCriatura[id].el.remove();
      delete elementosCriatura[id];
    }
  }
}

// --- zoom (rueda) + pan (arrastre) ---
let zoom = 1, panX = -CELDA*7, panY = -CELDA*3;
const viewport = document.getElementById('mapa-viewport');
const contenido = document.getElementById('mapa-contenido');
function aplicarTransform() {
  contenido.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
  document.getElementById('zoom-info').textContent = `ZOOM ${zoom.toFixed(2)}x`;
}
viewport.addEventListener('wheel', (ev) => {
  ev.preventDefault();
  const factor = ev.deltaY < 0 ? 1.12 : 1/1.12;
  zoom = Math.min(6, Math.max(0.4, zoom * factor));
  aplicarTransform();
}, { passive: false });
let arrastrando = false, ax=0, ay=0;
viewport.addEventListener('mousedown', (ev) => { arrastrando = true; ax=ev.clientX; ay=ev.clientY; viewport.classList.add('arrastrando'); });
window.addEventListener('mouseup', () => { arrastrando = false; viewport.classList.remove('arrastrando'); });
window.addEventListener('mousemove', (ev) => {
  if (!arrastrando) return;
  panX += (ev.clientX - ax); panY += (ev.clientY - ay);
  ax = ev.clientX; ay = ev.clientY;
  aplicarTransform();
});

function mostrarFicha(ent) {
  const cont = document.getElementById('ficha');
  if (!ent) { cont.innerHTML = '<div class="placeholder">-- selecciona una entidad en el mapa --</div>'; return; }
  let html = `<div style="color:#ffe9c2;font-size:14px;margin-bottom:6px;">${ent.nombre || ent.tipo} <span style="color:#8a5a10">[${ent.tipo}]</span></div>`;
  html += '<div class="kv">';
  html += `<div class="k">POS</div><div class="v">${ent.x},${ent.y}</div>`;
  html += `<div class="k">EDAD</div><div class="v">${ent.edad_anios}a</div>`;
  if (ent.sexo) html += `<div class="k">SEXO</div><div class="v">${ent.sexo}</div>`;
  if (ent.accion) html += `<div class="k">ACCION</div><div class="v">${ent.accion}</div>`;
  if (ent.necesidades) for (const [k,v] of Object.entries(ent.necesidades)) html += `<div class="k">${k}</div><div class="v">${(v*100).toFixed(0)}%</div>`;
  html += '</div>';
  cont.innerHTML = html;
}
// Entidad seleccionada -- guardado por id (no por referencia al objeto,
// que en modo vivo se sustituye entero cada segundo) para poder
// refrescar la ficha sola cuando llega una instantanea nueva, sin que
// el usuario tenga que volver a hacer clic.
let entidadSeleccionadaId = null;
contenido.addEventListener('click', (ev) => {
  const id = ev.target?.dataset?.entId;
  if (!id) return;
  entidadSeleccionadaId = id;
  const ent = DATA.entidades.find(e => String(e.id) === id);
  mostrarFicha(ent);
});

function renderStats() {
  const cont = document.getElementById('stats');
  let html = '<div class="kv">';
  for (const [esp, n] of Object.entries(DATA.censo)) html += `<div class="k">${esp.toUpperCase()}</div><div class="v">${n}</div>`;
  html += `<div class="k">SEMILLA</div><div class="v">${DATA.semilla}</div>`;
  html += '</div>';
  cont.innerHTML = html;
}
function renderNarrador() {
  const cont = document.getElementById('narrador');
  if (!DATA.cronica || DATA.cronica.length === 0) { cont.innerHTML = '<div class="placeholder">-- sin eventos recientes --</div>'; return; }
  cont.innerHTML = DATA.cronica.map(l => `<div class="cronica-linea">${l}</div>`).join('');
}

// Modo en vivo: intenta /estado.json (relativo -- funciona tanto si esto
// se sirve en la raiz de ManejadorWeb como en cualquier prefijo). Si
// falla (servido suelto, sin ese endpoint), cae en silencio a la
// instantanea estatica de datos.js.
async function cargarEstadoVivo() {
  try {
    const r = await fetch('estado.json', { cache: 'no-store' });
    if (!r.ok) return false;
    const nuevo = await r.json();
    if (!nuevo || !nuevo.celdas) return false;
    DATA = nuevo;
    return true;
  } catch (e) {
    return false;
  }
}

async function iniciar() {
  await cargarEstadoVivo(); // si funciona, sustituye DATA antes del primer render
  if (!DATA) return; // ni datos.js ni /estado.json disponibles -- nada que dibujar
  recalcularDerivados();
  renderMapa();
  renderCriaturas();
  aplicarTransform();
  renderStats();
  renderNarrador();
  // Sondeo continuo -- el suelo (flora/agua/construcciones) se refresca
  // cada 4 sondeos (~4s, no cambia de forma perceptible tick a tick);
  // las criaturas cada segundo, que es lo que de verdad necesita verse
  // vivo. Ver historial de esta funcion en git log para el diagnostico
  // de rendimiento que llevo a esta cadencia.
  let contadorSondeos = 0;
  const RENDER_ESTATICO_CADA_N_SONDEOS = 4;
  setInterval(async () => {
    const ok = await cargarEstadoVivo();
    if (!ok) return;
    contadorSondeos++;
    if (contadorSondeos % RENDER_ESTATICO_CADA_N_SONDEOS === 0) {
      recalcularDerivados();
      renderMapa();
    }
    renderCriaturas();
    renderStats();
    renderNarrador();
    if (entidadSeleccionadaId != null) {
      const ent = DATA.entidades.find(e => String(e.id) === entidadSeleccionadaId);
      mostrarFicha(ent || null);
    }
  }, 1000);
}
iniciar();
</script>
