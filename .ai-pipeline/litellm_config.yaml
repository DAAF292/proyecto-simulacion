# Config del proxy LiteLLM del pipeline autónomo (.ai-pipeline/start-pipeline.sh
# lo arranca en el puerto 4000; .ai-pipeline/run-plan.sh llama a aider con
# --model openai/agente-obrero contra http://0.0.0.0:4000).
#
# HISTORIAL (2026-09-01): este fichero nunca existió desde que se creó el
# resto de la infraestructura del pipeline (commit fdd666c) -- litellm
# crasheaba al arrancar con "Config file not found", así que el proxy
# jamás llegó a escuchar en el puerto 4000. Cada llamada de aider contra
# ese puerto fallaba con "Connection error", agotaba sus reintentos
# internos, y aider salía con código 0 sin haber tocado ni una línea de
# código -- el pipeline lo interpretaba como éxito (ver run-plan.sh, la
# corrección de verificación real de cambios añadida el mismo día) y
# terminó abriendo un PR (#1, armas-fabricadas) que no implementaba nada
# del plan. Backend confirmado por Diego: OpenRouter, con
# OPENROUTER_API_KEY ya presente en el entorno (~/.bashrc).
#
# Modelo elegido para el alias "agente-obrero": deepseek/deepseek-v4-flash-0731
# vía OpenRouter -- decisión explícita de Diego (2026-09-01), segundo
# cambio de modelo tras deepseek-chat (V3), que Diego consideró "no
# pensado para estas tareas". Confirmado contra el catálogo real de
# OpenRouter (GET https://openrouter.ai/api/v1/models): de las cuatro
# variantes V4 disponibles (pro-0423, pro-0813, flash-0423, flash-0731),
# flash-0731 es la ÚNICA cuya descripción menciona explícitamente estar
# "re-post-trained" para "coding, reasoning, and agent workflows" -- el
# resto son de propósito general. También la más barata de las cuatro
# (~$0.065/$0.18 por millón de tokens prompt/completion) y con el
# contexto más amplio (1.3M tokens). Para cambiarlo basta con editar la
# línea `model:` de abajo, ningún otro fichero del pipeline conoce el
# modelo real, solo el alias "agente-obrero".
model_list:
  - model_name: agente-obrero
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-flash-0731
      api_key: os.environ/OPENROUTER_API_KEY
      # GUARDAS DE PRESUPUESTO (2026-09-01, pedidas explícitamente por
      # Diego -- ver CLAUDE.md, "Incidente del pipeline autónomo").
      # PRECISIÓN IMPORTANTE, no cosmética: litellm NO tiene forma de
      # rechazar una llamada individual antes de que se complete por
      # coste ("por cada solicitud individual") -- el coste de una
      # llamada depende de los tokens de SALIDA, que no se conocen hasta
      # que termina de generarse, así que ningún proxy puede vetarla de
      # antemano por precio. Lo que sí existe y es real: max_budget +
      # budget_duration llevan la cuenta acumulada de gasto de ESTE
      # despliegue (agente-obrero) en el periodo indicado (aquí, por
      # día) usando una caché en memoria del propio proceso de litellm
      # (sin necesidad de Redis/Postgres para un solo proceso siempre
      # activo) -- al superar el tope, el router deja de enrutar
      # llamadas a este despliegue hasta que el periodo se reinicia. Es
      # la protección real contra un BUCLE que dispare muchas llamadas
      # (el riesgo real de un pipeline autónomo sin supervisión), no
      # contra una única llamada cara.
      #
      # SUBIDO (2026-09-02, pedido por Diego): 0.10 USD/día resultó corto
      # para un día real de uso intencional -- 5 planes soltados uno a
      # uno, cada uno con hasta 3 intentos de aider (algunos con varios
      # reintentos internos de litellm de por medio), agotó el tope a
      # media tarde sin que hubiera ningún bucle descontrolado, solo
      # trabajo real. 1.00 USD/día da un margen holgado (~10x el gasto
      # real de hoy) sin dejar de ser un techo duro real -- sigue
      # protegiendo contra el riesgo original (un bucle que dispare
      # muchas llamadas sin supervisión), solo que con más margen para
      # una sesión de trabajo normal.
      # SUBIDA TEMPORAL (2026-09-03, revertir a 1.00 tras el experimento
      # de "armas primitivas v2" -- tarea deliberadamente compleja, con
      # -l subido a 1.50 en run-plan.sh, ver ese fichero): 1.00 se
      # quedaría corto si el disyuntor de 3 intentos consume cerca del
      # tope de -l en cada uno.
      max_budget: 6.00
      budget_duration: "1d"
      # provider.sort: price (2026-09-02, pregunta real de Diego: "¿no
      # sería más rentable ir directo a DeepSeek?"). Verificado contra el
      # catálogo real de OpenRouter: NO -- DeepSeek (el proveedor oficial)
      # cuesta $0.22/$0.66 por millón de tokens prompt/completion para
      # este modelo, 3-4x más caro que los proveedores más baratos que
      # también lo alojan (OpenInference $0.05/$0.16, Sail Research/
      # Relace $0.065/$0.18) -- es un modelo de pesos abiertos, y varios
      # proveedores de inferencia compiten en precio por alojarlo por
      # debajo de lo que cobra la propia DeepSeek. Sin este campo,
      # OpenRouter enruta por su criterio por defecto (no
      # necesariamente el más barato) -- extra_body.provider.sort=
      # "price" fuerza siempre el proveedor más económico disponible en
      # cada llamada.
      extra_body:
        provider:
          sort: "price"
    # model_info: litellm no tiene en su tabla interna de costes ningún
    # registro para "deepseek/deepseek-v4-flash-0731" -- valores tomados
    # del catálogo real de OpenRouter (GET
    # https://openrouter.ai/api/v1/models). Actualizado 2026-09-02 al
    # precio del proveedor más barato (OpenInference), coherente con
    # provider.sort=price de arriba -- mini-swe-agent usa este mismo
    # fichero, vía .ai-pipeline/litellm_model_registry.json, para
    # calcular coste real por llamada en vez de reportar siempre "$0.00".
    model_info:
      max_input_tokens: 1310720
      max_output_tokens: 1310720
      input_cost_per_token: 0.00000005
      output_cost_per_token: 0.00000016

# drop_params (2026-09-01, pedido por Diego): descarta parámetros que el
# proveedor de destino no soporta en vez de fallar la llamada entera --
# ajuste global de estabilidad, no de coste.
litellm_settings:
  drop_params: true
