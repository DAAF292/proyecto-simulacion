# ==============================================================================
# config/poblacion.yaml
# Población inicial y arquetipos raciales
#
# Parte del catálogo de configuración del motor "Un mundo vivo", antes unificado
# en un único config/constantes.yaml (dividido en ficheros por categoría el
# 2026-08-30, a petición de Diego) -- todos los ficheros de config/*.yaml se
# cargan y fusionan en un solo diccionario (main.py:cargar_configuracion), así
# que ninguna sección cambia de nombre ni de forma de acceso al dividirse.
# ==============================================================================

poblacion:
  gnomos_iniciales: 18
  lobos_iniciales: 6
  conejos_iniciales: 30
  ardillas_iniciales: 30
  caballos_iniciales: 9  # PROVISIONAL -- ver 2026-09-05-especie-caballo-design.md
  venados_iniciales: 10  # PROVISIONAL -- ver 2026-09-09-especie-venado-design.md
  cabras_montesas_iniciales: 8  # PROVISIONAL -- ver 2026-09-09-especie-cabra-montes-design.md (renombrada de cabra_montes a cabra_montesa el 2026-09-10)
  techo_fraccion_edad_inicial_longevidad: 0.7

rangos_raciales:
  gnomo:
    medio_alimentacion: recolectar
    # dieta CORREGIDA 2026-09-08 (ver docs/superpowers/specs/
    # 2026-09-08-sistema-comidas-design.md): la ampliacion del
    # 2026-09-07 (ver CLAUDE.md "Alimentos huerfanos del catalogo
    # ampliado") le daba a gnomo los 13 alimentos completos del
    # catalogo -- Diego: "no tiene sentido que un gnomo coma hierba".
    # Reducida a una dieta de forrajero humanoide plausible: raices
    # (dos claves, un bioma cada una), manzanas, bayas (dos claves), y
    # nectar de semillas. Se cae hierba/fruto_de_cactus/liquen/musgo/
    # bellotas/brotes_helecho/brotes_articos -- siguen existiendo en el
    # mundo para otras especies (ardilla ya come bellotas, conejo/
    # caballo su propio subconjunto), solo dejan de ser comestibles
    # para gnomo. raices y bayas quedan marcadas toxico_crudo en
    # config/flora.yaml -- el mecanismo que activa ese riesgo real
    # (probabilidad de intoxicacion + resistencia_enfermedad) todavia
    # NO existe, se disena junto con "como cocinar" (circulo siguiente
    # del mismo arco) para no introducir un riesgo sin cura.
    dieta: [raices, raices_deserticas, manzanas, bayas_espinosas, bayas_montanas, nectar_semillas]
    peso: [8, 15]
    altura: [0.9, 1.2]
    longevidad: [45, 65]
    # RECALIBRADO 2026-09-08 (ver CLAUDE.md, "raza consciente" --
    # investigacion de gestacion vs. muerte materna): medido con datos
    # frescos que 12 de 18 concepciones de gnomo (67%) fracasaban porque
    # la madre moria antes de completar la gestacion, sin llegar ni a la
    # mitad del termino medio (~5500 ticks) en una corrida que solo
    # alcanzo 4000-4900 ticks. Gestacion baja de 200-260 dias (con
    # diferencia la mas larga del catalogo, 2.3-3.5x el siguiente mas
    # largo -- caballo, 60-90) a 90-120 -- sigue siendo la mas larga con
    # claridad, pero deja de ser una ventana de riesgo casi imposible de
    # sobrevivir. Camada deja de estar fija en 1 (sin ningun colchon
    # posible, a diferencia de cualquier otra especie) y gana un rango
    # pequeno [1, 2], mismo orden que caballo -- mismo patron de dos
    # ingredientes ya validado con lobo/ardilla, aplicado aqui a
    # gestacion/camada en vez de a hambre/concepcion (que ya estaban
    # calibrados). PROVISIONAL, sin calibrar contra el harness completo.
    duracion_gestacion_dias: [90, 120]
    camada: [1, 2]
    fraccion_madurez: 0.1
    # RECALIBRADO 2026-09-06 (investigacion de estabilidad de poblacion,
    # ver CLAUDE.md, config/fisiologia.yaml:necesidades.gnomo y
    # ardilla/lobo para el mismo recetario ya aplicado antes). Gnomo
    # comparte el peor valor del catalogo con lobo (pre-fix) -- misma
    # logica que ya justifico subirlo para lobo/ardilla: nada obliga a
    # que gnomo, ademas de sufrir el peor perfil combinado (gestacion
    # mas larga del catalogo, 200-260 dias, camada fija en 1, SIN
    # compensacion de camada posible a diferencia de lobo/ardilla),
    # mantenga tambien la tasa de concepcion mas baja. PROVISIONAL, sin
    # calibrar contra el harness completo -- a diferencia de lobo/
    # ardilla, la gestacion de gnomo (4800-6240 ticks) es comparable a
    # la ventana de verificacion entera (6000-8000 ticks), asi que el
    # efecto de subir solo la concepcion podria ser mas limitado aqui
    # (una madre preñada sigue necesitando sobrevivir toda la gestacion,
    # sin ningun colchon de camada) -- verificar contra el motor real
    # antes de dar esto por suficiente.
    factor_base_concepcion: 0.015
    # puntos_agarre (2026-08-31, conversación de diseño con Diego --
    # "capacidad de sostener/usar" como cimiento de sociedad: un palo o
    # una roca para defenderse, luego fuego, luego herramientas). Cuántos
    # objetos puede sujetar A LA VEZ esta especie -- hecho anatómico
    # FIJO por especie (a diferencia de fuerza/agilidad, no varía
    # razonablemente entre individuos), mismo criterio que
    # fraccion_madurez/factor_base_concepcion arriba: valor único, no
    # rango [min,max]. No es exclusivo de gnomo -- cualquier especie con
    # algún medio de sujeción física lo tiene (lobo con la boca, ardilla
    # con las patas delanteras), es una capacidad de la criatura como
    # caminar o comer, no un privilegio de la consciencia. Ver
    # componentes/agarre.py. PROVISIONAL, valores razonados por especie,
    # sin calibrar contra el motor en marcha.
    puntos_agarre: 2  # dos manos
    fuerza: [0.2, 0.5]
    agilidad: [0.3, 0.7]
    velocidad: [0.2, 0.5]
    resistencia_enfermedad: [0.3, 0.6]
    agudeza_sensorial: [0.3, 0.6]
    vitalidad_maxima: [0.4, 0.7]
    resistencia_maxima: [0.4, 0.7]
    curacion: [0.005, 0.015]
    recuperacion: [0.05, 0.10]
    valentia: [0.2, 0.6]
    sociabilidad: [0.4, 0.9]
    agresividad: [0.1, 0.4]
    dominancia: [0.2, 0.6]
    empatia: [0.4, 0.8]
    lealtad: [0.4, 0.8]
    fe: [0.3, 0.7]
    curiosidad: [0.4, 0.8]
    inteligencia: [0.4, 0.8]
    memoria: [0.4, 0.8]
    voluntad: [0.3, 0.7]
    resiliencia: [0.3, 0.7]
    estabilidad_mental_maxima: [0.4, 0.7]
    consciencia: [0.6, 0.9]

  lobo:
    medio_alimentacion: cazar
    peso: [60, 90]
    altura: [0.6, 0.9]
    longevidad: [8, 14]
    duracion_gestacion_dias: [60, 75]
    camada: [4, 6]
    fraccion_madurez: 0.2
    # RECALIBRADO 2026-09-05 (investigacion de fragilidad de lobo, ver
    # CLAUDE.md). Compartia 0.0033 con gnomo -- el peor valor del
    # catalogo -- pese a NO compartir su perfil reproductivo: gnomo tiene
    # gestacion larguisima y camada fija en 1 (necesita una tasa de
    # concepcion baja porque cada intento ya es muy costoso de por si);
    # lobo tiene gestacion corta (60-75 dias) y camada grande (4-6), un
    # perfil de r-estratega que la tasa baja nunca llego a aprovechar --
    # probablemente un valor heredado sin revisar, no una decision
    # deliberada. Medido contra el motor real (12 semillas x 8000 ticks,
    # ya con la mitigacion de inanicion de abajo aplicada): subir a 0.015
    # (x4.5) bajo la extincion de lobo de 12/12 a 8/12, con poblacion
    # final media de 0.0 a 1.33 (una semilla llego a 11 individuos, una
    # poblacion real sostenida, no solo un superviviente aislado). Probar
    # 0.03 (x9) no mejoro mas alla del ruido (tambien 8/12, media 1.08) --
    # rendimientos decrecientes, se descarta como sobre-ajuste
    # innecesario. PROVISIONAL, sin calibrar contra el harness completo
    # -- mejora real y medida, NO una solucion completa (sigue habiendo
    # extincion en 8 de 12 semillas nuevas).
    factor_base_concepcion: 0.015
    puntos_agarre: 1  # boca
    fuerza: [0.5, 0.9]
    agilidad: [0.5, 0.9]
    velocidad: [0.5, 0.9]
    resistencia_enfermedad: [0.4, 0.7]
    agudeza_sensorial: [0.5, 0.8]
    vitalidad_maxima: [0.6, 0.9]
    resistencia_maxima: [0.6, 0.9]
    curacion: [0.01, 0.02]
    recuperacion: [0.08, 0.15]
    valentia: [0.5, 0.9]
    sociabilidad: [0.3, 0.7]
    agresividad: [0.5, 0.9]
    dominancia: [0.4, 0.8]
    empatia: [0.2, 0.5]
    lealtad: [0.5, 0.9]
    fe: [0.0, 0.3]
    curiosidad: [0.2, 0.5]
    inteligencia: [0.2, 0.5]
    memoria: [0.3, 0.6]
    voluntad: [0.2, 0.5]
    resiliencia: [0.4, 0.7]
    estabilidad_mental_maxima: [0.5, 0.8]
    consciencia: [0.0, 0.2]

  conejo:
    medio_alimentacion: recolectar
    # colonial (2026-09-07, ver nucleo/manada.py y spec
    # docs/superpowers/specs/2026-09-07-manada-fauna-design.md): unica
    # especie con madriguera compartida -- los miembros de una misma
    # manada sincronizan su memoria de "refugio" por voto de mayoria en
    # vez de recordar cada uno su propio sitio de forma independiente.
    # Mismo patron categorico que medio_alimentacion (rasgo fisico real
    # de la especie, no autoria de un suceso concreto). PROVISIONAL.
    tipo_refugio_fauna: colonial
    # capacidad_madriguera (2026-09-07, circulo A de "madriguera fisica"
    # -- ver docs/superpowers/specs/2026-09-07-madriguera-fisica-a-design.md):
    # sorteada UNA VEZ al crearse la Madriguera fisica, nunca se vuelve a
    # sortear. PROVISIONAL -- lejos de "200 conejos en una", pensada para
    # forzar a que se repartan en varias comunidades conforme crece la
    # poblacion.
    capacidad_madriguera: [10, 25]
    # dieta ampliada (2026-09-07): nectar_semillas y bayas_espinosas son
    # ambos recursos de pradera (flor_silvestre/arbusto_espinoso, catalogo
    # ampliado 2026-09-03) -- un herbivoro generalista de pradera real
    # como el conejo ramonea semillas/brotes y baya de arbusto bajo, con
    # o sin espinas.
    dieta: [hierba, raices, nectar_semillas, bayas_espinosas]
    peso: [1.5, 3.0]
    altura: [0.2, 0.3]
    longevidad: [1, 3]
    duracion_gestacion_dias: [15, 25]
    # camada REBAJADA 2026-09-06 (de [3, 7] a [3, 5]), y de nuevo
    # 2026-09-08 (de [3, 5] a [2, 3] -- ver CLAUDE.md "raza consciente
    # prospera", seccion de conejo): el primer recorte no bastaba --
    # medido con trayectoria real (3 semillas nuevas x hasta 8000 ticks)
    # tras cerrar los fixes de gnomo, conejo seguia mostrando
    # crecimiento sin techo real en al menos 1 de 3 semillas (30->933
    # sin bust dentro de la ventana), y en las otras dos el "bust" se
    # estabilizaba muy por encima del rango historico sano
    # (0.05-0.07 ind/celda). Deshidratacion y vejez, casi a la par,
    # como causas dominantes de muerte -- confirma que el alivio de
    # hambre de conejo (2026-09-06) le quito su freno natural principal
    # sin una compensacion reproductiva suficiente.
    #
    # HONESTIDAD SOBRE EL RESULTADO REAL (2026-09-08, mismo dia): este
    # recorte (junto a factor_base_concepcion de abajo) NO es una
    # solucion limpia -- es un trade-off aceptado explicitamente por
    # Diego tras medir 11 semillas nuevas en total con varias
    # combinaciones. Con estos valores exactos: 2 de 7 semillas nuevas
    # (~29%) llevan a conejo a la EXTINCION total (algo que
    # practicamente nunca pasaba antes de tocar nada), a cambio de que
    # la mayoria de las demas queden acotadas en un rango sano sin
    # explosion descontrolada. Un intento de suavizar la concepcion
    # (0.008->0.010) para reducir el riesgo de extincion NO mejoro el
    # resultado (2 de 4 semillas nuevas se extinguieron igual) --
    # evidencia de que el sistema es mas caotico de lo que unas pocas
    # semillas por combinacion pueden calibrar con confianza (cambiar
    # estos numeros desplaza toda la secuencia de rng posterior, mismo
    # fenomeno ya documentado repetidas veces en este proyecto). El
    # harness completo (15 semillas x 12000 ticks, pendiente desde
    # "Sobrepoblacion...") sigue siendo la unica via real de calibrar
    # esto sin ruido -- PROVISIONAL, aceptado con esta limitacion
    # conocida en vez de seguir iterando sin presupuesto claro.
    # camada -- intento de restaurarla a [2,4] el 2026-09-09 REVERTIDO el
    # mismo dia (auditoria de estabilizacion, ver CLAUDE.md). El harness
    # completo de 15x12000 midio 47% de extincion real de conejo -- peor
    # que el ~29% estimado con solo 7 semillas el 2026-09-06, cuando se
    # recorto este valor de [3,7] a [2,3]. A/B real: aliviar SOLO la
    # deshidratacion especifica de conejo (fisiologia.yaml, mismo par que
    # gnomo/ardilla/lobo) NO redujo la extincion (seguia en 1/6) --
    # confirmo que el recorte de fecundidad de 2026-09-06 se paso de
    # frenada para el contexto actual. Receta de dos ingredientes de
    # nuevo (mismo patron que lobo/gnomo/ardilla): alivio de
    # deshidratacion + camada [2,3]->[2,4] + concepcion 0.008->0.010,
    # verificada en A/B aislado (0/6 extincion) y comprobada CON los
    # otros dos fixes de esta misma auditoria ya en disco (verificacion
    # combinada, 8 semillas x 8000 ticks): elimino la extincion (0/8)
    # pero disparo la magnitud a 691 individuos -- peor que el peor caso
    # historico sin tocar nada (394). Revertido SOLO este campo a [2,3]
    # (concepcion 0.010 e hidratacion aliviada se quedan, ver abajo y
    # fisiologia.yaml) -- mismo diagnostico que ya se confirmo con
    # ardilla en esta misma auditoria: camada pesa mas que concepcion a
    # la hora de controlar el techo de explosion, asi que revertir solo
    # la camada (no el paquete completo) es la correccion quirurgica.
    # PROVISIONAL, sin calibrar contra el harness completo con este
    # cambio ya aplicado.
    camada: [2, 3]
    fraccion_madurez: 0.3
    # factor_base_concepcion SUBIDA PARCIALMENTE 2026-09-09 -- ver
    # comentario de camada arriba, misma investigacion. De 0.008 (REBAJADA
    # 2026-09-08) a 0.010 -- ni el 0.015 original, ni el 0.008 que dejaba
    # 47% de extincion real en el harness completo. Sigue por debajo del
    # resto del catalogo ya recalibrado (0.015 en gnomo/lobo/caballo,
    # 0.022 seria el equivalente de ardilla) -- conejo compensa con
    # camada mayor y gestacion mucho mas corta, no necesita la misma
    # concepcion que las demas.
    factor_base_concepcion: 0.010
    # 0: un conejo real no sujeta objetos de forma activa (a diferencia
    # de una ardilla) -- el más incierto de los cuatro, abierto a
    # corrección de Diego si no encaja con lo que tenía en mente.
    puntos_agarre: 0
    fuerza: [0.1, 0.3]
    agilidad: [0.6, 0.9]
    velocidad: [0.5, 0.8]
    resistencia_enfermedad: [0.2, 0.4]
    agudeza_sensorial: [0.5, 0.8]
    vitalidad_maxima: [0.2, 0.4]
    resistencia_maxima: [0.3, 0.5]
    curacion: [0.01, 0.02]
    recuperacion: [0.08, 0.15]
    valentia: [0.2, 0.45]
    sociabilidad: [0.5, 0.9]
    agresividad: [0.05, 0.2]
    dominancia: [0.1, 0.3]
    empatia: [0.3, 0.6]
    lealtad: [0.3, 0.6]
    fe: [0.0, 0.1]
    curiosidad: [0.2, 0.5]
    inteligencia: [0.1, 0.3]
    memoria: [0.2, 0.5]
    voluntad: [0.1, 0.3]
    resiliencia: [0.3, 0.6]
    estabilidad_mental_maxima: [0.4, 0.6]
    consciencia: [0.0, 0.1]

  ardilla:
    medio_alimentacion: recolectar
    # dieta ampliada (2026-09-07): bellotas (roble, catalogo ampliado
    # 2026-09-03) es la pareja mas obvia posible para una ardilla real --
    # sin bellotas, todo un arbol nuevo del bioma de ardilla era
    # nutricionalmente invisible para ella. Verificado contra el motor
    # real (ver CLAUDE.md "Investigacion de ardilla"): sin efecto
    # medible en supervivencia (inanicion nunca fue su cuello de botella),
    # pero se mantiene por ser la asignacion biologicamente correcta, no
    # por esperar de ella un efecto de estabilidad. brotes_helecho
    # (helecho, mismo bioma) queda fuera a proposito -- una ardilla real
    # no se alimenta de brotes de helecho.
    dieta: [manzanas, raices, bellotas]
    peso: [0.3, 0.6]
    altura: [0.15, 0.25]
    longevidad: [2, 5]
    duracion_gestacion_dias: [18, 28]
    # camada RECORTADA 2026-09-09 (auditoria de estabilizacion, ver
    # CLAUDE.md y herramientas/harness_calibracion.py -- el harness
    # completo de 15x12000 revelo poblacion final media de 232 con
    # maximos de 701, sin ningun indicio de nivelarse en la trayectoria
    # -- la trayectoria crece de forma sostenida hasta el ultimo tick
    # medido en 10 de 15 semillas). A/B real antes de aplicar: recortar
    # SOLO factor_base_concepcion (0.03->0.022, ver abajo) aislado apenas
    # freno la explosion (poblaciones hasta 690 en 6 semillas nuevas);
    # recortar SOLO camada (4->3, este cambio) aislado fue el lever mas
    # eficaz de los dos probados por separado (poblaciones 4-258, techo
    # bastante mas bajo, 0/6 extincion -- sin el riesgo de sobrecorreccion
    # que si aparecio al recortar concepcion+camada juntos y de golpe en
    # un primer intento, que crasho la poblacion a 0-24 individuos).
    # Sigue por encima de la referencia sana historica (~0.05-0.07
    # ind/celda, ~80-112 individuos) en el extremo alto de la muestra --
    # mejora real, NO una solucion cerrada. PROVISIONAL, sin calibrar
    # contra el harness completo con este cambio ya aplicado.
    camada: [2, 3]
    fraccion_madurez: 0.4
    # RECALIBRADO 2026-09-06 (investigacion de estabilidad de poblacion,
    # ver CLAUDE.md y config/fisiologia.yaml:necesidades.ardilla para el
    # hallazgo completo). Subir esto SOLO (x2.24, igualando a conejo, o
    # x4.5) no tuvo ningun efecto medible en solitario -- ardilla seguia
    # extinguiendose al 100%. Combinado con la mitigacion de hambre letal
    # de fisiologia.yaml (nunca antes probadas juntas), 3 de 3 semillas
    # de verificacion dieron poblacion real y sostenida. PROVISIONAL, sin
    # calibrar contra el harness completo.
    factor_base_concepcion: 0.03
    puntos_agarre: 2  # patas delanteras
    fuerza: [0.05, 0.2]
    agilidad: [0.7, 0.95]
    velocidad: [0.5, 0.85]
    resistencia_enfermedad: [0.2, 0.4]
    agudeza_sensorial: [0.5, 0.8]
    vitalidad_maxima: [0.15, 0.3]
    resistencia_maxima: [0.25, 0.45]
    curacion: [0.01, 0.02]
    recuperacion: [0.08, 0.15]
    valentia: [0.2, 0.45]
    sociabilidad: [0.3, 0.6]
    agresividad: [0.05, 0.2]
    dominancia: [0.1, 0.3]
    empatia: [0.2, 0.5]
    lealtad: [0.2, 0.5]
    fe: [0.0, 0.1]
    curiosidad: [0.4, 0.8]
    inteligencia: [0.15, 0.35]
    memoria: [0.25, 0.55]
    voluntad: [0.1, 0.3]
    resiliencia: [0.3, 0.6]
    estabilidad_mental_maxima: [0.4, 0.6]
    consciencia: [0.0, 0.1]

  # CABALLO (2026-09-05, ver docs/superpowers/specs/
  # 2026-09-05-especie-caballo-design.md): herbivoro grande de pradera,
  # presa sostenible de lobo por ratio de masa favorable en la formula
  # de saciedad por captura (sistema_depredacion.py). Todo PROVISIONAL,
  # sin calibrar contra el harness completo.
  caballo:
    medio_alimentacion: recolectar
    # dieta ampliada (2026-09-07): nectar_semillas (flor_silvestre,
    # pradera, catalogo ampliado 2026-09-03) es un ramoneo blando
    # plausible para un pastoreador de pradera real. bayas_espinosas
    # (arbusto_espinoso, mismo bioma) queda fuera a proposito -- un
    # caballo real evita el ramoneo espinoso, a diferencia de conejo.
    dieta: [hierba, raices, nectar_semillas]
    peso: [400, 500]
    altura: [1.4, 1.8]
    longevidad: [15, 25]
    # Gestacion deliberadamente corta frente a los ~340 dias de un
    # caballo real -- decision de sostenibilidad: la misma combinacion
    # de gestacion larga + cria unica ya causa el colapso reproductivo
    # de gnomo bajo el riesgo de fondo medido hoy.
    duracion_gestacion_dias: [60, 90]
    camada: [1, 2]
    fraccion_madurez: 0.2
    # RECALIBRADO 2026-09-07 (investigacion de estabilidad de poblacion,
    # ver CLAUDE.md). 0.005 era la tasa de concepcion mas baja de TODO el
    # catalogo -- mas baja incluso que gnomo antes de su propio fix
    # (0.0033->0.015) -- pese a que caballo tiene gestacion corta (60-90
    # dias) y camada de hasta 2, un perfil mas cercano al de lobo/gnomo
    # ya recalibrados que al peor caso que justificaba un valor tan bajo.
    # Subido al mismo 0.015 que gnomo/lobo, combinado con el alivio de
    # hambre nuevo en fisiologia.yaml:necesidades.caballo -- ver CLAUDE.md
    # para el resultado real medido tras aplicar ambos juntos.
    # PROVISIONAL, sin calibrar contra el harness completo.
    factor_base_concepcion: 0.015
    puntos_agarre: 0  # un caballo no sujeta objetos
    fuerza: [0.6, 0.9]
    agilidad: [0.4, 0.7]
    velocidad: [0.4, 0.7]
    resistencia_enfermedad: [0.3, 0.6]
