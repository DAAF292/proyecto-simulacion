# ==============================================================================
# config/clima.yaml
# Bioma, estaciones, clima diario y desastres naturales
#
# Parte del catálogo de configuración del motor "Un mundo vivo", antes unificado
# en un único config/constantes.yaml (dividido en ficheros por categoría el
# 2026-08-30, a petición de Diego) -- todos los ficheros de config/*.yaml se
# cargan y fusionan en un solo diccionario (main.py:cargar_configuracion), así
# que ninguna sección cambia de nombre ni de forma de acceso al dividirse.
# ==============================================================================

bioma:
  # RECALIBRADO (2026-08-29, auditoria de funcionalidades, tercera
  # edicion, confirmado con Diego). La calibracion anterior (2026-08-27,
  # umbrales 0.47/0.25/0.24/0.62) nunca llego a revalidarse "tras jugar
  # con estos mundos" como decia su propio comentario: medida despues
  # contra el generador causal real, producia desierto practicamente
  # inexistente (0.35-0.44% de las celdas, objetivo ~5%) y tundra muy por
  # encima del objetivo (13-14%, objetivo ~3%) -- confirmado en 40
  # semillas fuera de muestra, no una unica medicion.
  #
  # Metodo de esta recalibracion: emparejamiento de cuantiles SECUENCIAL,
  # replicando el propio orden de evaluacion del arbol de decision de
  # nucleo/bioma.py (tundra por temperatura primero, luego montana por
  # elevacion sobre lo que queda, luego desierto/bosque por lluvia sobre
  # lo que queda de eso) -- no cuantiles marginales independientes, que
  # habrian ignorado que temperatura/elevacion/lluvia estan correlacionadas
  # entre si (todas derivan del mismo proceso causal orografico). Cada
  # umbral se fija en el percentil empirico exacto, dentro del subconjunto
  # de celdas que le llega, que produce la proporcion objetivo:
  # umbral_temperatura_tundra al percentil 3 de temperatura (todas las
  # celdas); umbral_elevacion_montana al percentil que deja 10/(1-0.03)
  # de las celdas no-tundra por encima; umbral_lluvia_desierto/bosque
  # analogos sobre las celdas que van quedando. Calibrado con 40 semillas
  # (mapa 40x40, 64000 celdas) y VALIDADO contra 40 semillas disjuntas,
  # nunca vistas en la calibracion (proporciones resultantes: pradera
  # 54.9%, bosque 26.0%, montana 11.8%, desierto 4.7%, tundra 2.6% --
  # frente al objetivo pradera~57/bosque~25/montana~10/desierto~5/
  # tundra~3, todas las cifras dentro de ~2 puntos porcentuales).
  #
  # PROVISIONAL igual que antes: valida la PROPORCION de biomas contra
  # el generador de terreno, no el efecto sobre poblacion/supervivencia
  # con el harness completo (15 semillas x 12000 ticks) -- ese efecto
  # sigue sin observarse.
  umbral_elevacion_montana: 0.6665
  umbral_temperatura_tundra: 0.1346
  umbral_lluvia_desierto: 0.3909
  umbral_lluvia_bosque: 0.6041

estaciones:
  # RECALIBRADO 2026-09-18 (ver docs/superpowers/specs/
  # 2026-09-18-confort-termico-bipolar-design.md): objetivo_confort_termico
  # deja de ser monotono ("mas alto = mejor", verano=0.8 el mejor,
  # invierno=0.15 el peor) y pasa a ser BIPOLAR -- 0.5 es el ideal, los
  # dos extremos (0.0 y 1.0) son igual de malos (hipotermia / golpe de
  # calor). Cada estacion por si sola queda moderada (a +-0.15 del ideal,
  # simetrico entre verano/invierno) -- ningun extremo real se alcanza
  # sin un evento de clima.efectos raro (ola_calor/ventisca) encima.
  # PROVISIONAL, sin calibrar contra el motor en marcha.
  primavera:
    modificador_regeneracion: 1.0
    objetivo_confort_termico: 0.5
  verano:
    modificador_regeneracion: 1.2
    objetivo_confort_termico: 0.65
  otono:
    modificador_regeneracion: 0.9
    objetivo_confort_termico: 0.45
  invierno:
    modificador_regeneracion: 0.5
    objetivo_confort_termico: 0.35

clima:
  # ola_calor/ventisca (2026-09-18): deliberadamente restringidos a UNA
  # sola estacion cada uno (verano / invierno respectivamente) -- no se
  # reparten tambien a estaciones limitrofes en este primer circulo, mas
  # simple y auditable; ampliar la ventana estacional es una calibracion
  # futura, no una suposicion de partida. sortear_clima() (nucleo/clima.py)
  # no necesita ningun cambio de logica -- ya itera solo las claves
  # presentes en la tabla de cada estacion.
  probabilidades_por_estacion:
    primavera: {despejado: 0.5, lluvioso: 0.45, tormenta: 0.05}
    verano: {despejado: 0.65, lluvioso: 0.15, tormenta: 0.05, ola_calor: 0.15}
    otono: {despejado: 0.4, lluvioso: 0.5, tormenta: 0.1}
    invierno: {despejado: 0.4, lluvioso: 0.3, tormenta: 0.1, ventisca: 0.2}
  efectos:
    despejado:
      # ajuste_confort RECALIBRADO 2026-09-18: antes +0.05 (bajo el
      # modelo monotono, despejado siempre era "el clima bueno") -- bajo
      # el modelo bipolar, un dia despejado no es intrinsecamente mejor
      # que uno nublado, es simplemente neutro.
      ajuste_confort: 0.0
      modificador_regeneracion: 1.0
      tasa_generacion_charco_por_tick: 0.0
    lluvioso:
      ajuste_confort: -0.05
      modificador_regeneracion: 1.15
      tasa_generacion_charco_por_tick: 0.003
    tormenta:
      ajuste_confort: -0.1
      modificador_regeneracion: 0.9
      tasa_generacion_charco_por_tick: 0.01
    # ola_calor/ventisca (2026-09-18): los unicos dos climas cuyo
    # ajuste_confort por si solo, sumado a la estacion correspondiente,
    # puede acercar de verdad a un umbral de mortalidad termica (ver
    # config/fisiologia.yaml) -- sin refugio/sombra que lo compense.
    # PROVISIONAL, sin calibrar contra el motor en marcha.
    ola_calor:
      ajuste_confort: 0.35
      modificador_regeneracion: 1.1
      tasa_generacion_charco_por_tick: 0.0
    ventisca:
      ajuste_confort: -0.35
      modificador_regeneracion: 0.3
      tasa_generacion_charco_por_tick: 0.0

desastres:
  prob_ignicion_base_bosque: 0.0015
  multiplicador_riesgo_por_clima:
    despejado: 1.5
    lluvioso: 0.2
    tormenta: 1.0
    # ola_calor/ventisca (2026-09-18): sequedad extrema dispara el
    # riesgo de ignicion muy por encima de un dia despejado normal;
    # ventisca lo casi anula (nieve/humedad). PROVISIONAL.
    ola_calor: 2.5
    ventisca: 0.05
  prob_propagacion_por_tick: 0.08
  prob_extincion_por_tick: 0.35
  dano_por_tick_en_llamas: 0.15
  aporte_ceniza_planta: 0.15
  fraccion_masa_seca_quemada: 0.20
  fraccion_agua_tisular_quemada: 0.05
  tasa_putrefaccion_calcinada: 0.15
