# ==============================================================================
# config/materiales.yaml
# Catálogo de materiales físicos
#
# Parte del catálogo de configuración del motor "Un mundo vivo", antes unificado
# en un único config/constantes.yaml (dividido en ficheros por categoría el
# 2026-08-30) -- todos los ficheros de config/*.yaml se cargan y fusionan en un
# solo diccionario (main.py:cargar_configuracion).
# ==============================================================================

# BORRADOR (2026-08-30, primera pasada -- diseño en curso con Diego, NO
# confirmado todavía, no tiene ningún consumidor mecánico en el motor
# hasta hoy). Ver conversación de diseño 2026-08-30 y CLAUDE.md para el
# contexto completo: Diego pidió una capa de materiales real ("variedad
# suficiente... poder crear estructuras de distintos materiales, un
# sistema de minería complejo, recursos naturales para elaborar
# herramientas... la madera, la hierba seca como combustible, los huesos
# de los cadáveres, las semillas"), no una propiedad auxiliar pensada solo
# para calibrar charcos.
#
# ESQUEMA (mismo patrón que flora.especies/rangos_raciales: diccionario de
# entradas, cada propiedad leída con .get(clave, default) por su
# consumidor -- añadir un material nuevo o una propiedad nueva más
# adelante no exige tocar nada existente):
#
#   categoria: mineral | organico_vegetal | organico_animal
#   forma_en_mundo: sustrato | deposito
#     sustrato = capa de la propia Celda (como el bioma), estático,
#       encontrado allí donde el terreno lo generó -- piedra/arcilla/
#       arena/suelo_helado (círculo 1) e hierro/cobre (vetas, futuro).
#     deposito = cantidad de material en una posición, con estado propio
#       que decae -- generado por un evento del ciclo de vida (un árbol
#       destruido deposita madera, un cadáver descompuesto deposita
#       hueso). Mismo patrón que ya usa Necromasa hoy; ver conversación
#       de diseño para la propuesta de generalizarla.
#   densidad_kg_m3: densidad real aproximada -- unidad física real, mismo
#     criterio que profundidad_agua/peso (metros/kg reales en vez de
#     escala normalizada), para que un material se pueda comparar con
#     otro con un número que significa algo fuera del motor.
#   dureza [0,1]: resistencia a ser trabajado, extraído o roto. Sin
#     consumidor todavía -- declarado con intención para cuando exista
#     minería/construcción/herramientas, mismo criterio que tipo_agua
#     (rio/lago/poza) cuando se introdujo sin consumidor.
#   tasa_infiltracion [0,1]: qué tan rápido penetra el agua de lluvia en
#     el material. CONSUMIDOR INMEDIATO (círculo 1, el motivo que abrió
#     esta conversación): con tasa_infiltracion baja, el agua no penetra
#     lo bastante rápido y se acumula en superficie como charco visible
#     enseguida; con tasa_infiltracion alta, el agua se filtra hacia
#     dentro tan rápido como cae y prácticamente no encharca nunca.
#   capacidad_retencion [0,1]: cuánta agua puede alojar el material como
#     humedad de subsuelo UNA VEZ que penetra (la "memoria hídrica
#     profunda" que pedía Diego). Consumidor inmediato junto con
#     tasa_infiltracion.
#   combustibilidad [0,1]: facilidad de arder. Sin consumidor todavía --
#     sustituirá el hardcode actual de sistema_desastres.py ("único bioma
#     inflamable es Bosque") cuando se construya ese círculo.
#   tasa_descomposicion_dia [0,1] o ausente: fracción del material que se
#     degrada por día de exposición a la intemperie. Ausente en
#     materiales minerales/sustrato (geológicamente estables a la escala
#     de tiempo del motor, no hay mecánica de erosión). Presente en
#     materiales orgánicos -- sin consumidor todavía salvo donde ya se
#     indica lo contrario.
#
# CORRECCIÓN FÍSICA IMPORTANTE (2026-08-30, encontrada al calcular estos
# valores, no antes): en la conversación de diseño previa a este fichero
# describí la arcilla como la que "absorbe mucho antes de que aparezca
# charco" -- es EXACTAMENTE AL REVÉS. La propiedad relevante para que
# aparezca un charco en SUPERFICIE es la velocidad de infiltración, no la
# capacidad de retención total: la arcilla real tiene infiltración BAJA
# (el agua no penetra rápido) y por eso encharca en superficie tras
# lluvia sostenida (un charco de barro es literalmente esto), pese a que
# retiene mucha agua una vez que sí penetra. La arena real tiene
# infiltración ALTA -- el agua se filtra tan rápido como cae -- y por eso
# prácticamente nunca encharca en superficie, aunque retenga poca agua a
# largo plazo. Separar tasa_infiltracion de capacidad_retencion (en vez
# de una única "permeabilidad" como se planteó de palabra) es la
# corrección directa de ese error -- mismo patrón que este proyecto ya ha
# encontrado varias veces ("esto parecía correcto sobre el papel"): vejez,
# purga de memoria, sobrepoblación.
#
# CÍRCULO 1 IMPLEMENTADO (2026-08-30): tasa_infiltracion/capacidad_retencion
# ya alimentan sistema_recursos.py:_actualizar_charcos (charco de superficie
# vs. Celda.humedad_subsuelo) y nucleo/flora.py:factor_humedad_subsuelo
# (bono de producción vegetal, sustituye al antiguo factor_ribera). La
# generación de charco también depende de la pendiente local del terreno
# (nucleo/agua.py:pendiente_local/fraccion_escurrida_por_pendiente,
# umbrales en config/hidrologia.yaml sección charcos) -- un material
# impermeable en terreno muy inclinado tampoco encharca, el agua escurre
# antes de acumularse.
#
# "semilla" QUEDA FUERA de este catálogo (confirmado con Diego,
# 2026-08-30): no es un material físico con dureza/combustibilidad/
# densidad relevantes para construcción o minería, es un objeto
# reproductivo de flora. Aparcado explícitamente para cuando se plantee
# agricultura (Diego: "a futuro será un recurso necesario cuando
# planteemos la agricultura") -- merecerá su propio esquema ligado a
# sistema_flora.py, no una entrada forzada aquí.

materiales:
  # --- Sustrato de terreno (círculo 1: agua) -----------------------------
  piedra:
    categoria: mineral
    forma_en_mundo: sustrato
    densidad_kg_m3: 2700
    dureza: 0.9
    tasa_infiltracion: 0.05
    capacidad_retencion: 0.05
    combustibilidad: 0.0
    apto_construccion: true
    # apto_arma (2026-09-01, primer círculo del arco herramientas/
    # utensilios/armas): una piedra tallada como hacha de mano.
    apto_arma: true
  arcilla:
    categoria: mineral
    forma_en_mundo: sustrato
    densidad_kg_m3: 1800
    dureza: 0.2
    tasa_infiltracion: 0.15
    capacidad_retencion: 0.8
    combustibilidad: 0.0
    apto_construccion: true
  arena:
    categoria: mineral
    forma_en_mundo: sustrato
    densidad_kg_m3: 1600
    dureza: 0.05
    tasa_infiltracion: 0.85
    capacidad_retencion: 0.15
    combustibilidad: 0.0
    apto_construccion: false
  tierra:
    # CORREGIDO (2026-08-30, Diego: "suelo helado que es? eso no es nada
    # real"): la primera versión de esta entrada era "suelo_helado" --
    # confundía la COMPOSICIÓN del sustrato con un ESTADO climático (si
    # está congelado o no, algo que Celda.temperatura ya comunica por sí
    # sola, es literalmente lo que hace a una celda tundra en primer
    # lugar). Sustrato de tundra: tierra genérica, suelo pobre y suelto --
    # mucha menos capacidad de retención y dureza que la arcilla fértil de
    # bosque/pradera, sin ninguna referencia a temperatura en el material.
    categoria: mineral
    forma_en_mundo: sustrato
    densidad_kg_m3: 1300
    dureza: 0.15
    tasa_infiltracion: 0.4
    capacidad_retencion: 0.35
    combustibilidad: 0.0
    apto_construccion: true

  # --- Depósitos orgánicos (círculos posteriores) ------------------------
  # madera y fibra REUTILIZAN los nombres ya declarados en config/flora.yaml
  # (manzano.recursos / cactus.recursos, categoria: material, sin
  # consumidor mecánico desde que se escribieron) -- mismo material, no un
  # concepto paralelo.
  madera:
    categoria: organico_vegetal
    forma_en_mundo: deposito
    densidad_kg_m3: 700
    dureza: 0.45
    combustibilidad: 0.55
    tasa_descomposicion_dia: 0.01
    apto_construccion: true
    # apto_arma (2026-09-01, primer círculo del arco herramientas/
    # utensilios/armas): una lanza tallada de un palo de madera.
    apto_arma: true
  fibra:
    categoria: organico_vegetal
    forma_en_mundo: deposito
    densidad_kg_m3: 150
    dureza: 0.1
    combustibilidad: 0.5
    tasa_descomposicion_dia: 0.015
    apto_construccion: true
  hierba_seca:
    categoria: organico_vegetal
    forma_en_mundo: deposito
    densidad_kg_m3: 100
    dureza: 0.05
    # El material más inflamable del catálogo a propósito -- yesca real.
    combustibilidad: 0.85
    tasa_descomposicion_dia: 0.03
    # apto_construccion (2026-08-30, refugio construido): techo de paja,
    # el propio ejemplo de Diego para un refugio primitivo -- "algo como
    # un habitáculo de madera con un techo de paja".
    apto_construccion: true
  hueso:
    categoria: organico_animal
    forma_en_mundo: deposito
    densidad_kg_m3: 1900
    dureza: 0.55
    combustibilidad: 0.1
    # Un orden de magnitud más lento que tejido_blando (0.08/día, ver
    # abajo) -- es precisamente lo que permite que el hueso persista como
    # resto tangible tras la muerte en vez de mineralizarse por completo
    # a la vez que la carne. CÍRCULO 2 IMPLEMENTADO (2026-08-30, ver
    # componentes/necromasa.py:Necromasa.masas y
    # sistemas/sistema_descomposicion.py): un cadáver ya no es una única
    # masa homogénea, se reparte entre tejido_blando y hueso, cada uno con
    # su propia tasa de descomposición.
    tasa_descomposicion_dia: 0.002
    apto_construccion: false
  tejido_blando:
    # CÍRCULO 2 (2026-08-30): la otra mitad de un cadáver -- la parte que
    # SÍ se descompone rápido y realimenta la fertilidad del suelo, mismo
    # comportamiento que tenía la antigua Necromasa.masa_organica única
    # (tasa_descomposicion_dia = 0.08, el mismo valor que antes vivía como
    # descomposicion.constante_degradacion_base -- ancla de continuidad).
    categoria: organico_animal
    forma_en_mundo: deposito
    densidad_kg_m3: 1050
    dureza: 0.05
    combustibilidad: 0.1
    tasa_descomposicion_dia: 0.08
    apto_construccion: false

  # --- Minerales (círculo de minería, muy posterior) ----------------------
  # abundancia [0,1]: sin consumidor todavía -- declarado con intención
  # para cuando exista generación de vetas (más común el hierro que el
  # cobre, orden de magnitud real, no una cifra medida).
  hierro:
    categoria: mineral
    forma_en_mundo: sustrato
    densidad_kg_m3: 5000
    dureza: 0.85
    combustibilidad: 0.0
    abundancia: 0.6
    apto_construccion: true
  cobre:
    categoria: mineral
    forma_en_mundo: sustrato
    densidad_kg_m3: 4000
    dureza: 0.75
    combustibilidad: 0.0
    abundancia: 0.35
    apto_construccion: true

# --- Sustrato por bioma (círculo 1) ---------------------------------------
# Qué material de la lista de arriba ocupa cada bioma -- consumido en
# generación (nucleo/zona_bioma.py) para fijar Celda.tipo_sustrato. Bosque
# y pradera comparten arcilla a propósito (vega fértil, mismo criterio que
# ya comparten textura de terreno en el visor histórico) -- montaña,
# desierto y tundra tienen cada una la suya. Hierro/cobre NO aparecen
# aquí: no son el material BASE de ningún bioma entero, son vetas
# localizadas dentro de piedra -- ver generacion_vetas más abajo.
sustrato_por_bioma:
  montana: piedra
  bosque: arcilla
  pradera: arcilla
  desierto: arena
  tundra: tierra

# --- Generación de vetas de mineral (2026-08-30) --------------------------
# Coloca cada material con 'abundancia' (hoy hierro y cobre) dentro de
# celdas de sustrato piedra -- ver nucleo/materiales.py para el algoritmo
# completo (dos formas, mancha o filón, sorteadas por veta individual, no
# una forma fija por mineral -- "por qué tenemos que utilizar un solo
# sistema? no podemos usar ambos indistintamente? eso le dará más
# variedad", Diego 2026-08-30). Sin consumidor mecánico todavía -- coloca
# el dato en el mundo (Celda.deposito_mineral), la extracción real exige
# Inventario y una acción de minería.
#
# PROVISIONAL en su totalidad -- valores de partida razonados, medidos
# contra terreno real (ver commit de esta pieza) pero no contra ningún
# efecto sobre el motor en marcha, porque todavía no hay ningún efecto
# que observar.
generacion_vetas:
  # Fracción del total de celdas de piedra del mundo que se convierte en
  # veta de un material, por unidad de abundancia -- hierro (abundancia
  # 0.6) apunta a 0.6*0.08=4.8% de la piedra, cobre (0.35) a 2.8%.
  escala_abundancia_a_fraccion_piedra: 0.08
  # Tamaño objetivo de una veta individual, en celdas -- de aquí se
  # deriva cuántas vetas separadas salen (objetivo_total / esto), mismo
  # patrón que flora.especies.*.celdas_por_mancha_objetivo.
  celdas_por_veta_objetivo: 4
  # Probabilidad de que una veta concreta sea filón en vez de mancha.
  prob_filon_vs_mancha: 0.5
  longitud_filon_celdas: [2, 5]
  anchura_filon_celdas: [0.6, 1.1]
  # CORREGIDO (2026-08-30, hallazgo honesto del primer intento: en la
  # semilla 42, un objetivo de 2 vetas de hierro terminó en 5 fragmentos,
  # varios de una sola celda -- ruido, no una formación reconocible).
  # Cualquier intento de mancha/filón por debajo de este tamaño se
  # descarta entero en vez de aceptarse truncado -- forma reconocible por
  # encima de exactitud numérica en la cobertura total. Consecuencia
  # aceptada: el mundo puede terminar algo por debajo de la fracción de
  # piedra que sugiere escala_abundancia_a_fraccion_piedra.
  celdas_minimas_por_veta: 2
  # CÍRCULO 2 de profundidad (2026-08-30, confirmado con Diego: las vetas
  # se agotan de verdad, a diferencia de tipo_sustrato). Kg de mineral en
  # CADA celda de una veta -- una veta de celdas_por_veta_objetivo=4
  # celdas suma en torno a 160kg extraíbles en total, del mismo orden de
  # magnitud que masa_minima_almacen (60kg) para que agotar una veta
  # entera se sienta como un esfuerzo real, ni trivial ni infinito.
  # PROVISIONAL, sin calibrar contra el motor en marcha -- primer número
  # razonado, no medido.
  masa_inicial_por_celda_veta_kg: 40.0

# --- Construcción (2026-08-30, refugio/almacén físicos) -------------------
# Qué materiales sirven para construir (apto_construccion, arriba en cada
# entrada del catálogo -- piedra/arcilla/tierra/madera/fibra/hierba_seca/
# hierro/cobre sí, arena/hueso/tejido_blando no) y cuánta masa total de
# esos materiales exige cada tipo de Construccion para llegar a
# progreso=1.0 (componentes/construccion.py). Sin receta fija por tipo de
# material -- cualquier combinación de materiales aptos que sume el
# umbral sirve, emergente de qué recolectó cada gnomo, no un guion
# ("3 madera + 2 fibra").
#
# PROVISIONAL en su totalidad, sin calibrar contra el motor en marcha:
# masa_minima_refugio pensada para exigir varios viajes de recolección de
# un solo gnomo (capacidad de carga ~0.25 * peso propio, gnomo 8-15kg ->
# 2-3.75kg por viaje, ver config/fisiologia.yaml sección inventario) sin
# ser trivial ni imposible. masa_minima_almacen, una construcción
# comunal más grande, pensada para requerir el aporte de varios miembros
# del asentamiento en vez de uno solo.
construccion:
  masa_minima_refugio: 15.0
  masa_minima_almacen: 60.0
  # huella_m2_* / capacidad_construccion_celda_m2 (2026-08-31, conversación
  # de diseño con Diego: "el enfoque de 100 metros cuadrados por celda es
  # demasiado... una hoguera ocupa lo mismo que una casa?"). Antes de esto,
  # una Construccion no tenía ninguna noción de cuánto espacio ocupa --
  # nada impedía que dos refugios coincidieran en la misma celda de 100 m²
  # (metros_por_celda, config/mundo.yaml) sin distinguir un objeto pequeño
  # de uno grande. Mismo patrón que masa_minima_*: un umbral acumulado por
  # tipo, esta vez en área en vez de masa -- sistema_movimiento.py compara
  # la huella del tipo que se quiere construir contra el espacio libre de
  # la celda (capacidad_construccion_celda_m2 menos la suma de huella_m2
  # de las construcciones ya presentes) antes de crearla.
  #
  # Deliberadamente NO resuelve construcciones que excedan una sola celda
  # (muralla, castillo -- mencionadas por Diego como caso futuro): eso
  # exigiría reclamar varias celdas vecinas en una forma concreta (línea
  # para un muro, bloque para un castillo), complejidad real sin ninguna
  # construcción todavía que la necesite -- se deja como punto de
  # extensión natural (misma unidad, m², solo que sumando sobre más de
  # una celda) para cuando exista un caso real, no inventada por
  # anticipación. Ver CLAUDE.md para la conversación completa.
  #
  # PROVISIONAL, sin calibrar contra el motor en marcha: capacidad_
  # construccion_celda_m2=80.0 dentro de los 100 m² reales de la celda
  # (config/mundo.yaml:metros_por_celda=10) deja un margen razonado (no
  # medido) para paso/terreno natural sin necesitar un parámetro de margen
  # aparte. huella_m2_refugio=15.0 (una choza primitiva pequeña, ~4x4m) y
  # huella_m2_almacen=40.0 (construcción comunal más grande) -- con esto,
  # unos 5 refugios o 2 almacenes caben en una misma celda antes de
  # agotar la capacidad, lo cual es razonable para un asentamiento
  # primitivo denso sin sentirse infinito.
  huella_m2_refugio: 15.0
  huella_m2_almacen: 40.0
  capacidad_construccion_celda_m2: 80.0
  # Cuánta masa apta transfiere Accion.CONSTRUIR del Inventario a la
  # Construccion por tick, estando en su misma celda -- PROVISIONAL, sin
  # calibrar contra el motor en marcha. Con esto y masa_minima_refugio,
  # un gnomo con el inventario lleno tarda en torno a 15-20 ticks en
  # completar su propio refugio, más si tiene que volver a recolectar
  # entre medias -- orden de magnitud razonado, no medido.
  tasa_aporte_construccion_kg_tick: 1.0
  # Círculo C (2026-08-30, Accion.RECOLECTAR -- ver nucleo/construccion.py
  # y sistema_recursos.py:_resolver_recolectar): cuánto tipo_sustrato de
  # la celda actual (piedra/arcilla/tierra, siempre presente, no
  # depletable) se convierte en material de Inventario por tick, topado
  # por la capacidad de carga propia. Solo sustrato -- madera/fibra/
  # hierba_seca (depósitos generados por flora) quedan fuera: no existe
  # todavía ningún sistema que tale un árbol o siegue hierba y deposite
  # el material real en el mundo, recolectarlos no es posible hoy sin
  # inventar ese consumo (hueco honesto, no resuelto en esta pieza).
  # PROVISIONAL, sin calibrar contra el motor en marcha.
  tasa_recoleccion_kg_tick: 1.0

# --- Armas fabricadas (2026-09-01, primer círculo del arco herramientas/
# utensilios/armas) -----------------------------------------------------
# Qué materiales sirven para fabricar un arma simple (apto_arma, arriba en
# cada entrada del catálogo -- madera y piedra por ahora; hierro/cobre
# quedan fuera, reservados para un círculo futuro de armas metálicas) y
# qué nombre recibe el arma fabricada a partir de cada uno. Efecto
# idéntico para ambas en este círculo (ver config/combate.yaml,
# reduccion_prob_captura_por_arma_fabricada) -- el nombre distinto no
# cambia nada mecánico todavía, solo deja la puerta abierta para un
# círculo futuro que sí diferencie por tipo de arma.
armas:
  nombre_arma_por_material:
    madera: lanza
    piedra: hacha_mano
