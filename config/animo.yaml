# ==============================================================================
# config/animo.yaml
# Estado de animo dinamico -- ver componentes/animo.py y docs/superpowers/
# specs/2026-09-18-animo-design.md
#
# TODO PROVISIONAL: hipotesis de partida razonada, sin ninguna calibracion
# contra el motor en marcha todavia -- primer circulo del mecanismo.
