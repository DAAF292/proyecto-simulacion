      # el tamaÃ±o de mancha como parÃ¡metro fijo en su lugar, es el NÃšMERO
      # de manchas el que crece con el Ã¡rea -- mÃ¡s parches de tamaÃ±o
      # similar en un mapa mÃ¡s grande, no menos parches gigantescos.
