    agudeza_sensorial: [0.5, 0.8]
    duracion_gestacion_dias: [18, 28]
    # camada (2026-08-21, ver nota extensa en gnomo mas arriba): la
    # ardilla arboricola (p. ej. Sciurus carolinensis) tiene camadas de
    # 2 a 4 crias de media segun las fuentes consultadas, con hasta 8 en
    # casos raros -- se usa el rango medio [2, 4] en vez del extremo,
    # mismo criterio que en lobo (rango tipico documentado, no el maximo
    # teorico). Mas baja que conejo, coherente con ser algo menos
    # r-strategy en el resto de sus rangos raciales (sociabilidad menor,
    # ver nota de cabecera del bloque conejo/ardilla).
    camada: [2, 4]
    # fraccion_madurez (2026-08-20): 0.4 -- por analogia con la madurez
    # real de una ardilla (aprox. 10-12 meses), algo mas tardia que el
    # conejo en proporcion a su propio minimo racial (2 anios): 0.4 * 2 =
    # 0.8 anios (384 ticks). Coherente con ser menos prolifica que el
    # conejo (sociabilidad menor, vive mas, memoria ligeramente mayor --
    # ver nota de cabecera del bloque) sin llegar a la K-strategy de
    # gnomo/lobo. provisional, sin calibrar contra el motor en marcha.
    fraccion_madurez: 0.4
    # factor_base_concepcion (2026-08-20): 0.0067/tick, intermedio entre
    # gnomo (0.0033) y conejo (0.015) -- misma logica relativa que el
    # resto de este bloque: mas prolifica que un recolector omnivoro de
    # vida larga, menos que el conejo r-strategy. provisional, primera
    # hipotesis a validar en la tarea #87, no una cifra observada.
    factor_base_concepcion: 0.0067

