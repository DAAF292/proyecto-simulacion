    estabilidad_mental_maxima: [0.5, 0.8]
    consciencia: [0.0, 0.2]
    # Bloque G. longevidad: ficha_lobo.pdf seccion 4 "ciclo vital"
    # (misma nota que en gnomo: provisional en la ficha, no inventado
    # aqui). altura, velocidad, resistencia_enfermedad y agudeza_sensorial
    # razonadas por analogia -- lobo mas alto/rapido/resistente/perceptivo
    # que el gnomo, coherente con fuerza/agilidad ya sorteadas.
    altura: [0.6, 0.9]                 # metros, provisional por analogia
    longevidad: [8, 14]                # anios, ficha_lobo.pdf seccion 4
    velocidad: [0.5, 0.9]              # normalizada, provisional por analogia
    resistencia_enfermedad: [0.4, 0.7] # normalizada, provisional por analogia
    agudeza_sensorial: [0.5, 0.8]      # normalizada, provisional por analogia
    # 6.3 Reproduccion. duracion_gestacion_dias: ficha_lobo.pdf seccion 4
    # "ciclo vital" (misma nota que en gnomo).
    duracion_gestacion_dias: [60, 75]
    # camada (2026-08-21, ver nota extensa en gnomo mas arriba): el lobo
    # real (Canis lupus) tiene camadas de 4 a 6 crias de media, con
    # rango observado de 1 a 15 en casos extremos segun disponibilidad de
    # presa -- fuente consistente entre International Wolf Center,
    # California Wolf Center y Smithsonian National Zoo. Se usa el rango
    # medio [4, 6] en vez de los extremos: es K-strategy en frecuencia de
    # concepcion (factor_base_concepcion mas abajo, la mas baja de las
    # cuatro especies) pero NO en tamano de camada -- son ejes distintos
    # en la biologia real, un lobo pare pocas veces pero no pocas crias
    # cada vez, y mezclar ambos ejes en una sola cifra baja perderia esa
    # distincion real.
    camada: [4, 6]
    # fraccion_madurez (2026-08-20, antes global): SIN CAMBIO, se queda en
    # 0.2 -- es el caso donde el valor global original SI coincidia con un
    # dato real (madurez sexual del lobo real, aprox. 1-2 anios; 0.2 sobre
    # el minimo racial de 8 anios da 1.6 anios). Mover fraccion_madurez a
    # rangos_raciales no significaba que todas las especies necesitaran un
    # valor distinto -- el lobo es la unica que ya tenia respaldo real
    # para el numero que ya llevaba.
    fraccion_madurez: 0.2
    # factor_base_concepcion (CALIBRACION 2026-08-21, la prediccion de la
    # nota anterior se confirmo con el motor en marcha): la version
    # 0.0017 (mitad de gnomo, "K-strategy deliberada") partia de un
    # supuesto que la investigacion de hoy desmintio -- que el contacto
    # elegible fuera comparable entre especies y solo la probabilidad
    # de exito debiera diferenciarlas. En la practica, el contacto YA es
    # muchisimo mas escaso para lobo que para gnomo solo por tener una
    # poblacion fundadora menor (6 frente a 18) -- penalizar ADEMAS la
    # probabilidad de exito por tick era castigar la misma desventaja
    # K-strategy dos veces, una vez via poblacion/contacto (real, se
    # queda) y otra via este numero (redundante). Instrumentado con
    # nucleo/entidad.py:_sortear_edad_inicial_ticks ya en marcha (edad
    # inicial variable, ver seccion 'poblacion' mas abajo): con 0.0017,
    # 3 semillas de prueba (6000 ticks) dieron 2 concepciones de lobo en
    # total frente a 14 de gnomo con 0.0033 -- desproporcionado incluso
    # descontando la diferencia de poblacion. Igualado a 0.0033 (el mismo
    # valor que gnomo): la diferencia de fecundidad relativa entre ambas
    # especies sigue existiendo, solo que ahora vive enteramente en la
    # escasez real de contacto (poblacion fundadora menor, un mapa mas
    # grande y un mismo radio de percepcion absoluto hacen mas raro que
    # dos lobos concretos coincidan en la misma celda) en vez de
    # duplicarse artificialmente en un segundo numero. provisional,
    # pendiente de una corrida mas larga que confirme nacimientos reales
    # de lobo (la gestacion, 1440-1800 ticks, no daba tiempo a completarse
    # en las pruebas cortas de esta sesion).
    factor_base_concepcion: 0.0033

  # conejo/ardilla (2026-08-20): sin ficha de referencia propia (a
  # diferencia de gnomo/lobo, que parten de ficha_gnomo.pdf/ficha_lobo.pdf)
  # -- TODO este bloque es una hipotesis de partida razonada por analogia
  # con el resto de rangos raciales ya sorteados, sin ningun dato del
  # motor en marcha. Ambas: fauna, no conscientes (consciencia mas baja
  # incluso que lobo), medio_alimentacion=recolectar con dieta restringida
  # (ver nota en rangos_raciales.gnomo sobre por que dieta existe), peso
  # muy por debajo de gnomo (la especie mas ligera hasta ahora) para que
  # la disposicion por peso (nucleo/disposicion.py) las deje claramente
  # del lado de "presa" frente a lobo. duracion_gestacion_dias
  # deliberadamente mas corta que la de lobo -- estrategia r frente a la
  # K de un depredador solitario, para que la poblacion de presas pueda
  # sostener algo de presion de caza -- sin ninguna calibracion todavia:
  # si dispara una explosion o un colapso de poblacion, es lo primero que
  # habria que revisar.
  conejo:
    medio_alimentacion: recolectar
    dieta: [hierba, raices]
    peso: [1.5, 3.0]                   # kg, por analogia (mucho mas ligero que gnomo)
    # valentia (CALIBRACION 2026-08-21, ver nota extensa en
    # estabilidad_mental_maxima mas abajo): subida de [0.1, 0.3] a
    # [0.2, 0.45) -- el rango original caia ENTERO en o por debajo de
    # decision.umbral_valentia_huida_erratica (0.3), condenando a
    # practicamente el 100% de los conejos a resolver cualquier crisis
    # mental como HUIDA_ERRATICA (que anula la Utility AI por completo,
    # ver sistema_decision.py) -- nunca CATATONIA ni CRISIS_VIOLENTA, sin
    # ninguna variacion individual real. Medido: un conejo pasaba 36-64%
    # de sus ticks vividos en algun estado de crisis segun la semilla.
    # Sigue siendo mas cobarde que gnomo [0.2, 0.6] (presa tipica, no
    # deberia dejar de serlo) pero ya no 100% determinista.
    valentia: [0.2, 0.45]              # presa tipica, poco dispuesta a plantar cara
    sociabilidad: [0.5, 0.9]           # vive en madriguera/grupo, por analogia
    agresividad: [0.05, 0.2]
    fuerza: [0.1, 0.3]
    agilidad: [0.6, 0.9]               # clave para evasion (sistema_depredacion.py)
    vitalidad_maxima: [0.2, 0.4]
    resistencia_maxima: [0.3, 0.5]
    curacion: [0.01, 0.02]
    recuperacion: [0.08, 0.15]
    dominancia: [0.1, 0.3]
    empatia: [0.3, 0.6]
    lealtad: [0.3, 0.6]
    fe: [0.0, 0.1]                     # fauna, minimo
    curiosidad: [0.2, 0.5]
    inteligencia: [0.1, 0.3]
    memoria: [0.2, 0.5]
    voluntad: [0.1, 0.3]
    resiliencia: [0.3, 0.6]
    # estabilidad_mental_maxima (CALIBRACION 2026-08-21, investigacion "por
    # que no sobrevive ni un mundo" pedida por Diego): subida de
    # [0.3, 0.5] a [0.4, 0.6]. sistema_capacidad_mental.py divide el
    # drenaje por estres (amenaza sostenida + presenciar muerte) entre
    # este propio maximo -- un techo mas bajo que gnomo/lobo [0.4-0.8]
    # amplifica la MISMA tasa de drenaje nominal, y conejo ahora es presa
    # real de lobo (antes solo gnomo lo era), asi que sufre mas amenaza
    # sostenida que cuando se eligio [0.3, 0.5] por pura analogia sin
    # dato del motor en marcha. Combinado con valentia (ver mas arriba),
    # la fraccion de tiempo en crisis bajo de 36-64% a 17-35% en las
    # pruebas -- mejora real pero NO explica por si sola la mortalidad por
    # inanicion (que se mantuvo casi igual en pruebas aisladas de solo
    # este cambio) -- ver tasa_perdida_hidratacion_por_tick (seccion
    # 'necesidades' mas arriba) para el hallazgo que si tuvo efecto
    # grande. Las dos correcciones se aplican juntas porque cada una
    # ataca una causa real distinta, no porque una sola bastara.
    estabilidad_mental_maxima: [0.4, 0.6]
    consciencia: [0.0, 0.1]            # fauna, por debajo incluso de lobo
    altura: [0.2, 0.3]                 # metros
    longevidad: [1, 3]                 # anios, ciclo de vida corto (estrategia r)
    velocidad: [0.5, 0.8]
    resistencia_enfermedad: [0.2, 0.4]
    agudeza_sensorial: [0.5, 0.8]      # presa alerta, oido/olfato agudo
    duracion_gestacion_dias: [15, 25]  # notablemente mas corta que lobo, ver nota arriba
    # camada (2026-08-21, ver nota extensa en gnomo mas arriba): el
    # conejo europeo salvaje (Oryctolagus cuniculus) es la especie con
    # mas variacion entre fuentes consultadas -- desde 3-7 crias por
    # camada (la cifra que mas se repite) hasta 3-12 en los extremos mas
    # altos citados. Se usa [3, 7] como lectura conservadora del rango
    # mas consistente entre fuentes en vez del extremo superior (3-12),
    # coherente con ser la especie mas r-strategy de las cuatro
    # (factor_base_concepcion mas abajo, el mas alto) sin irse al caso
    # mas extremo documentado. provisional: si en la practica sigue sin
    # bastar para sostener la presion de caza medida, [3,7] es el primer
    # numero a revisar antes que cualquier otro de este bloque.
    camada: [3, 7]
    # fraccion_madurez (2026-08-20): 0.3 -- por analogia con la madurez
    # sexual real del conejo (aprox. 4-6 meses, ~0.33-0.5 de un ciclo de
    # vida de referencia de 1 anio, minimo racial de esta especie). Sobre
    # el minimo racial de 1 anio da madurez a los 0.3 anios (144 ticks) --
    # deliberadamente rapida, coherente con la estrategia r ya declarada
    # en la nota de cabecera de este bloque (peso ligero, gestacion corta).
    # provisional, sin calibrar contra el motor en marcha.
    fraccion_madurez: 0.3
    # factor_base_concepcion (2026-08-20): el mas ALTO de las cuatro
    # especies -- 0.015/tick, unas 4-5 veces el de gnomo (0.0033) --
    # coherente con la estrategia r (muchas camadas, alta fecundidad
    # individual) que ya justifica su gestacion corta y su fraccion_
    # madurez baja. Ademas es la especie que la propia investigacion
    # senalo con MAS contactos reales entre elegibles (nace en Pradera,
    # sociabilidad alta) pero pocas concepciones -- el cuello de botella
    # identificado no era falta de contacto sino la probabilidad de
    # concepcion en si, asi que aqui es donde mas sentido tiene subir el
    # numero de partida. provisional, primera hipotesis a validar en la
    # prueba de extremo a extremo (tarea #87), no una cifra observada.
    factor_base_concepcion: 0.015
  ardilla:
    medio_alimentacion: recolectar
    dieta: [manzanas, raices]
    peso: [0.3, 0.6]                   # kg, la especie mas ligera del mundo por ahora
