memoria:
  # CORRECCION 2026-08-23 (encontrado de paso, no lo que se pedia):
  # estas tres claves se llamaban capacidad_minima/capacidad_maxima/
  # factor_error_por_distancia -- ninguna coincidia con lo que lee
  # nucleo/memoria.py (min_recuerdos_por_categoria/
  # max_recuerdos_por_categoria/factor_imprecision_distancia), asi que el
  # codigo caia siempre en sus valores por defecto (1, 5, 0.2). Coincidia
