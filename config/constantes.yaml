  # calibrar contra el motor en marcha todavÃ­a -- hipÃ³tesis de partida,
  # pendiente de contrastar con el harness de calibraciÃ³n ligera.
  fraccion_siembra_inicial: 0.08
  especies:
    hierba_silvestre:
      biomas: [pradera, bosque]
      # celdas_por_mancha_objetivo (2026-08-23, sustituye a num_manchas
      # fijo): tamaÃ±o de mancha objetivo en celdas, del que se DERIVA el
      # nÃºmero de manchas (num_manchas_calculado = max(1, round(objetivo /
      # celdas_por_mancha_objetivo)), ver nucleo/zona_bioma.py) en vez de
      # al revÃ©s. Con num_manchas fijo, un mapa mÃ¡s grande no producÃ­a mÃ¡s
      # manchas -- producÃ­a manchas mÃ¡s grandes (objetivo crece con el
      # Ã¡rea, num_manchas no), degenerando en un Ãºnico "supercontinente"
      # dominante por especie (confirmado empÃ­ricamente: 500-975 de 1600
      # celdas en una sola mancha de hierba en el mapa 40x40 actual). Con
      # el tamaÃ±o de mancha como parÃ¡metro fijo en su lugar, es el NÃšMERO
      # de manchas el que crece con el Ã¡rea -- mÃ¡s parches de tamaÃ±o
      # similar en un mapa mÃ¡s grande, no menos parches gigantescos.
      # Valores calibrados para reproducir aproximadamente el num_manchas
      # de hoy en el mapa 40x40 actual (script de 5 semillas, ver
      # diagnÃ³stico de inaniciÃ³n 2026-08-23) -- ancla de continuidad, no
      # una cifra recalibrada desde cero.
      celdas_por_mancha_objetivo:
        pradera: 180
        bosque: 12
      proporcion:
        pradera: 0.75
        bosque: 0.2
      tasa_crecimiento_por_dia: 0.25
      prob_propagacion_por_dia: 0.06
