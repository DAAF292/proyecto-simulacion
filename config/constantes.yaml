# ==============================================================================
# config/constantes.yaml
# Configuración paramétrica centralizada del motor "Un mundo vivo"
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Configuración Espacial y Topología del Mundo
# ------------------------------------------------------------------------------
mundo:
  # AMPLIADO 2026-08-23 (28->40, decisión delegada por Diego): la
  # población fundadora se triplicó (28->84 individuos) desde la
  # calibración de referencia (informe de implementación 7.39-7.45,
  # mapa 20x20) mientras el mapa solo se dobló (20x20->28x28), subiendo
  # la densidad real un 53% (0.07->0.107 individuos/celda) en la
  # dirección CONTRARIA a la que el propio informe técnico (sección 20)
  # dejó pendiente ("población inicial menor" o "mapa más grande" como
  # palancas alternativas). 40x40 baja la densidad a 0.0525
  # individuos/celda, un 25% por debajo del baseline calibrado de 7.45,
  # sin tocar la población fundadora que Diego ya había decidido.
  # PROVISIONAL en el sentido de que no se ha repetido el harness
  # completo de 7.39/7.45 (15 semillas x 12000 ticks) sobre este valor
  # -- ver smoke test de calibración ligera en el commit que acompaña
  # este cambio para una primera señal, no una validación definitiva.
  grid_ancho: 40
  grid_alto: 40
  metros_por_celda: 10

semilla_por_defecto: 42

# ------------------------------------------------------------------------------
# 1.1 Persistencia (2026-08-23)
# ------------------------------------------------------------------------------
persistencia:
  # PROVISIONAL, sin calibrar contra el coste real de guardar_snapshot a
  # escala (ver main.py) -- hipótesis de partida, no una cifra medida.
  guardar_cada_dias: 5

generacion_mapa:
  elevacion_escala_celdas: 7
  lluvia_escala_celdas: 9
  temperatura_escala_celdas: 12
  rio_ancho: 1
  recurso_prob_expansion: 0.5

bioma:
  umbral_elevacion_montana: 0.80
  umbral_temperatura_tundra: 0.12
  umbral_lluvia_desierto: 0.15
  umbral_lluvia_bosque: 0.72

# ------------------------------------------------------------------------------
# 2. Hidrología y Dinámica de Superficie
# ------------------------------------------------------------------------------
agua:
  umbral_elevacion_nacimiento: 0.70
  banda_elevacion_lago: 0.03
  tope_tamano_lago: 8
  umbral_elevacion_poza: 0.20
  banda_elevacion_poza: 0.008
  tope_tamano_poza: 4
  escala_metros_por_unidad_elevacion: 100.0
  tope_tamano_orilla_rio: 3
  piso_banda_rio: 0.001
  techo_banda_rio: 0.03

charcos:
  techo_profundidad_charco: 0.03
  tasa_evaporacion_charco_por_tick: 0.0006
  tasa_agotamiento_charco_al_beber: 0.01

# ------------------------------------------------------------------------------
# 3. Atmósfera, Climatología y Desastres
# ------------------------------------------------------------------------------
estaciones:
  primavera:
    modificador_regeneracion: 1.0
    objetivo_confort_termico: 0.55
  verano:
    modificador_regeneracion: 1.2
    objetivo_confort_termico: 0.8
  otono:
    modificador_regeneracion: 0.9
    objetivo_confort_termico: 0.45
  invierno:
    modificador_regeneracion: 0.5
    objetivo_confort_termico: 0.15

clima:
  probabilidades_por_estacion:
    primavera: {despejado: 0.5, lluvioso: 0.45, tormenta: 0.05}
    verano: {despejado: 0.75, lluvioso: 0.2, tormenta: 0.05}
    otono: {despejado: 0.4, lluvioso: 0.5, tormenta: 0.1}
    invierno: {despejado: 0.55, lluvioso: 0.35, tormenta: 0.1}
  efectos:
    despejado:
      ajuste_confort: 0.05
      modificador_regeneracion: 1.0
      tasa_generacion_charco_por_tick: 0.0
    lluvioso:
      ajuste_confort: -0.05
      modificador_regeneracion: 1.15
      tasa_generacion_charco_por_tick: 0.003
    tormenta:
      ajuste_confort: -0.1
      modificador_regeneracion: 0.9
      tasa_generacion_charco_por_tick: 0.01

desastres:
  prob_ignicion_base_bosque: 0.0015
  multiplicador_riesgo_por_clima:
    despejado: 1.5
    lluvioso: 0.2
    tormenta: 1.0
  prob_propagacion_por_tick: 0.08
  prob_extincion_por_tick: 0.35
  dano_por_tick_en_llamas: 0.15
  aporte_ceniza_planta: 0.15
  fraccion_masa_seca_quemada: 0.20
  fraccion_agua_tisular_quemada: 0.05
  tasa_putrefaccion_calcinada: 0.15

# ------------------------------------------------------------------------------
# 4. Botánica, Descomposición y Fertilidad Edáfica
# ------------------------------------------------------------------------------
abono:
  incremento_fertilidad_por_aliviarse: 0.2
  techo_fertilidad: 1.0
  decaimiento_fertilidad_por_dia: 0.1

descomposicion:
  constante_degradacion_base: 0.08
  masa_referencia_fertilidad: 10.0
  umbral_purga_masa: 0.05
  factor_humedad_lluvia: 1.3
  factor_humedad_seco: 0.8

flora:
  bono_produccion_ribera: 0.2
  tasa_retorno_mantillo: 0.05
  especies:
    hierba_silvestre:
      biomas: [pradera, bosque]
      num_manchas: 4
      proporcion:
        pradera: 0.75
        bosque: 0.2
      tasa_crecimiento_por_dia: 0.25
      prob_propagacion_por_dia: 0.06
      preferencia_lluvia: [0.25, 0.85]
      preferencia_temperatura: [0.25, 0.85]
      recursos:
        - nombre: raices
          categoria: alimento
          capacidad_maxima: 10.0
          tasa_regeneracion: 0.5
          valor_nutricional: 0.15
          valor_hidratacion: 0.08
        - nombre: hierba
          categoria: alimento
          capacidad_maxima: 8.0
          tasa_regeneracion: 0.4
          valor_nutricional: 0.12
          valor_hidratacion: 0.12
    manzano:
      biomas: [bosque]
      num_manchas: 4
      proporcion: 0.15
      tasa_crecimiento_por_dia: 0.08
      prob_propagacion_por_dia: 0.02
      preferencia_lluvia: [0.55, 1.0]
      preferencia_temperatura: [0.3, 0.75]
      recursos:
        - nombre: manzanas
          categoria: alimento
          capacidad_maxima: 5.0
          tasa_regeneracion: 0.2
          valor_nutricional: 0.4
          valor_hidratacion: 0.15
        - nombre: madera
          categoria: material
    cactus:
      biomas: [desierto]
      num_manchas: 3
      proporcion: 0.15
      tasa_crecimiento_por_dia: 0.05
      prob_propagacion_por_dia: 0.015
      preferencia_lluvia: [0.0, 0.2]
      preferencia_temperatura: [0.5, 1.0]
      recursos:
        - nombre: fruto_de_cactus
          categoria: alimento
          capacidad_maxima: 4.0
          tasa_regeneracion: 0.15
          valor_nutricional: 0.35
          valor_hidratacion: 0.2
        - nombre: fibra
          categoria: material
    liquen:
      biomas: [montana]
      num_manchas: 2
      proporcion: 0.1
      tasa_crecimiento_por_dia: 0.03
      prob_propagacion_por_dia: 0.01
      preferencia_lluvia: [0.1, 0.5]
      preferencia_temperatura: [0.0, 0.4]
      recursos:
        - nombre: liquen
          categoria: alimento
          capacidad_maxima: 3.0
          tasa_regeneracion: 0.1
          valor_nutricional: 0.2
          valor_hidratacion: 0.03
    musgo:
      biomas: [tundra]
      num_manchas: 2
      proporcion: 0.1
      tasa_crecimiento_por_dia: 0.03
      prob_propagacion_por_dia: 0.01
      preferencia_lluvia: [0.2, 0.6]
      preferencia_temperatura: [0.0, 0.15]
      recursos:
        - nombre: musgo
          categoria: alimento
          capacidad_maxima: 3.0
          tasa_regeneracion: 0.1
          valor_nutricional: 0.2
          valor_hidratacion: 0.04

# ------------------------------------------------------------------------------
# 5. Población Inicial y Demografía
# ------------------------------------------------------------------------------
poblacion:
  gnomos_iniciales: 18
  lobos_iniciales: 6
  conejos_iniciales: 30
  ardillas_iniciales: 30
