social:
  distancia_deseada_conspecifico: 1
  distancia_deseada_territorio: 1
  # GREGARISMO -- Pieza 1 (2026-08-30, ver nucleo/disposicion.py:
  # contar_conspecificos_cercanos para el diseno completo). Radio
  # compartido por el bono de caza en grupo (sistema_depredacion.py) y el
  # bono de defensa en grupo (sistema_necesidades.py) -- un unico radio
  # "de apoyo grupal" en vez de dos radios separados por consumidor
