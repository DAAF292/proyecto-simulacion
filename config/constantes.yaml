bioma:
  # RECALIBRADO (2026-08-29, auditoria de funcionalidades, tercera
  # edicion, confirmado con Diego). La calibracion anterior (2026-08-27,
  # umbrales 0.47/0.25/0.24/0.62) nunca llego a revalidarse "tras jugar
  # con estos mundos" como decia su propio comentario: medida despues
  # contra el generador causal real, producia desierto practicamente
  # inexistente (0.35-0.44% de las celdas, objetivo ~5%) y tundra muy por
  # encima del objetivo (13-14%, objetivo ~3%) -- confirmado en 40
  # semillas fuera de muestra, no una unica medicion.
  #
