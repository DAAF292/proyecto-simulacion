  # verdad lo que dice controlar.
  min_recuerdos_por_categoria: 1
  max_recuerdos_por_categoria: 5
  factor_imprecision_distancia: 0.3
  # prob_purgar_recuerdo_agotado (2026-08-23, PROVISIONAL -- ver
  # sistema_recursos.py:_resolver_comer/_resolver_beber y el diagnostico
  # de extincion local semilla 1): probabilidad, en CADA visita fallida a
  # una coordenada recordada de comida/agua ya agotada, de descartar ese
  # recuerdo -- en vez de purgarlo al primer fallo (lo que se probo
  # primero y funcionaba muy bien en 4 de 5 semillas de referencia, pero
