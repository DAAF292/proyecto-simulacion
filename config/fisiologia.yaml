# ==============================================================================
# config/fisiologia.yaml
# Metabolismo, necesidades, decisión (Utility AI), capacidades y ciclo vital
#
# Parte del catálogo de configuración del motor "Un mundo vivo", antes unificado
# en un único config/constantes.yaml (dividido en ficheros por categoría el
# 2026-08-30, a petición de Diego) -- todos los ficheros de config/*.yaml se
# cargan y fusionan en un solo diccionario (main.py:cargar_configuracion), así
# que ninguna sección cambia de nombre ni de forma de acceso al dividirse.
# ==============================================================================

necesidades:
  defecto:
    tasa_perdida_saciedad_por_tick: 0.012
    tasa_perdida_energia_por_tick: 0.01
    tasa_perdida_hidratacion_por_tick: 0.004
    tasa_perdida_aliviado_por_tick: 0.01
    tasa_alivio_al_aliviarse: 0.5
    tasa_recuperacion_energia_al_dormir: 0.05
    tasa_perdida_seguridad_por_amenaza: 0.3
    tasa_recuperacion_seguridad: 0.05
    tasa_perdida_oxigenacion_por_inmersion: 0.5
    tasa_recuperacion_oxigenacion: 1.0
    tasa_deriva_confort_termico: 0.03
    # bono_confort_refugio/fogata (2026-08-31, ver nucleo/fuego.py y
    # conversacion de diseno con Diego: "otoño 15 grados, estoy a
    # cubierto... invierno 3 grados, ¿es suficiente, o debo encender un
    # fuego?"). SUMAN al objetivo ambiental de estacion+clima (nucleo/
    # clima.py:objetivo_confort_termico), no lo sustituyen -- la
    # severidad real del frio importa: en otoño (objetivo ambiental
    # ~0.45) el refugio solo ya basta (~0.75); en invierno (~0.15) el
    # refugio solo deja un resultado todavia frio (~0.45), y sumar la
    # fogata lo acerca al mismo nivel que un otoño con refugio (~0.75).
    # Emergente de la estacion/clima real del dia, no una regla fija por
    # estacion. Refugio cuenta cualquier Construccion tipo="refugio"
    # completado_alguna_vez=True en la celda (abriga a quien este dentro,
    # no solo al propietario -- distinto de la pregunta de A QUIEN
    # pertenece, que resuelve nucleo/conflicto.py aparte). Mismo orden de
    # magnitud que la brecha real entre estaciones (0.3) -- PROVISIONAL,
    # sin calibrar contra el motor en marcha.
    bono_confort_refugio: 0.3
    bono_confort_fogata: 0.3
    # bono_confort_pareja (2026-09-04, circulo 4b -- ver
    # nucleo/relaciones.py:pareja_presente y sistema_necesidades.py). SUMAN
    # al mismo objetivo aditivo que refugio/fogata y al drenaje/recuperacion
    # de seguridad, solo cuando la pareja derivada (afinidad mutua >=
    # relaciones.umbral_pareja) esta en la celda EXACTA de la entidad
    # CONSCIENTE. PROVISIONAL, sin calibrar contra el harness completo.
    bono_confort_pareja: 0.15
    bono_seguridad_pareja: 0.05
    # bono_confort_madriguera/bono_seguridad_madriguera (2026-09-07,
    # circulo B de "madriguera fisica" -- ver docs/superpowers/specs/
    # 2026-09-07-madriguera-fisica-b-design.md). Mismo patron aditivo,
    # pero se aplica a CUALQUIERA fisicamente en la celda de una
    # Madriguera real (nucleo/madriguera.py), sin exigir consciencia ni
    # que el individuo la tenga en su propia memoria -- distinto de
    # refugio individual, que sigue sin ningun bono (decision ya
    # tomada). bono_seguridad_madriguera > bono_seguridad_pareja (0.05):
    # una madriguera protege mas que la sola compania de la pareja.
    # PROVISIONAL, sin calibrar contra el harness completo.
    bono_confort_madriguera: 0.3
    bono_seguridad_madriguera: 0.1
    # bono_confort_salon_comun/bono_seguridad_salon_comun (2026-09-08,
    # primera dinamica interna de asentamiento -- ver
    # docs/superpowers/specs/2026-09-08-salon-comun-design.md). Mismo
    # patron aditivo, sin necesitar una Fogata real aparte -- el salon
    # ya implica su propio hogar. PROVISIONAL, sin calibrar.
    bono_confort_salon_comun: 0.3
    bono_seguridad_salon_comun: 0.1
    # bono_confort_cocina_comun/bono_seguridad_cocina_comun (2026-09-08,
    # cocinas comunes -- ver docs/superpowers/specs/
    # 2026-09-08-cocinas-comunes-design.md): mismo patron e iguales
    # valores que salon comun por simetria de partida, sin ninguna razon
    # para diferenciarlos todavia. PROVISIONAL, sin calibrar.
    bono_confort_cocina_comun: 0.3
    bono_seguridad_cocina_comun: 0.1
    # saciedad_minima_para_guardar_provisiones (2026-09-07, ver
    # docs/superpowers/specs/2026-09-07-provisiones-alimento-design.md):
    # umbral de saciedad tras comer por encima del cual un consciente
    # guarda el excedente de comida en Inventario.provisiones en vez de
    # dejarlo perderse. PROVISIONAL, sin calibrar.
    saciedad_minima_para_guardar_provisiones: 0.9
    tasa_perdida_impulso_reproductivo_por_tick: 0.005
    probabilidad_muerte_saciedad_critica: 0.005
    probabilidad_muerte_deshidratacion: 0.005
    probabilidad_muerte_ahogamiento: 0.5
    # probabilidad_muerte_intoxicacion_base (2026-09-08, ver
    # docs/superpowers/specs/2026-09-08-como-cocinar-design.md): al comer
    # crudo un alimento marcado toxico_crudo (config/flora.yaml), modulada
    # por (1 - resistencia_enfermedad) -- primer consumidor real de ese
    # atributo, sorteado por individuo desde hace tiempo sin ninguno.
    # Deliberadamente MUY por debajo de las demas probabilidades de
    # muerte de este bloque -- vector de muerte NUEVO para gnomo, la
    # especie mas fragil del catalogo (peor perfil reproductivo, todo el
    # trabajo de estabilidad de esta sesion) -- empezar conservador, no
    # igualar tasas ya calibradas de otras causas. PROVISIONAL, sin
    # calibrar contra el harness completo -- verificar con especial
    # cuidado contra el motor real antes de confiar en este numero.
    probabilidad_muerte_intoxicacion_base: 0.001
    # ticks_plenitud (2026-08-29, incremento 2 del diseño de microsueños --
    # ver sistemas/sistema_necesidades.py): PERIODO DE PLENITUD posaciedad.
    # Una necesidad que alcanza 1.0 no decae durante este numero de ticks;
    # despues decae con su tasa lineal. 0 lo desactiva. PROVISIONAL: 12
    # ticks (~medio dia de juego) es la hipotesis de partida razonada del
    # diseño con Diego, sin calibrar contra el harness completo (15 semillas
    # x 12000 ticks) -- solo contra el arnes de diagnostico (semilla 42,
    # 3000 ticks).
    ticks_plenitud: 12
  lobo:
    # RECALIBRADO 2026-09-05 (investigacion de fragilidad de lobo -- ver
    # CLAUDE.md, "Investigacion de causas del colapso reproductivo de
    # gnomo" y siguientes). Medido contra el motor real: el presupuesto
    # calorico medio de lobo (ingreso por captura vs decaimiento) estaba
    # casi exactamente en el punto de equilibrio (margen ~1.3% sobre el
    # decaimiento, con eficiencia_biomasa_saciedad=12.0 ya vigente) --
    # una media que apenas no es negativa deja CERO margen frente a la
    # varianza real de rachas sin captura, y el 90% de las muertes reales
    # de lobo eran por inanicion. Subir eficiencia_biomasa_saciedad un
    # 50% (12->18) NO cambio nada medible (6/6 extincion en ambos casos,
    # 10 semillas x 8000 ticks) -- descartado empiricamente: el problema
    # NO es cuanto alimenta cada captura, es el TIEMPO que un lobo pasa a
    # saciedad exactamente 0 esperando la siguiente.
    #
    # CORRECCION 2026-09-05, MISMO DIA: una primera version de este
    # override (decay a 0.0015, muerte a 0.001 -- "decaimiento a la
    # mitad" decia el comentario, aunque el numero real ya era un 8x, no
    # un 2x -- inconsistencia real detectada al releer esto, corregida
    # aqui) SE REPROBO contra 12 semillas NUEVAS (501-512, nunca vistas
    # antes) x 8000 ticks y resulto en 12/12 EXTINCION -- la mejora
    # medida originalmente (6 semillas x 5000 ticks, extincion 6/6->4/6)
    # NO generalizaba. Ademas, INCLUSO llevando estas dos palancas al
    # extremo (decay 0.0008, muerte 0.0004 -- valores de esta entrada)
    # solo se llego a 9/12 extincion (3/12 supervivientes, con 1-2
    # individuos, poblaciones no realmente sostenidas) -- la inanicion
    # NUNCA fue la unica causa de fondo.
    #
    # HALLAZGO REAL, no visto antes: con la inanicion casi neutralizada
    # por estos valores extremos, el desglose real de causas de muerte
    # (8 semillas x 8000 ticks) dio VEJEZ como causa DOMINANTE (65.6%),
    # con inanicion en segundo lugar (32.8%) -- antes quedaba enmascarada
    # bajo el 90% de muertes por inanicion del config original. Causa
    # raiz: `poblacion.techo_fraccion_edad_inicial_longevidad` (0.7)
    # siembra a TODA la poblacion fundadora con edad inicial de hasta el
    # 70% de su longevidad individual, aplicado por igual a especies con
    # longevidades absolutas muy distintas (gnomo 45-65 anios, lobo solo
    # 8-14) -- para lobo, la ventana de la simulacion (8000 ticks ~ 0.91
    # anios) consume una fraccion mucho mayor de vida restante que para
    # gnomo, exponiendo a la poblacion fundadora entera a la zona final
    # de la curva de vejez (nucleo/ciclo_vital.py, exponente=8) casi
    # desde el principio. Conejo/ardilla comparten la misma regla de
    # siembra Y longevidades igual de cortas (1-3, 2-5 anios) pero la
    # compensan con reproduccion mucho mas rapida -- lobo NO, ver el
    # arreglo real en poblacion.rangos_raciales.lobo.factor_base_concepcion
    # (config/poblacion.yaml) para la otra mitad de este fix.
    #
    # Con AMBOS arreglos juntos (estos dos valores + factor_base_concepcion
    # x4.5), medido en las MISMAS 12 semillas nuevas: extincion de lobo
    # bajo de 12/12 (sin nada) o 9/12 (solo estos dos valores, sin subir
    # concepcion) a 8/12 -- mejora real, sustancial, pero NO una solucion
    # completa: sigue habiendo extincion en 8 de 12 semillas nuevas.
    # PROVISIONALES, sin calibrar contra el harness completo. Alcance
    # deliberadamente limitado a lobo via este mismo override por especie
    # que ya usaba tasa_perdida_saciedad_por_tick -- gnomo/conejo/ardilla/
    # caballo, sin entrada propia aqui, siguen usando el valor universal
    # de necesidades.defecto sin ningun cambio de comportamiento.
    tasa_perdida_saciedad_por_tick: 0.0008
    probabilidad_muerte_saciedad_critica: 0.0004
    # tasa_perdida_hidratacion_por_tick/probabilidad_muerte_deshidratacion
    # (2026-09-09, auditoria comparativa de causas de muerte contra caballo
    # -- ver CLAUDE.md, harness_calibracion.py primera corrida completa):
    # lobo nunca habia recibido este mismo alivio que ya tienen gnomo/
    # ardilla, pese a tener la tasa de deshidratacion mas alta del
    # catalogo tras caballo/gnomo/ardilla ya corregidos (6.7x la de
    # caballo, normalizado por exposicion individuo-tick) -- combinada con
    # inanicion tambien elevada (9.3x caballo), lobo llegaba a 53% de
    # extincion en el harness completo (15x12000). A/B real antes de
    # aplicar (6 semillas nuevas x 6000 ticks, aislado, sin tocar
    # concepcion/camada de nuevo): extincion de lobo baja de 4/6 (67%,
    # control con la config vigente) a 0/6 con este alivio -- senal limpia
    # y fuerte, sin el patron de sobrecorreccion ya visto con
    # ardilla/conejo (lobo nunca se ha acercado a explotar, poblacion
    # maxima observada 16 en la muestra). Mismos valores que el resto del
    # catalogo ya corregido. PROVISIONAL, sin calibrar contra el harness
    # completo con este cambio ya aplicado.
    tasa_perdida_hidratacion_por_tick: 0.0008
    probabilidad_muerte_deshidratacion: 0.0004
  ardilla:
    # RECALIBRADO 2026-09-06 (investigacion de estabilidad de poblacion,
    # ver CLAUDE.md -- ardilla se extinguio en el 100% de mas de 90
    # semillas probadas ese dia, insensible a "parejas fundadoras",
    # radio de pareja ampliado, subir su propia concepcion sola, y a
    # eliminar gnomo del mundo por completo (descarta competencia de
    # comida). Desglose de causas de muerte: inanicion 65.6%, vejez
    # 18.0%, depredacion 16.4% -- consistente en varias mediciones,
    # vejez NUNCA domino como en lobo (extincion demasiado temprana,
    # tick 1500-3700, para que la poblacion llegue a envejecer). Un
    # ajuste ANTERIOR de este mismo par de valores (0.0008/0.0004,
    # identico al de lobo) probado EN SOLITARIO (sin tocar concepcion)
    # dio resultado inconsistente entre dos lotes de 5 semillas nuevas
    # (60% extincion en uno, 100% en el otro) -- no bastaba por si solo.
    #
    # HALLAZGO REAL: la combinacion de este par de valores CON subir
    # factor_base_concepcion (poblacion.rangos_raciales.ardilla, ver
    # config/poblacion.yaml) x4.5 -- la misma combinacion que ya
    # funciono para lobo, nunca antes probada junta para ardilla
    # (se habian probado por separado, cada una sin efecto o
    # inconsistente en solitario) -- si funciono: 3 de 3 semillas
    # probadas con poblacion de ardilla real y sostenida (11, 3, y 412
    # individuos -- esta ultima disparo el tope de seguridad del propio
    # arnes de diagnostico). Contraste crudo frente a las mas de 90
    # semillas previas del mismo dia, todas con ardilla extinta.
    #
    # PROVISIONAL, sin calibrar contra el harness completo (15 semillas
    # x 12000 ticks) ni contra un lote mayor de semillas nuevas todavia
    # -- verificacion adicional pendiente antes de darlo por cerrado del
    # todo, mismo criterio de honestidad que el resto del proyecto.
    tasa_perdida_saciedad_por_tick: 0.0008
    probabilidad_muerte_saciedad_critica: 0.0004
    # tasa_perdida_hidratacion_por_tick/probabilidad_muerte_deshidratacion
    # (2026-09-09, ver herramientas/harness_calibracion.py -- primera
    # corrida completa de 15x12000): el harness completo revelo que
    # ardilla se extingue en el 73% de 15 semillas nuevas, deshidratacion
    # como causa dominante (53.8% de sus muertes, frente a solo 5.6% en
    # caballo) -- explicado por la altura (config/poblacion.yaml): ardilla
    # es la especie mas baja del catalogo (0.15-0.25m) y
    # profundidad_agua_potable(celda) <= altura le impide vadear la
    # mayoria de fuentes de agua que si alcanza una especie mas alta
    # (caballo, 1.4-1.8m) -- una consecuencia real y coherente del
    # mecanismo ya existente, no un bug, cuya severidad nunca se habia
    # medido a esta escala. A/B real antes de aplicar (6 semillas nuevas
    # x hasta 8000 ticks, en paralelo): 0/6 extincion con el alivio
    # frente a 3/6 sin el, sin el patron de sobrecorreccion que si
    # aparecio con conejo (poblaciones de magnitud comparable en ambas
    # condiciones). Mismos valores que gnomo/lobo, por el mismo motivo
    # (ya era el peor par del catalogo). PROVISIONAL, sin calibrar contra
    # el harness completo.
    tasa_perdida_hidratacion_por_tick: 0.0008
    probabilidad_muerte_deshidratacion: 0.0004
  gnomo:
    # RECALIBRADO 2026-09-06 (investigacion de estabilidad de poblacion,
    # ver CLAUDE.md y poblacion.rangos_raciales.gnomo.factor_base_concepcion
    # para el mismo recetario ya aplicado a lobo/ardilla). Gnomo era el
    # bloqueo dominante restante tras cerrar el fix de ardilla -- 80% de
    # extincion en la ultima verificacion, sin ningun ajuste propio hasta
    # ahora. Mismo par de valores ya usado para lobo/ardilla.
    #
    # PROVISIONAL, sin calibrar. Diferencia real a vigilar frente a
    # lobo/ardilla: la gestacion de gnomo (4800-6240 ticks) es del mismo
    # orden que la ventana de verificacion completa (6000-8000 ticks), y
    # su camada esta fija en 1 (sin compensacion posible) -- el efecto de
    # esta combinacion podria ser mas limitado que en lobo/ardilla,
    # verificar contra el motor real antes de darlo por suficiente.
    tasa_perdida_saciedad_por_tick: 0.0008
    probabilidad_muerte_saciedad_critica: 0.0004
    # tasa_perdida_hidratacion_por_tick/probabilidad_muerte_deshidratacion
    # (2026-09-08, ver CLAUDE.md "raza consciente" -- investigacion de
    # deshidratacion): medido con un A/B real que aplicar el mismo
    # alivio de forma UNIVERSAL dispara a conejo (333->702 en la
    # semilla probada) -- mismo patron de sobrecorreccion ya visto una
    # vez con el alivio de hambre de conejo. Aplicado aqui SOLO a
    # gnomo, mismo patron especie-por-especie ya usado con hambre
    # (lobo->ardilla->gnomo->conejo), en vez de universal. Mismos
    # valores que la tasa/probabilidad de saciedad de gnomo, por
    # simetria de partida. PROVISIONAL, sin calibrar.
    tasa_perdida_hidratacion_por_tick: 0.0008
    probabilidad_muerte_deshidratacion: 0.0004
  conejo:
    # AÑADIDO 2026-09-06 (misma investigacion de estabilidad de poblacion,
    # ver CLAUDE.md -- "conejo confirmado como nuevo eslabon debil"). A
    # diferencia de lobo/ardilla/gnomo, conejo nunca tuvo entrada propia
    # aqui -- seguia con los valores universales de `defecto` mientras las
    # otras tres ya bajaron a este mismo par. Medido en 8 semillas nuevas:
    # 50% de extincion, inanicion como causa dominante (73%) -- mismo
    # patron que las otras tres antes de su fix.
    #
    # A diferencia de lobo/ardilla/gnomo (que necesitaban tambien subir su
    # concepcion, la peor del catalogo), la de conejo ya era la mejor
    # (factor_base_concepcion=0.015, poblacion.yaml) -- no se toca aqui.
    # Probado en aislamiento (A/B, 5 semillas nuevas x hasta 6000 ticks):
    # quita la extincion (0/5) pero SOBRECORRIGE con fuerza, disparando a
    # 500-700 individuos sin estabilizarse dentro de la ventana medida --
    # conejo ya tenia la mejor reproduccion del catalogo (camada 3-7,
    # gestacion 15-25 dias) antes de aliviarle el hambre, asi que quitar
    # el freno de mortalidad sin ningun otro freno que compense dispara la
    # poblacion. Mitigado aqui bajando tambien el techo de camada (ver
    # poblacion.rangos_raciales.conejo.camada) en vez de revertir este
    # ajuste de hambre -- decision de Diego, sin volver a correr el motor
    # tras este cambio combinado (PROVISIONAL, sin verificar).
    tasa_perdida_saciedad_por_tick: 0.0008
    probabilidad_muerte_saciedad_critica: 0.0004
    # tasa_perdida_hidratacion_por_tick/probabilidad_muerte_deshidratacion
    # (2026-09-09, auditoria de estabilizacion -- ver CLAUDE.md y
    # herramientas/harness_calibracion.py). El harness completo de
    # 15x12000 confirmo deshidratacion como el segundo factor de muerte
    # de conejo (26.8% de sus muertes, 17.9x la tasa de caballo
    # normalizada por exposicion individuo-tick) y un factor consistente
    # en las semillas que se extinguen (25-47% de sus muertes). Probado
    # EN SOLITARIO primero (A/B, 6 semillas nuevas): NO redujo la
    # extincion por si solo (seguia en 1/6), solo desplazo hacia arriba
    # las poblaciones que sobrevivian -- confirma que conejo necesitaba
    # el mismo patron de DOS ingredientes que ya uso lobo/gnomo/ardilla
    # (mitigar mortalidad + restaurar algo de fecundidad, ver
    # poblacion.rangos_raciales.conejo.camada/factor_base_concepcion
    # para la otra mitad del fix). Mismos valores que el resto del
    # catalogo ya corregido. PROVISIONAL, sin calibrar contra el harness
    # completo con este cambio ya aplicado.
    tasa_perdida_hidratacion_por_tick: 0.0008
    probabilidad_muerte_deshidratacion: 0.0004
  caballo:
    # AÑADIDO 2026-09-07 (investigacion de estabilidad de poblacion, ver
    # CLAUDE.md). Caballo (especie mas nueva del catalogo, 2026-09-05)
    # nunca recibio este recetario -- seguia con los valores universales
    # de `defecto` (los mismos que ya resultaron insuficientes para
    # lobo/ardilla/gnomo/conejo antes de sus propios fixes). Medido en un
    # lote de 6 semillas nuevas x 4000 ticks: caballo fue la UNICA
    # especie con extincion real (2/6 semillas), inanicion como causa
    # dominante en las 6 (3-12 muertes por semilla) -- mismo patron ya
    # visto en las otras cuatro antes de aplicarles esto. Mismo par de
    # valores que lobo/ardilla/gnomo/conejo.
    tasa_perdida_saciedad_por_tick: 0.0008
    probabilidad_muerte_saciedad_critica: 0.0004

  venado:
    # AÑADIDO 2026-09-09 (arco de biodiversidad de fauna, ver
    # docs/superpowers/specs/2026-09-09-especie-venado-design.md).
    # Arranca YA con el mismo par de hambre/sed que esta sesion confirmo
    # estable en gnomo/lobo/ardilla -- evita repetir el ciclo de caballo
    # (nacio con `defecto`, se corrigio dias despues tras confirmarse
    # fragilidad real).
    tasa_perdida_saciedad_por_tick: 0.0008
    probabilidad_muerte_saciedad_critica: 0.0004
    tasa_perdida_hidratacion_por_tick: 0.0008
    probabilidad_muerte_deshidratacion: 0.0004

  cabra_montes:
    # AÑADIDO 2026-09-09 (arco de biodiversidad de fauna, ver
    # docs/superpowers/specs/2026-09-09-especie-cabra-montes-design.md).
    # Mismo par ya validado, mismo criterio que venado.
    tasa_perdida_saciedad_por_tick: 0.0008
    probabilidad_muerte_saciedad_critica: 0.0004
    tasa_perdida_hidratacion_por_tick: 0.0008
    probabilidad_muerte_deshidratacion: 0.0004

consumo:
  tasa_consumo_al_comer: 0.5
  tasa_consumo_al_beber: 0.2
  # tasa_cocinar_kg_tick (2026-09-08, ver docs/superpowers/specs/
  # 2026-09-08-como-cocinar-design.md): cuanto se transforma de crudo a
  # elaborado por tick de Accion.COCINAR -- mismo orden de magnitud que
  # tasa_consumo_al_comer. PROVISIONAL, sin calibrar.
  tasa_cocinar_kg_tick: 0.5
  # factor_bono_tasa_cocina_comun (2026-09-08, cocinas comunes -- ver
  # docs/superpowers/specs/2026-09-08-cocinas-comunes-design.md):
  # cocinar en una cocina comun es mas rapido que con una Fogata
  # individual. PROVISIONAL, sin calibrar.
  factor_bono_tasa_cocina_comun: 2.0

decision:
  utilidad_deambular_base: 0.1
  # utilidad_socializar_base (2026-09-06, ocio consciente -- ver
  # docs/superpowers/specs/2026-09-06-ocio-consciente-socializar-design.md):
  # utilidad FIJA de Accion.SOCIALIZAR antes de modular por
  # Temperamento.sociabilidad/curiosidad (la utilidad final es
  # base * (sociabilidad + curiosidad) / 2). Mismo criterio que
  # utilidad_deambular_base: un valor constante para un comportamiento de
  # fondo en vez de una magnitud derivada de una Necesidades que no existe
  # para esto (expresamente SIN drive dinamico nuevo). PROVISIONAL: por
  # encima de deambular (0.1) para que un consciente muy sociable/curioso
  # prefiera socializar sobre vagar sin rumbo cuando ambas compiten con
  # necesidades ya cubiertas, sin calibrar contra el harness completo.
  utilidad_socializar_base: 0.3
  # umbral_crisis_interrupcion (2026-08-29, ley B de compromiso de
  # satisfaccion -- ver sistemas/sistema_decision.py): por debajo de este
  # valor en CUALQUIER necesidad fisica distinta de la que la accion
  # comprometida esta resolviendo, el compromiso se levanta y decide el
  # argmax normal (el hambre real despierta a quien duerme, la incomodidad
  # leve no). PROVISIONAL: 0.2 es la hipotesis de partida razonada del
  # diseno con Diego, sin calibrar contra el harness completo (15 semillas
  # x 12000 ticks) -- solo contra el arnes de diagnostico de microsuenos
  # (semilla 42, 3000 ticks).
  umbral_crisis_interrupcion: 0.2
  # umbral_atencion_pareja (2026-08-29, tercer gate de BUSCAR_PAREJA --
  # ver sistemas/sistema_decision.py): ninguna busqueda de pareja con
  # CUALQUIER necesidad fisica con accion de satisfaccion (saciedad/
  # energia/hidratacion/aliviado) por debajo de este valor -- la utilidad
  # de pareja se fuerza a 0.0. Corrige la inconsistencia entre la intencion
  # documentada ("buscar pareja no compite por delante de las fisicas") y
  # la implementacion, visible tras la ley B: criaturas en crisis total
  # buscando pareja mientras morian de inanicion (impulso decaido a 0.0 da
  # utilidad 1.0, maxima). PROVISIONAL: 0.5 es la hipotesis de partida
  # razonada del diseno con Diego, sin calibrar contra el harness completo.
  umbral_atencion_pareja: 0.5
  # Umbral de CapacidadMental.consciencia por debajo del cual una criatura
  # queda sujeta al sesgo de territorio (sistemas/sistema_movimiento.py):
  # tiende a permanecer cerca de comida/agua recordadas en vez de
  # deambular erráticamente sin objetivo (2026-08-22, propuesta de Diego).
  # PROVISIONAL: 0.3 es una hipótesis de partida razonada, no calibrada
  # contra el motor en marcha -- separa con margen a lobo/conejo/ardilla
  # (rango racial de consciencia 0.0-0.2 o 0.0-0.1) de gnomo (0.6-0.9),
  # de modo que hoy solo gnomo queda EXENTO del sesgo de territorio. Si al
  # observar el motor conviene que alguna otra especie también quede
  # exenta o incluida, este umbral es el primer sitio a ajustar.
  umbral_consciencia_agencia: 0.3
  # utilidad_construir_base (2026-08-30, refugio construido -- ver
  # componentes/construccion.py, nucleo/construccion.py y
  # sistemas/sistema_decision.py): utilidad FIJA de Accion.CONSTRUIR
  # cuando su compuerta se abre (consciente, sin refugio propio terminado,
  # con algo de material apto en el Inventario) -- mismo criterio que
  # utilidad_deambular_base, un valor constante para un comportamiento de
  # fondo en vez de una magnitud derivada de una Necesidades que no existe
  # para esto. Por encima de deambular (para que construir gane cuando hay
  # material a mano) pero por debajo de cualquier necesidad física en
  # crisis real -- un gnomo no debería morirse de hambre por seguir
  # construyendo. PROVISIONAL, sin calibrar contra el motor en marcha.
  utilidad_construir_base: 0.3
  # utilidad_cocinar_base (2026-09-08, ver docs/superpowers/specs/
  # 2026-09-08-como-cocinar-design.md): base FIJA, no derivada de una
  # necesidad -- cocinar es preparar para mas tarde, no una urgencia
  # (a diferencia de ENCENDER_FUEGO). Por debajo de utilidad_construir_
  # base -- terminar el refugio propio pesa mas que cocinar. PROVISIONAL,
  # sin calibrar.
  utilidad_cocinar_base: 0.25
  # utilidad_recolectar_base (2026-08-30, Círculo C -- ver
  # nucleo/construccion.py:material_suficiente_para_refugio): por encima
  # de utilidad_construir_base a propósito -- mientras falte material,
  # recolectar gana sobre construir aunque ya se lleve algo encima (mejor
  # completar la carga antes del viaje que ir y volver por poco). En
  # cuanto material_suficiente_para_refugio se cumple (o el inventario se
  # llena), la utilidad de recolectar cae a 0.0 y construir toma el
  # relevo con lo que se lleve. PROVISIONAL, sin calibrar contra el motor
  # en marcha.
  utilidad_recolectar_base: 0.35

capacidad_fisica:
  tasa_perdida_resistencia_por_esfuerzo: 0.05

# Inventario -- FUNDAMENTO de la fase de interacción física (2026-08-30,
# ver componentes/inventario.py y nucleo/inventario.py). Capacidad ligada
# al propio peso (Diego: "depende de tu capacidad física de portarlos"),
# sin límite de variedad de materiales, solo de peso total.
inventario:
  # PROVISIONAL: orden de magnitud real de carga sostenible (una persona
  # puede cargar de forma sostenida en torno al 20-30% de su propio
  # peso), no medido contra el motor en marcha -- sin ninguna acción que
  # llene un Inventario todavía, no hay nada que observar aún.
  fraccion_carga_maxima: 0.25
  # fraccion_provisiones_maxima (2026-09-07, ver componentes/inventario.py:
  # Inventario.provisiones): capacidad TOTALMENTE INDEPENDIENTE de
  # fraccion_carga_maxima -- deliberadamente mucho menor, "un par de dias
  # de raciones" en vez de "todo lo que quepa". PROVISIONAL, sin calibrar
  # contra el motor en marcha.
  fraccion_provisiones_maxima: 0.05

capacidad_mental:
  tasa_perdida_estabilidad_por_amenaza: 0.02
  penalizacion_estabilidad_presenciar_muerte: 0.15

crisis_mental:
  umbral_estabilidad_crisis: 0.0
  umbral_valentia_huida_erratica: 0.3
  umbral_agresividad_violenta: 0.6

ciclo_vital:
  # RECALIBRADO 2026-08-23: el valor original (0.3, exponente fijo 2)
