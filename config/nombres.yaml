# ==============================================================================
# config/nombres.yaml
# Catálogo de nombres propios por especie y sexo
#
# Primer círculo del arco "hilo individual" (ver docs/superpowers/specs/
# 2026-09-04-nombre-propio-design.md). Generación por sílabas fijas
# combinadas al azar: nombre = prefijo + sufijo (concatenación directa, sin
# separador) -- prefijos terminados en consonante y sufijos que empiezan en
# vocal, para que la concatenación suene natural.
#
# Solo "gnomo" está poblado -- única especie consciente hoy
# (decision.umbral_consciencia_agencia, config/fisiologia.yaml). El resto de
# especies queda deliberadamente sin entrada; acceso permisivo por .get() en
# el código consumidor, sin romper si una especie no tiene catálogo.
#
# PROVISIONAL: contenido curado a mano por Diego + Claude (2026-09-04), sin
# ninguna revisión más allá de que suene razonable -- candidato a ajuste si
# al verlo en la crónica real algo desentona. Sílabas originales, sin
# reutilizar nombres reconocibles de ninguna obra existente.
# ==============================================================================

nombres:
  gnomo:
    prefijos_masculinos: [Grod, Thal, Bram, Dorn, Krug, Fenn, Borg, Ulm]
    sufijos_masculinos: [in, ar, und, eld, ol, ir, un, ash]
    prefijos_femeninos: [Brin, Isel, Mor, Thal, Sil, Grim, Fenn, Ver]
    sufijos_femeninos: [a, ia, eda, ith, ora, una, en, elda]

# Nombres de ASENTAMIENTO (2026-09-15, ver docs/superpowers/specs/
# 2026-09-15-nombre-cronica-asentamiento-design.md) -- mismo mecanismo
# (prefijo+sufijo concatenados) pero catálogo propio de topónimo, nunca
# nombre de persona, y sin distinción de sexo (un lugar no tiene sexo).
# PROVISIONAL, curado a mano por Diego + Claude el mismo criterio que
# nombres.gnomo -- candidato a ajuste si algo desentona en la crónica
# real.
#
# Prefijos TEMÁTICOS (2026-09-15, corrección tras feedback de Diego --
# "eso no se diferencia mucho de una generación de nombres común"):
# reemplazan a `prefijos` (nunca a `sufijos`, que sigue siendo el mismo
# catálogo siempre) cuando la celda de fundación tiene un rasgo
# geográfico real notable (agua o montaña, ver
# nucleo/asentamiento.py:rasgo_geografico_notable) y la tirada de
# probabilidad lo confirma (asentamiento.probabilidad_nombre_tematico,
# config/comportamiento.yaml) -- mezcla deliberada, no determinista:
# un asentamiento junto a un río NO siempre se llama por el río.
nombres_asentamiento:
  prefijos: [Kar, Dun, Bel, Thorn, Grim, Fen, Hol, Bar, Sten, Wyn, Mar, Vor]
  sufijos: [ord, ale, olm, ing, ara, eth, un, ir, ost, ada, om, ern]
  prefijos_agua: [Vad, Rib, Font, Reman]
  prefijos_montana: [Alt, Cim, Peñ, Risc]
