# ==============================================================================
# config/comportamiento.yaml
# Percepción, movimiento, gregarismo/territorio y memoria espacial
#
# Parte del catálogo de configuración del motor "Un mundo vivo", antes unificado
# en un único config/constantes.yaml (dividido en ficheros por categoría el
# 2026-08-30, a petición de Diego) -- todos los ficheros de config/*.yaml se
# cargan y fusionan en un solo diccionario (main.py:cargar_configuracion), así
# que ninguna sección cambia de nombre ni de forma de acceso al dividirse.
# ==============================================================================

percepcion:
  radio_minimo_celdas: 0
  radio_maximo_celdas: 4
  # radio_minimo/maximo_pareja_celdas (2026-09-06, ver
  # docs/superpowers/specs/2026-09-06-radio-busqueda-pareja-design.md --
  # PR #19, verificado y mergeado en la investigacion de estabilidad de
  # 2026-09-07): Accion.BUSCAR_PAREJA gana un radio de percepcion PROPIO
  # y mayor que el generico de comida/agua/amenaza, para que las
  # generaciones posteriores a la fundadora puedan detectar y alcanzar
  # pareja a tiempo. PROVISIONAL, sin calibrar contra el harness
  # completo.
  radio_minimo_pareja_celdas: 3
  radio_maximo_pareja_celdas: 12
  # radio_minimo/maximo_agua_celdas (2026-09-07, investigacion de
  # estabilidad de poblacion -- ver CLAUDE.md): medido contra el mundo
  # real (4 semillas) que solo el 3.3%-11.1% de las celdas tienen agua
  # potable (permanente + charco), frente al 100% de celdas con sustrato
  # recolectable -- el radio generico (0-4 celdas, 81 celdas exploradas
  # como maximo) deja con frecuencia CERO agua visible en semillas de
  # baja cobertura hidrica, sobre todo porque rios/lagos/pozas son
  # clusters contiguos, no dispersos uniformemente (varianza real mucho
  # mayor que la cobertura media sugeriria). Confirmado como causa real
  # de mortalidad: deshidratacion fue causa de 15-36 muertes de ardilla y
  # 19-108 de conejo por semilla en un lote de 6 semillas x 4000 ticks
  # (antes de este fix). Mismo patron que radio_pareja de arriba, radio
  # propio solo para Accion.BEBER -- sin tocar el radio generico de
  # comida/amenaza. PROVISIONAL, sin calibrar contra el harness completo.
  radio_minimo_agua_celdas: 2
  radio_maximo_agua_celdas: 8

movimiento:
  coste_resistencia_pendiente: 0.05
  coste_resistencia_sprint: 0.08
  umbral_resistencia_agotamiento: 0.05

social:
  distancia_deseada_conspecifico: 1
  distancia_deseada_territorio: 1
  # GREGARISMO -- Pieza 1 (2026-08-30, ver nucleo/disposicion.py:
  # contar_conspecificos_cercanos para el diseno completo). Radio
  # compartido por el bono de caza en grupo (sistema_depredacion.py) y el
  # bono de defensa en grupo (sistema_necesidades.py) -- un unico radio
  # "de apoyo grupal" en vez de dos radios separados por consumidor
  # (reutiliza antes de inventar). Mas amplio que
  # distancia_deseada_conspecifico (1, la distancia a la que ya se
  # considera "junto a" alguien) porque aqui se trata de percibir aliados
  # cercanos, no de haber llegado a su lado -- del mismo orden que
  # percepcion.radio_maximo_celdas (4). PROVISIONAL, valor de partida
  # razonado, no calibrado contra el motor en marcha todavia.
  radio_apoyo_grupal: 3
  # Bono de defensa en grupo: cada conespecifico percibido dentro de
  # radio_apoyo_grupal reduce el drenaje de seguridad por amenaza
  # (necesidades.defecto.tasa_perdida_seguridad_por_amenaza) en esta
  # fraccion, escalado por Temperamento.sociabilidad DIRECTA del propio
  # individuo (mismo criterio sin escalar que el sesgo gregario de
  # deambular, sistema_movimiento.py) -- un individuo mas sociable saca
  # mas partido de estar rodeado. bono_defensa_maximo topa la reduccion
  # total (nunca anula el drenaje por completo: seguir habiendo una
  # amenaza real sigue siendo una amenaza real, por muchos aliados que
  # haya alrededor). PROVISIONAL, sin validar contra el harness completo.
  # HONESTIDAD (2026-08-30): la verificacion de 3 semillas x 3000 ticks de
  # esta pieza (ver depredacion.bono_caza_por_aliado mas abajo) midio
  # poblacion final, que refleja el efecto COMBINADO de ambos bonos (caza
  # y defensa) a la vez -- no se aislo el bono de defensa por separado. No
  # hay motivo para sospechar el mismo riesgo de sobreexplotacion (reduce
  # una perdida, no aumenta una captura), pero tampoco esta confirmado de
  # forma aislada -- pendiente si hiciera falta mas confianza especifica.
  bono_defensa_por_aliado: 0.15
  bono_defensa_maximo: 0.6

memoria:
  # CORRECCION 2026-08-23 (encontrado de paso, no lo que se pedia):
  # estas tres claves se llamaban capacidad_minima/capacidad_maxima/
  # factor_error_por_distancia -- ninguna coincidia con lo que lee
  # nucleo/memoria.py (min_recuerdos_por_categoria/
  # max_recuerdos_por_categoria/factor_imprecision_distancia), asi que el
  # codigo caia siempre en sus valores por defecto (1, 5, 0.2). Coincidia
  # por casualidad en capacidad (1 y 5); factor_imprecision_distancia
  # llevaba desde siempre usando 0.2 en vez del 0.3 aqui configurado, sin
  # que nada lo advirtiera. Renombradas para que el yaml controle de
  # verdad lo que dice controlar.
  min_recuerdos_por_categoria: 1
  max_recuerdos_por_categoria: 5
  factor_imprecision_distancia: 0.3
  # prob_purgar_recuerdo_agotado (2026-08-23, PROVISIONAL -- ver
  # sistema_recursos.py:_resolver_comer/_resolver_beber y el diagnostico
  # de extincion local semilla 1): probabilidad, en CADA visita fallida a
  # una coordenada recordada de comida/agua ya agotada, de descartar ese
  # recuerdo -- en vez de purgarlo al primer fallo (lo que se probo
  # primero y funcionaba muy bien en 4 de 5 semillas de referencia, pero
  # extinguia una quinta: descartaba de golpe un recuerdo que, dado
  # margen, habria vuelto a dar fruto tras la regeneracion diaria de
  # sistema_flora.py). Con esta probabilidad baja, un individuo detenido
  # en un punto muerto reintenta varias veces antes de rendirse -- da
  # margen real a la regeneracion (que corre una vez por dia,
  # Reloj.TICKS_POR_DIA=24 ticks) sin conservar el recuerdo para siempre.
  # Valor de partida razonado, no derivado con precision -- contrastado
  # contra el harness de calibracion (5 semillas x 6000 ticks): 0.05
  # (espera esperada de ~20 ticks) NO bastaba para salvar la semilla 3 de
  # referencia (seguia extinguiendose); 0.15 y 0.30 si, en ambos casos con
  # crecimiento poblacional fuerte. Se deja en 0.15 (espera esperada de
  # ~6-7 intentos) como punto medio -- mismo estatus provisional que el
  # resto de esta seccion, pendiente de mas semillas si hiciera falta mas
  # confianza.
  prob_purgar_recuerdo_agotado: 0.15

# --- Asentamiento (2026-08-30, "el germen de un asentamiento") -----------
# Detección de clúster de refugios individuales y cálculo de liderazgo --
# ver nucleo/asentamiento.py y sistemas/sistema_asentamiento.py.
# PROVISIONAL en su totalidad, sin calibrar contra el motor en marcha.
asentamiento:
  # Cuántos refugios TERMINADOS distintos, agrupados por proximidad,
  # hacen falta para que el clúster cuente como asentamiento -- por
  # debajo de esto, un par de refugios cercanos siguen siendo solo eso,
  # un par de refugios cercanos, no un asentamiento.
  poblacion_minima_asentamiento: 3
  # Radio Manhattan (en celdas) dentro del cual dos refugios se
  # consideran parte del mismo clúster -- más amplio que
  # social.radio_apoyo_grupal (3, percepción táctica inmediata) porque
  # aquí se agrupa geografía persistente, no proximidad instantánea.
  radio_cluster_celdas: 6
  # Liderazgo (nucleo/asentamiento.py:calcular_liderazgo): candidatos =
  # miembros cuya dominancia está a menos de este margen del máximo del
  # grupo.
  margen_dominancia_elite: 0.1
  # Descalificación por reputación (Círculo 5b, 2026-09-06 -- ver
  # nucleo/asentamiento.py:calcular_liderazgo y spec
  # docs/superpowers/specs/2026-09-06-lealtad-liderazgo-design.md): un
  # candidato dominante cuya afinidad MEDIA recibida del resto del grupo
  # cae por debajo de este umbral (negativo) queda fuera de la elección
  # aunque sea el más dominante. Actúa DESPUÉS del filtro de dominancia;
  # si todos los candidatos quedan descalificados, el asentamiento se
  # queda sin líder ese día. PROVISIONAL, sin calibrar.
  umbral_reputacion_descalificante: -0.4
  # Consejo vs. líder único: se forma consejo cuando
  # (cohesión_social - agresividad_media) de los candidatos supera este
  # umbral, ajustado a la baja por población (más miembros, más fácil
  # sostener un consejo sin que cada uno tenga que dominar personalmente
  # a todos).
  umbral_cohesion_consejo: 0.5
  reduccion_umbral_consejo_por_miembro: 0.01
  # Aporte al almacén (Círculo E, 2026-08-30 -- ver
  # nucleo/asentamiento.py:disposicion_a_aportar): umbral de excedente
  # propio (por encima del mínimo de saciedad/hidratación) que hace
  # falta antes de estar dispuesto a aportar, modulado por carácter --
  # empatía+lealtad lo bajan, agresividad lo sube. Deliberadamente NO
  # una ley absoluta ("solo aporta con las necesidades completamente
  # resueltas"), a petición explícita de Diego.
  excedente_base_para_aportar: 0.3
  reduccion_umbral_por_empatia_lealtad: 0.15
  aumento_umbral_por_agresividad: 0.2

# --- Conflicto (2026-08-30, resolutor genérico de disputas) --------------
# nucleo/conflicto.py:resolver_disputa. Primer consumidor: refugio
# ocupado (sistema_movimiento.py). PROVISIONAL en su totalidad, sin
# calibrar contra el motor en marcha.
conflicto:
  # Cohesión social mínima (sociabilidad+empatía promediadas de AMBOS)
  # para que dos miembros del mismo asentamiento compartan en vez de
  # disputar.
  umbral_cohesion_comparte: 0.4
  # Bono de cohesión (2026-09-04, círculo 5 "hilo individual", ver
  # nucleo/parentesco.py) sumado a la cohesión cuando A y B son familia
  # directa (padre/madre-hijo o hermanos) -- se suma con independencia
  # de si comparten asentamiento. No garantiza COMPARTE, solo lo hace
  # más probable. PROVISIONAL, sin calibrar.
  bono_cohesion_familia: 0.2
  # Diferencia de índice de asertividad por debajo de la cual se
  # considera "empate reñido" -- sin retirada limpia si además ambos
  # son agresivos.
  umbral_empate_renido: 0.1
  umbral_agresividad_enfrentamiento: 0.5
  # Coste de perder una disputa (o de un enfrentamiento) -- drena
  # Necesidades.seguridad, el mismo campo que ya drena cualquier
  # amenaza (nucleo/amenaza.py). Sube la propia utilidad_huir la
  # próxima decisión -- el perdedor tiende a irse por su cuenta a
  # través del mecanismo de huida ya existente, sin desplazamiento
  # forzado escrito aquí.
  drenaje_seguridad_perdedor: 0.3
  drenaje_seguridad_enfrentamiento: 0.2
  # Roce social (2026-09-06, Conflicto verbal -- ver
  # docs/superpowers/specs/2026-09-06-conflicto-verbal-design.md):
  # probabilidad de friccion entre dos conscientes que comparten celda
  # exacta, modulada por agresividad combinada y por el gradiente de
  # estres (1 - PoolMental.estabilidad del mas inestable de ambos) --
  # el mismo pool que dispara la crisis, aqui como modulador continuo.
  # Elegidas para ser sensiblemente mas frecuentes que CRISIS_VIOLENTA
  # (estado raro) sin disparar cada tick entre todo par que conviva en
  # un asentamiento. PROVISIONAL, sin calibrar contra el harness.
  probabilidad_base_roce_social: 0.01
  peso_agresividad_roce: 0.05
  peso_estres_roce: 0.05

# Manada -- estructuras gregarias reales en fauna (2026-09-07, ver
# nucleo/manada.py, sistemas/sistema_manada.py y spec
# docs/superpowers/specs/2026-09-07-manada-fauna-design.md).
manada:
  # Radio Manhattan (en celdas) dentro del cual conespecificos de la
  # misma especie y zona se agrupan en una manada -- mayor que
  # asentamiento.radio_cluster_celdas (6) porque la fauna roza mas
  # terreno que un refugio fijo. PROVISIONAL, sin calibrar.
  radio_manada_celdas: 8
