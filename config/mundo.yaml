# ==============================================================================
# config/mundo.yaml
# Mundo: topología, semilla, persistencia, generación causal de terreno y relieve
#
# Parte del catálogo de configuración del motor "Un mundo vivo", antes unificado
# en un único config/constantes.yaml (dividido en ficheros por categoría el
# 2026-08-30, a petición de Diego) -- todos los ficheros de config/*.yaml se
# cargan y fusionan en un solo diccionario (main.py:cargar_configuracion), así
# que ninguna sección cambia de nombre ni de forma de acceso al dividirse.
# ==============================================================================

mundo:
  # AMPLIADO 2026-08-23 (28->40, decisión delegada por Diego): la
  # población fundadora se triplicó (28->84 individuos) desde la
  # calibración de referencia (informe de implementación 7.39-7.45,
  # mapa 20x20) mientras el mapa solo se dobló (20x20->28x28), subiendo
  # la densidad real un 53% (0.07->0.107 individuos/celda) en la
  # dirección CONTRARIA a la que el propio informe técnico (sección 20)
  # dejó pendiente ("población inicial menor" o "mapa más grande" como
  # palancas alternativas). 40x40 baja la densidad a 0.0525
  # individuos/celda, un 25% por debajo del baseline calibrado de 7.45,
  # sin tocar la población fundadora que Diego ya había decidido.
  # PROVISIONAL en el sentido de que no se ha repetido el harness
  # completo de 7.39/7.45 (15 semillas x 12000 ticks) sobre este valor
  # -- ver smoke test de calibración ligera en el commit que acompaña
  # este cambio para una primera señal, no una validación definitiva.
  grid_ancho: 40
  grid_alto: 40
  metros_por_celda: 10

semilla_por_defecto: 42

persistencia:
  # PROVISIONAL, sin calibrar contra el coste real de guardar_snapshot a
  # escala (ver main.py) -- hipótesis de partida, no una cifra medida.
  guardar_cada_dias: 5

generacion_mapa:
  # Círculo 1 (2026-08-27): la generación es CAUSAL -- la elevación nace de
  # cordilleras sorteadas (nucleo/orografia.py) y el clima se deriva del
  # relieve. Los tres valores de escala de ruido que vivían aquí
  # (elevacion/lluvia/temperatura_escala_celdas) desaparecieron con esa ley;
  # mundos guardados con la ley anterior quedaron invalidados (decisión de
  # Diego). Leyes y pruebas: tests/test_orografia.py.
  rio_ancho: 1
  recurso_prob_expansion: 0.5
  orografia:
    num_cordilleras: [1, 3]        # sorteo: cuántas cordilleras tiene el mundo
    longitud_min: 0.50             # fracción del lado mayor del mapa
    longitud_max: 0.90
    anchura_celdas: [4, 9]         # semianchura de la cresta, sorteo por cordillera
    altura_cresta: [0.78, 0.95]    # sorteo por cordillera
    altura_fondo: [0.05, 0.35]     # colinas de fondo (fuera de cordilleras)
    elevacion_escala_celdas: 9     # ruido de las colinas de fondo
    temperatura_base: 0.55         # llanura: temperatura de partida
    gradiente_termico: 0.45        # cuánto enfría la altitud (ley: T = base - g*elev)
    temperatura_ruido_escala_celdas: 8
    temperatura_ruido_amplitud: 0.12
    lluvia_base: 0.58              # lluvia sin sombra orográfica
    lluvia_sombra_celdas: 6        # alcance del viento al cargar contra relieve
    lluvia_sombra_fuerza: 0.65
    lluvia_ruido_escala_celdas: 8
    lluvia_ruido_amplitud: 0.2
    # El viento dominante NO se configura: se sortea por semilla entre los
    # cuatro rumbos cardinales (nucleo/orografia.py:sortear_viento_dominante).

relieve:
  # (2026-08-29, RECALIBRADO tras auditoria) La calibracion anterior
  # (0.05/0.22) se midio contra el terreno de ruido puro, previo al
  # circulo de generacion causal (cordilleras, 27-08) -- el relieve real
  # de hoy es mas suave de lo que esos valores asumian (un lobo nunca se
  # bloqueaba por pendiente, 0% de los pasos). Recalibrado con el MISMO
  # criterio de diseño original (nucleo/relieve.py, ver su docstring):
  # fuerza minima representativa (gnomo, extremo bajo de su rango
  # racial, ~0.2) bloqueada ~p87 de las subidas reales; fuerza maxima
  # representativa (lobo, extremo alto, ~0.9) bloqueada ~p99. Medido
  # contra 15 semillas (mapa 40x40, generador causal actual): mediana
  # 0.0111, p87 0.0517, p99 0.1426, maximo 0.2084 (23177 subidas
  # positivas muestreadas). PROVISIONAL: quince semillas de percentiles,
  # no el harness completo de 15 semillas x 12000 ticks con efecto real
  # sobre movimiento/mortalidad observado -- mismo estatus que la
  # calibracion que sustituye.
  pendiente_minima_transitable: 0.0257
  pendiente_maxima_transitable: 0.1556
  costo_resistencia_por_unidad_pendiente: 0.3
