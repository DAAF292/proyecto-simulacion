# ==============================================================================
# config/relaciones.yaml
# Relaciones interpersonales (vinculos con afinidad) -- ver
# componentes/relaciones.py, nucleo/relaciones.py y
# docs/superpowers/specs/2026-09-04-cimiento-relaciones-design.md.
#
# Este circulo (2026-09-04) escribe afinidad en AMBOS signos:
# negativa por rencor (consumidor sistema_movimiento.py) y positiva por
# amistad de convivencia (consumidor sistema_asentamiento.py). Nadie
# LEE Relaciones para cambiar comportamiento todavia.
# ==============================================================================

relaciones:
  # Capacidad FIFO de vinculos por individuo (nucleo/relaciones.py:
  # capacidad_vinculos), interpolada por CapacidadMental.memoria entre
  # min y max. PROVISIONAL, sin calibrar contra el harness completo.
  min_vinculos_por_individuo: 2
  max_vinculos_por_individuo: 6
  # Magnitud (NEGATIVA) del rencor que genera cada disputa por refugio
  # ocupado (consumidor: sistema_movimiento.py:_resolver_posible_intruso).
  # PROVISIONAL.
  delta_rencor_disputa: -0.25
  # Magnitud (POSITIVA) de la amistad que gana cada dia un par de
  # miembros CONSCIENTES del mismo asentamiento por convivencia
  # (consumidor: sistema_asentamiento.py). PROVISIONAL, sin calibrar:
  # con 0.05/dia, dos convivientes llegan al tope 1.0 en 20 dias.
  delta_amistad_convivencia_dia: 0.05
  # Magnitud (POSITIVA) de la afinidad que ganan mutuamente LOS DOS
  # progenitores en el instante de una concepcion exitosa (consumidor:
  # sistema_reproduccion.py, circulo 4a -- "afinidad por concepcion").
  # Reutiliza el mismo cimiento Relaciones que rencor y amistad: un
  # consciente escribe aunque la otra parte no lo sea. PROVISIONAL, sin
  # calibrar.
  delta_afinidad_concepcion: 0.15
  # Umbral de "pareja estable" (2026-09-04, circulo 4b -- ver
  # nucleo/relaciones.py:son_pareja). Dos individuos son pareja si la
  # afinidad supera este umbral en AMBAS direcciones. PROVISIONAL, sin
  # calibrar contra el harness completo: una sola concepcion (0.15) no
  # basta sola; hacen falta dos o mas concepciones/amistad entre la
  # misma pareja.
  umbral_pareja: 0.3
