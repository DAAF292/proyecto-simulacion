# ==============================================================================
# config/relaciones.yaml
# Relaciones interpersonales (vinculos con afinidad) -- ver
# componentes/relaciones.py, nucleo/relaciones.py y
# docs/superpowers/specs/2026-09-04-cimiento-relaciones-design.md.
#
# Este circulo (2026-09-04) escribe afinidad en AMBOS signos:
# negativa por rencor (consumidor sistema_movimiento.py) y positiva por
# amistad de convivencia (consumidor sistema_asentamiento.py).
# CORREGIDO 2026-09-07 -- este parrafo decia "nadie LEE Relaciones para
# cambiar comportamiento todavia", desactualizado desde pareja estable
# (circulo 4b, 2026-09-04): ya hay dos consumidores reales que LEEN
# afinidad para decidir algo -- pareja estable (bono de confort/
# seguridad por cercania) y compartir por confianza (mas abajo,
# umbral_confianza_compartir).
# ==============================================================================

relaciones:
  # Capacidad FIFO de vinculos por individuo (nucleo/relaciones.py:
  # capacidad_vinculos), interpolada por CapacidadMental.memoria entre
  # min y max. PROVISIONAL, sin calibrar contra el harness completo.
  #
  # Subido de 2/6 a 4/12 (2026-09-07, hallazgo de revision de codigo
  # independiente tras cerrar el arco de "capa de comunicacion"): el valor
  # original se fijo cuando solo rencor y amistad escribian aqui. Con
  # rumor social escribiendo sobre TERCEROS al azar en cada encuentro
  # (la fuente de escritura mas frecuente de las 7 que comparten esta
  # misma capacidad), medido en el motor real que de 2391 contactos de
  # SOCIALIZAR solo 10 vinculos positivos sobrevivian al final -- el FIFO
  # expulsaba las relaciones "reales" casi tan rapido como se creaban.
  # Sigue PROVISIONAL, sin calibrar contra el harness completo.
  min_vinculos_por_individuo: 4
  max_vinculos_por_individuo: 12
  # Magnitud (NEGATIVA) del rencor que genera cada disputa por refugio
  # ocupado (consumidor: sistema_movimiento.py:_resolver_posible_intruso).
  # PROVISIONAL.
  delta_rencor_disputa: -0.25
  # Magnitud (POSITIVA) de la lealtad diaria de un miembro NO-lider hacia
  # su(s) lider(es) actual(es) por gobernar (2026-09-06, circulo 5b -- ver
  # docs/superpowers/specs/2026-09-06-lealtad-liderazgo-design.md).
  # Consumidor: sistema_asentamiento.py:_acrecion_lealtad_liderazgo. Mismo
  # patron que delta_amistad_convivencia_dia (0.05/dia) pero dirigido
  # especificamente miembro->lider (los seguidores admiran al lider, no
  # necesariamente al reves -- no se autora reciprocidad). PROVISIONAL, sin
  # calibrar: algo menor que la amistad de convivencia porque admirar a un
  # lider es mas especifico que la convivencia general del grupo.
  delta_lealtad_liderazgo: 0.03
  # Magnitud (POSITIVA) de la amistad que gana cada dia un par de
  # miembros CONSCIENTES del mismo asentamiento por convivencia
  # (consumidor: sistema_asentamiento.py). PROVISIONAL, sin calibrar:
  # con 0.05/dia, dos convivientes llegan al tope 1.0 en 20 dias.
  delta_amistad_convivencia_dia: 0.05
  # Magnitud (POSITIVA) de la afinidad que ganan mutuamente LOS DOS
  # progenitores en el instante de una concepcion exitosa (consumidor:
  # sistema_reproduccion.py, circulo 4a -- "afinidad por concepcion").
  # Reutiliza el mismo cimiento Relaciones que rencor y amistad: un
  # consciente escribe aunque la otra parte no lo sea. PROVISIONAL, sin
  # calibrar.
  delta_afinidad_concepcion: 0.15
  # Magnitud (POSITIVA) de la afinidad que ganan MUTUAMENTE los dos
  # conscientes cada vez que SOCIALIZAR resuelve contacto a distancia 0
  # (consumidor: sistema_movimiento.py:_calcular_socializar, circulo de
  # ocio consciente 2026-09-06). Mas pequena que
  # delta_amistad_convivencia_dia (0.05/dia) porque esto puede dispararse
  # cada tick que la pareja siga junta, no una vez al dia; sin cooldown ni
  # tope de repeticion por pareja -- aceptado explicitamente por la spec
  # (la afinidad ya se autocapa en [-1, 1]). PROVISIONAL, sin calibrar.
  delta_afinidad_socializar: 0.02
  # Umbral de "pareja estable" (2026-09-04, circulo 4b -- ver
  # nucleo/relaciones.py:son_pareja). Dos individuos son pareja si la
  # afinidad supera este umbral en AMBAS direcciones. PROVISIONAL, sin
  # calibrar contra el harness completo: una sola concepcion (0.15) no
  # basta sola; hacen falta dos o mas concepciones/amistad entre la
  # misma pareja.
  umbral_pareja: 0.3
  # Fraccion del camino que el receptor recorre hacia la opinion reportada
  # del emisor en un rumor social (2026-09-06, circulo 5a -- ver spec
  # docs/superpowers/specs/2026-09-06-rumor-social-design.md y consumidor
  # sistema_movimiento.py:_compartir_rumor). No es una sustitucion completa:
  # mismo espiritu que la degradacion de segunda mano de memoria espacial
  # compartida. PROVISIONAL, sin calibrar.
  peso_credibilidad_rumor: 0.15
  # Compartir por confianza (2026-09-07, circulo 4 del arco "robo/
  # intercambio de recursos" -- ver docs/superpowers/specs/
  # 2026-09-07-robo-compartir-confianza-design.md). Sustituye al trueque
  # bidireccional real, descartado por Diego en esta ronda -- mismo
  # patron que disposicion_a_aportar (almacen comunal) pero entre dos
  # individuos. Lectura UNIDIRECCIONAL de afinidad (donante hacia
  # receptor, sin exigir reciprocidad) -- no escribe Relaciones como
  # consecuencia. Los tres valores PROVISIONALES, sin calibrar.
  umbral_confianza_compartir: 0.3
  probabilidad_base_compartir_confianza: 0.05
  saciedad_maxima_para_recibir_compartido: 0.5
  # Decaimiento de afinidad (2026-09-11): hasta ahora rencor/amistad/
  # pareja solo se acumulaban, nunca se diluian con el tiempo -- hueco
  # senalado desde el cimiento (2026-09-04) y repetido en las tres
  # piezas que lo consumen. Ley simetrica y neutra (mismo ritmo para
  # positivo y negativo, sin razon fisica para que un agravio dure mas
  # que un afecto) -- consumidor: sistema_descomposicion.py, cadencia
  # diaria, mismo criterio que Necromasa/Construccion/provisiones
  # ("nada dura para siempre"). Multiplicativo (fraccion hacia 0), no
  # lineal -- con 0.02/dia una relacion sin reforzar cae a la mitad en
  # ~34 dias; una activamente reforzada (p.ej. amistad de convivencia,
  # +0.05/dia) sigue creciendo neta. PROVISIONAL, sin calibrar.
  tasa_decaimiento_dia_afinidad: 0.02
  # Vinculos que decaen por debajo de este umbral se purgan (liberan
  # cupo), mismo criterio de purga que umbral_purga_masa en
  # descomposicion. PROVISIONAL.
  umbral_purga_afinidad: 0.02
