# ==============================================================================
# config/flora.yaml
# Botánica, fertilidad edáfica y descomposición
#
# Parte del catálogo de configuración del motor "Un mundo vivo", antes unificado
# en un único config/constantes.yaml (dividido en ficheros por categoría el
# 2026-08-30, a petición de Diego) -- todos los ficheros de config/*.yaml se
# cargan y fusionan en un solo diccionario (main.py:cargar_configuracion), así
# que ninguna sección cambia de nombre ni de forma de acceso al dividirse.
# ==============================================================================

abono:
  incremento_fertilidad_por_aliviarse: 0.2
  techo_fertilidad: 1.0
  # (2026-08-29, fix de auditoria) Esta clave estaba declarada -- y el
  # propio docstring de Celda.fertilidad decia literalmente "decae con el
  # tiempo (cadencia de dia)" -- pero ningun archivo Python la leia
  # (confirmado por grep, cero resultados): fertilidad solo podia subir,
  # nunca bajaba. Mismo patron que tasa_perdida_seguridad_por_amenaza
  # antes de hoy. Ahora sistema_flora.py la aplica de verdad, una vez al
  # dia, sobre la celda de cada planta procesada.
  decaimiento_fertilidad_por_dia: 0.1

descomposicion:
  # CÍRCULO 2 de materiales físicos (2026-08-30, ver componentes/necromasa.py
  # y config/materiales.yaml): constante_degradacion_base RETIRADA -- cada
  # material de Necromasa.masas ya trae su propia tasa_descomposicion_dia
  # (materiales.tejido_blando/hueso), no una única tasa uniforme para todo
  # el cadáver. tejido_blando.tasa_descomposicion_dia hereda el MISMO
  # valor 0.08 que tenía esta constante -- ancla de continuidad, no una
  # recalibración desde cero.
  #
  # fraccion_masa_seca_por_defecto/fraccion_agua_tisular_por_defecto: antes
  # vivían como literales 0.35/0.65 duplicados sin config detrás en CUATRO
  # sitios distintos (sistema_necesidades.py, sistema_ciclo_vital.py,
  # sistema_depredacion.py, más las variantes propias de
  # desastres.fraccion_masa_seca_quemada/fraccion_agua_tisular_quemada para
  # cadáveres calcinados) -- consolidados aquí de paso al tocar los cuatro
  # sitios para el reparto tejido_blando/hueso, un único origen para lo que
  # antes eran cuatro copias del mismo número mágico.
  fraccion_masa_seca_por_defecto: 0.35
  fraccion_agua_tisular_por_defecto: 0.65
  # fraccion_hueso_de_masa_seca: qué parte de la masa seca de un cadáver
  # es hueso frente a tejido blando -- orden de magnitud real (el
  # esqueleto es aproximadamente 12-20% de la masa corporal seca en
  # vertebrados), no medido contra el motor. PROVISIONAL, valor de
  # partida razonado. Misma fracción para muerte natural y calcinada --
  # no se modela que el fuego destruya el tejido blando de forma
  # preferencial (simplificación deliberada, señalada, no resuelta).
  fraccion_hueso_de_masa_seca: 0.15
  masa_referencia_fertilidad: 10.0
  umbral_purga_masa: 0.05
  factor_humedad_lluvia: 1.3
  factor_humedad_seco: 0.8

flora:
  # CÍRCULO 1 de materiales físicos (2026-08-30, Diego: "no estaría ya
  # obsoleto el bono ribera? si implementamos capilaridad el bono de
  # humedad subsuelo funcionaria igual"). Retira bono_produccion_ribera y
  # el antiguo factor_ribera -- una celda con agua permanente sigue dando
  # el mismo bono de siempre (Celda.humedad_subsuelo se fija a saturación
  # en generación para esas celdas), ahora como consecuencia de una ley
  # general de humedad en vez de un caso especial hardcodeado. Mismo valor
  # numérico que el bono retirado -- ancla de continuidad, no una
  # recalibración desde cero (ver nucleo/flora.py:factor_humedad_subsuelo).
  bono_produccion_humedad_subsuelo: 0.2
  tasa_retorno_mantillo: 0.05
  # SOBREFORRAJEO (2026-08-29, investigacion de sobrepoblacion, confirmado
  # con Diego -- "un sobreforrajeo deberia afectar de algun modo a los
  # recursos, pero ahora la flora sigue eternamente produciendo sin mas").
  # Diagnostico: el recurso de una celda SI se agota de verdad al comer
  # (sistema_recursos.py resta cada bocado), pero la produccion diaria
  # (mas abajo en este mismo modulo) rellenaba cada planta madura con el
  # mismo incremento fijo cada dia sin importar cuanta presion de consumo
  # hubiera sufrido -- y la propagacion seguia colonizando celdas nuevas
  # sin limite, asi que la CAPACIDAD AGREGADA del mapa solo podia crecer,
  # nunca encogerse: verificado que hierba y raices (compartidas por
  # gnomo/conejo/ardilla) CRECIAN durante toda una corrida de 6000 ticks
  # pese a que la poblacion de conejo pasaba de 30 a 1349 individuos.
  #
  # Contramedida: si una planta madura amanece con su recurso de alimento
  # en 0.0 (agotado por completo desde el ultimo corte de dia, sin haber
  # llegado a regenerar nada) durante dias_agotada_para_regresion dias
  # SEGUIDOS, se considera sobreforrajeo sostenido (no un bache de un
  # solo dia) y la planta RETROCEDE a etapa_tras_sobreforrajeo -- el mismo
  # valor de "brote recien colonizado" que ya usa la propagacion -- en vez
  # de seguir madura: dejara de producir hasta volver a crecer con su
  # propia tasa_crecimiento_por_dia, el mismo mecanismo que ya rige a
  # cualquier planta inmadura. Reutiliza la maquinaria de crecimiento
  # existente en vez de inventar un sistema de "salud de planta" nuevo.
  # PROVISIONAL: umbral y valor de regresion son una hipotesis de partida
  # razonada, sin calibrar contra el harness completo.
  dias_agotada_para_regresion: 2
  etapa_tras_sobreforrajeo: 0.1
  # fraccion_siembra_inicial (PROVISIONAL, calibración numérica -- ver
  # diagnóstico de inanición 2026-08-23, nucleo/entidad.py:sembrar_flora_inicial
  # y main.py): fracción de las celdas tiene_recurso=True de cada especie
  # que reciben una entidad Planta fundadora (etapa=1.0) al generar el
  # mundo. Sin esto, sistema_flora.py nunca tiene ninguna Planta que
  # procesar -- crear_planta solo se invoca desde la propagación, que
  # necesita una Planta YA existente para disparerse, así que sin siembra
  # inicial el conteo de Plantas es cero para siempre y toda la comida del
  # mundo es un fondo fijo no renovable (celda.recursos se rellena a
  # capacidad_maxima en la generación y sistema_recursos.py lo consume
  # directamente, sin depender de ninguna entidad). Valor por defecto sin
  # calibrar contra el motor en marcha todavía -- hipótesis de partida,
  # pendiente de contrastar con el harness de calibración ligera.
  fraccion_siembra_inicial: 0.08
  # umbral_minimo_idoneidad_colonizacion (2026-09-01, ver docs/superpowers/
  # specs/2026-09-01-distribucion-causal-flora-design.md): idoneidad
  # mínima (nucleo/flora.py:idoneidad_colonizacion) que una especie debe
  # superar para colonizar una celda -- por debajo, la celda se queda sin
  # vegetación en vez de forzar una especie que no encaja. PROVISIONAL,
  # sin calibrar contra el harness completo.
  umbral_minimo_idoneidad_colonizacion: 0.2
  especies:
    hierba_silvestre:
      biomas: [pradera, bosque]
      tasa_crecimiento_por_dia: 0.25
      prob_propagacion_por_dia: 0.06
      preferencia_lluvia: [0.25, 0.85]
      preferencia_temperatura: [0.25, 0.85]
      preferencia_fertilidad: [0.2, 0.8]
      recursos:
        - nombre: raices
          categoria: alimento
          capacidad_maxima: 10.0
          tasa_regeneracion: 0.5
          valor_nutricional: 0.15
          valor_hidratacion: 0.08
        - nombre: hierba
          categoria: alimento
          capacidad_maxima: 8.0
          tasa_regeneracion: 0.4
          valor_nutricional: 0.12
          valor_hidratacion: 0.12
        # hierba_seca (2026-08-31, propuesta de Diego: "arrancan hierba
        # directamente sin mecanismos complejos de siega") -- MISMO
        # patrón que madera/fibra abajo: material recolectable producido
        # por la propia planta madura, sin destruir la Planta ni
        # necesitar una acción de siega dedicada. capacidad_maxima/
        # tasa_regeneracion PROVISIONALES, mismo orden de magnitud que
        # "hierba" (alimento) de esta misma especie -- sin calibrar
        # contra el motor en marcha.
        - nombre: hierba_seca
          categoria: material
          capacidad_maxima: 6.0
          tasa_regeneracion: 0.15
    manzano:
      biomas: [bosque]
      tasa_crecimiento_por_dia: 0.08
      prob_propagacion_por_dia: 0.02
      preferencia_lluvia: [0.55, 1.0]
      preferencia_temperatura: [0.3, 0.75]
      preferencia_fertilidad: [0.4, 0.9]
      recursos:
        - nombre: manzanas
          categoria: alimento
          capacidad_maxima: 5.0
          tasa_regeneracion: 0.2
          valor_nutricional: 0.4
          valor_hidratacion: 0.15
        # madera (2026-08-31, propuesta de Diego: "los árboles dejan
        # caer ramas que los gnomos recogen") -- ya declarada desde el
        # círculo de materiales físicos, sin capacidad_maxima/
        # tasa_regeneracion hasta hoy (por eso sistema_flora.py la
        # ignoraba). Ritmo deliberadamente más lento que las manzanas de
        # esta misma especie (0.2/día) -- una rama caída es un recurso
        # más escaso que la fruta. PROVISIONAL, sin calibrar.
        - nombre: madera
          categoria: material
          capacidad_maxima: 6.0
          tasa_regeneracion: 0.1
    cactus:
      biomas: [desierto]
      tasa_crecimiento_por_dia: 0.05
      prob_propagacion_por_dia: 0.015
      preferencia_lluvia: [0.0, 0.2]
      preferencia_temperatura: [0.5, 1.0]
      preferencia_fertilidad: [0.0, 0.3]
      recursos:
        - nombre: fruto_de_cactus
          categoria: alimento
          capacidad_maxima: 4.0
          tasa_regeneracion: 0.15
          valor_nutricional: 0.35
          valor_hidratacion: 0.2
        # fibra (2026-08-31): ya declarada desde el círculo de
        # materiales físicos, sin numérica hasta hoy -- mismo criterio
        # que madera arriba. PROVISIONAL, sin calibrar.
        - nombre: fibra
          categoria: material
          capacidad_maxima: 4.0
          tasa_regeneracion: 0.1
    liquen:
      biomas: [montana]
      tasa_crecimiento_por_dia: 0.03
      prob_propagacion_por_dia: 0.01
      preferencia_lluvia: [0.1, 0.5]
      preferencia_temperatura: [0.0, 0.4]
      preferencia_fertilidad: [0.0, 0.2]
      recursos:
        - nombre: liquen
          categoria: alimento
          capacidad_maxima: 3.0
          tasa_regeneracion: 0.1
          valor_nutricional: 0.2
          valor_hidratacion: 0.03
    musgo:
      biomas: [tundra]
      tasa_crecimiento_por_dia: 0.03
      prob_propagacion_por_dia: 0.01
      preferencia_lluvia: [0.2, 0.6]
      preferencia_temperatura: [0.0, 0.15]
      preferencia_fertilidad: [0.0, 0.3]
      recursos:
        - nombre: musgo
          categoria: alimento
          capacidad_maxima: 3.0
          tasa_regeneracion: 0.1
          valor_nutricional: 0.2
          valor_hidratacion: 0.04
